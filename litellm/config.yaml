# Gateway de modelos dos agentes [ADR-004, TASK-004]. Origem dos aliases do Conciliador:
# conciliador-contabil@2bc6e26 (litellm/config.yaml).
#
# Aliases: um por agente, com o modelo vindo do .env (<ALIAS>_MODEL, formato provedor/modelo).
# A chave NÃO fica por alias: o LiteLLM usa a variável do provedor do modelo (OPENAI_API_KEY,
# ANTHROPIC_API_KEY), que só existe no ambiente deste container. O parser_pgdas não tem alias:
# é determinístico (ADR-006).
#
# Rotas por provedor (openai/*, anthropic/*): a aplicação resolve o alias no início de cada
# corrida (padrão do .env ou escolha da tela Configurações → IA) e chama o gateway com o modelo
# concreto. A troca de modelo vale para novas corridas sem reiniciar nada, e a corrida em
# andamento mantém o modelo resolvido no início [spec 07 F-010].
model_list:
  - model_name: triador
    litellm_params:
      model: os.environ/TRIADOR_MODEL
  - model_name: extrator
    litellm_params:
      model: os.environ/EXTRATOR_MODEL
  - model_name: extrator_forte
    litellm_params:
      model: os.environ/EXTRATOR_FORTE_MODEL
  - model_name: resolvedor
    litellm_params:
      model: os.environ/RESOLVEDOR_MODEL
  - model_name: classificador
    litellm_params:
      model: os.environ/CLASSIFICADOR_MODEL
  - model_name: consultor
    litellm_params:
      model: os.environ/CONSULTOR_MODEL
  - model_name: priorizador
    litellm_params:
      model: os.environ/PRIORIZADOR_MODEL

  - model_name: openai/*
    litellm_params:
      model: openai/*
  - model_name: anthropic/*
    litellm_params:
      model: anthropic/*

litellm_settings:
  drop_params: true

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
