# Hot reload do worker no container de desenvolvimento (make dev). Mesmo binário da API, subcomando
# `worker`. Diretório de build próprio: a API (.air.toml) usa tmp/ e o apaga ao sair.
root = "."
tmp_dir = "tmp-worker"

[build]
  cmd = "go build -o ./tmp-worker/api ./cmd/api"
  entrypoint = ["./tmp-worker/api", "worker"]
  include_ext = ["go", "sql", "yaml"]
  exclude_dir = ["tmp", "tmp-worker", "bin", "testdata"]
  exclude_regex = ["_test\\.go$"]
  delay = 500
  # Bind mount no macOS e no Windows: polling é mais confiável que eventos do sistema de arquivos.
  poll = true
  poll_interval = 1000
  stop_on_error = true

[log]
  time = false

[misc]
  clean_on_exit = true
