# sqlc: gera código Go tipado (pgx/v5) a partir de queries/ e do schema das migrations.
version: "2"
sql:
  - engine: postgresql
    schema: migrations
    queries: queries
    gen:
      go:
        package: store
        out: internal/store
        sql_package: pgx/v5
        emit_pointers_for_null_types: true
        emit_empty_slices: true
        overrides:
          - db_type: uuid
            go_type: string
          - db_type: uuid
            nullable: true
            go_type:
              type: string
              pointer: true
          - db_type: date
            go_type: time.Time
          - db_type: date
            nullable: true
            go_type:
              import: time
              type: Time
              pointer: true
          - db_type: timestamptz
            go_type: time.Time
          - db_type: timestamptz
            nullable: true
            go_type:
              import: time
              type: Time
              pointer: true
          - db_type: pg_catalog.timestamptz
            go_type: time.Time
          - db_type: pg_catalog.timestamptz
            nullable: true
            go_type:
              import: time
              type: Time
              pointer: true
          # Dinheiro e percentuais: decimal exato, nunca float (ADR-007).
          - db_type: pg_catalog.numeric
            go_type:
              import: controle/internal/platform/decimal
              type: Decimal
          - db_type: pg_catalog.numeric
            nullable: true
            go_type:
              import: controle/internal/platform/decimal
              type: Decimal
              pointer: true
          - db_type: numeric
            go_type:
              import: controle/internal/platform/decimal
              type: Decimal
          - db_type: numeric
            nullable: true
            go_type:
              import: controle/internal/platform/decimal
              type: Decimal
              pointer: true
