  /exports/{file}:
    get:
      tags: [exports]
      operationId: exportModuleGrid
      summary: Exporta a grade do módulo em XLSX com os filtros atuais da tela [PRD §36.1, CA-017]
      description: >-
        `file` é `{module}.xlsx` com module em fiscal (exige group), declarations, payroll, accounting
        ou dctfweb. Reaproveita a grade com os mesmos filtros (inclusive a busca livre `q`); cabeçalho
        com módulo, competência, filtros e data de geração; status em texto, vencimento e atraso por
        obrigação; cabeçalho congelado e autofiltro.
      parameters:
        - name: file
          in: path
          required: true
          schema: { type: string, example: fiscal.xlsx }
        - $ref: "#/components/parameters/GridCompetence"
        - name: group
          in: query
          description: Obrigatório para fiscal.
          schema: { type: string, enum: [normal, simples] }
        - name: q
          in: query
          description: Busca livre (nome, razão social, nome fantasia, código ou CNPJ com ou sem máscara).
          schema: { type: string }
        - $ref: "#/components/parameters/GridTaxRegime"
        - $ref: "#/components/parameters/GridResponsible"
        - $ref: "#/components/parameters/GridStatus"
        - $ref: "#/components/parameters/GridObligationType"
        - $ref: "#/components/parameters/GridClosingStatus"
        - $ref: "#/components/parameters/GridPeriodState"
        - $ref: "#/components/parameters/GridNote"
        - $ref: "#/components/parameters/GridOverdue"
        - $ref: "#/components/parameters/GridPending"
        - $ref: "#/components/parameters/GridNotStarted"
        - $ref: "#/components/parameters/GridReadyToClose"
      responses:
        "200":
          description: Planilha da grade
          headers:
            Content-Disposition:
              schema: { type: string }
              description: attachment; filename="{module}[-{group}]-AAAA-MM.xlsx"
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema: { type: string, format: binary }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }

  /reports/{file}:
    get:
      tags: [exports]
      operationId: downloadReport
      summary: Relatório PDF [PRD §36.2-§36.3]
      description: >-
        `file` é `{report}.pdf`. Todos trazem título, competência, data de geração, filtros, resumo de
        indicadores e a tabela (empresas, obrigações, status e atrasos), sobre as mesmas consultas das
        telas. `general`: situação geral da competência (filtros do dashboard). `pending`: pendências da
        competência por módulo (padrão: aplicáveis não finais; `state` restringe à classe). `overdue`:
        obrigações atrasadas da competência. `backlog`: pendências de competências anteriores à
        informada. `credentials`: procurações e certificados vencidos ou a vencer (`competence`
        opcional; `filter` e `type` como na tela). `module`: controle completo de um módulo (`module`
        obrigatório; no Fiscal, sem `group`, traz Normais e Simples), com os filtros e a busca da grade.
      parameters:
        - name: file
          in: path
          required: true
          schema: { type: string, enum: [general.pdf, pending.pdf, overdue.pdf, backlog.pdf, credentials.pdf, module.pdf] }
        - name: competence
          in: query
          description: AAAA-MM. Obrigatória, exceto em credentials.
          schema: { type: string, pattern: "^\\d{4}-(0[1-9]|1[0-2])$", example: "2026-09" }
        - name: module
          in: query
          description: >-
            module.pdf: fiscal, declarations, payroll, accounting ou dctfweb. pending, overdue e backlog:
            FISCAL, DECLARATIONS, PAYROLL ou ACCOUNTING (opcional).
          schema: { type: string }
        - name: group
          in: query
          description: module.pdf com module=fiscal (opcional).
          schema: { type: string, enum: [normal, simples] }
        - name: regime_group
          in: query
          schema: { type: string, enum: [NORMAL, SIMPLES] }
        - $ref: "#/components/parameters/GridTaxRegime"
        - $ref: "#/components/parameters/GridResponsible"
        - name: state
          in: query
          description: pending, backlog.
          schema: { type: string, enum: [open, applicable, done, in_progress, not_started, pending, overdue] }
        - name: status
          in: query
          schema: { type: string }
        - name: q
          in: query
          description: Busca livre (empresa, código ou CNPJ com ou sem máscara).
          schema: { type: string }
        - name: overdue_min
          in: query
          schema: { type: integer, minimum: 0 }
        - name: overdue_max
          in: query
          schema: { type: integer, minimum: 0 }
        - name: sort
          in: query
          description: backlog.pdf (padrão days_overdue).
          schema: { type: string, enum: [days_overdue, due_date, competence, company] }
        - name: filter
          in: query
          description: credentials.pdf — expired, due_N (1 a 365), awaiting_client ou no_date.
          schema: { type: string }
        - name: type
          in: query
          description: credentials.pdf.
          schema: { type: string, enum: [RFB_POWER_OF_ATTORNEY, DIGITAL_CERTIFICATE] }
      responses:
        "200":
          description: PDF do relatório
          headers:
            Content-Disposition:
              schema: { type: string }
              description: attachment; filename="relatorio-{report}-{sufixo}.pdf"
          content:
            application/pdf:
              schema: { type: string, format: binary }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }

  /dashboard:
    get:
      tags: [dashboard]
      operationId: getDashboard
      summary: KPIs, cards por módulo, vencimentos de credenciais e progresso por responsável (PRD §24.1-§24.5)
      description: |
        Desde a TASK-024 (D-038), também as seções `factor_r` e `reconciliation` (PRD §8, 08 §3),
        com os mesmos filtros: no Fator R, o responsável é o do Fiscal; na Conciliação, o do
        Contábil (decisões do usuário). Cada número traz o drill-down da lista que o explica, com
        os filtros na query.
      parameters:
        - $ref: "#/components/parameters/GridCompetence"
        - $ref: "#/components/parameters/DashboardRegimeGroup"
        - $ref: "#/components/parameters/DashboardTaxRegime"
        - $ref: "#/components/parameters/DashboardResponsible"
      responses:
        "200":
          description: Dashboard da competência
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Dashboard" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }

  /dashboard/attention:
    get:
      tags: [dashboard]
      operationId: getDashboardAttention
      summary: Exige atenção — 11 categorias com contagem, amostra (5) e drill-down (PRD §24.6)
      parameters:
        - $ref: "#/components/parameters/GridCompetence"
        - $ref: "#/components/parameters/DashboardRegimeGroup"
        - $ref: "#/components/parameters/DashboardTaxRegime"
        - $ref: "#/components/parameters/DashboardResponsible"
      responses:
        "200":
          description: Categorias de atenção
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Attention" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }

  /dashboard/history:
    get:
      tags: [dashboard]
      operationId: getDashboardHistory
      summary: Comparação com a competência anterior e série das últimas 6 competências (PRD §24.8)
      parameters:
        - $ref: "#/components/parameters/GridCompetence"
        - $ref: "#/components/parameters/DashboardRegimeGroup"
        - $ref: "#/components/parameters/DashboardTaxRegime"
        - $ref: "#/components/parameters/DashboardResponsible"
      responses:
        "200":
          description: Comparação histórica
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DashboardHistory" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }

  /backlog:
    get:
      tags: [dashboard]
      operationId: listBacklog
      summary: Backlog de competências anteriores (plan R8) ou lista de obrigações da competência por classe (drill-down)
      parameters:
        - { name: before, in: query, description: "Backlog: competências anteriores a esta (AAAA-MM)", schema: { $ref: "#/components/schemas/Competence" } }
        - { name: competence, in: query, description: "Lista: obrigações desta competência (AAAA-MM)", schema: { $ref: "#/components/schemas/Competence" } }
        - name: state
          in: query
          description: Classe das obrigações (padrão open = aplicáveis não finais)
          schema: { type: string, enum: [open, applicable, done, in_progress, not_started, pending, overdue] }
        - { name: module, in: query, schema: { type: string, enum: [FISCAL, DECLARATIONS, PAYROLL, ACCOUNTING] } }
        - { name: status, in: query, schema: { type: string } }
        - $ref: "#/components/parameters/DashboardResponsible"
        - $ref: "#/components/parameters/DashboardRegimeGroup"
        - $ref: "#/components/parameters/DashboardTaxRegime"
        - { name: q, in: query, description: "Empresa, código ou CNPJ (com ou sem máscara)", schema: { type: string } }
        - { name: company_id, in: query, description: "Só a empresa (a aba Obrigações da ficha; TASK-025, D-039)", schema: { $ref: "#/components/schemas/Uuid" } }
        - { name: overdue_min, in: query, schema: { type: integer, minimum: 0 } }
        - { name: overdue_max, in: query, schema: { type: integer, minimum: 0 } }
        - { name: sort, in: query, schema: { type: string, enum: [days_overdue, due_date, competence, company], default: days_overdue } }
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: page_size, in: query, schema: { type: integer, minimum: 1, maximum: 500, default: 100 } }
      responses:
        "200":
          description: Itens
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Backlog" }
        "400": { $ref: "#/components/responses/BadRequest" }

  /companies/{id}/overview:
    parameters:
      - $ref: "#/components/parameters/IdPath"
    get:
      tags: [companies]
      operationId: getCompanyOverview
      summary: Visão geral da empresa na competência [08 §5; TASK-025, D-039]
      description: |
        A ficha como hub: o progresso por módulo, as próximas obrigações a vencer (as atrasadas
        primeiro), o Fator R no PA igual à competência com a ação sugerida e a tendência dos
        últimos seis PAs (só se a empresa está na carteira), a Conciliação da competência (só se a
        empresa a usa ou tem item na fila) e as pendências do "Exige atenção" só da empresa. Tudo
        da mesma empresa (`companies.id`). Numa competência ainda não gerada (um PA futuro),
        `competence_generated` é falso e só o Fator R e a Conciliação vêm.
      parameters:
        - { name: competence, in: query, required: true, schema: { $ref: "#/components/schemas/Competence" } }
      responses:
        "200":
          description: Visão geral
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CompanyOverview" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }

  /company-indicators:
    get:
      tags: [companies]
      operationId: getCompanyIndicators
      summary: Indicadores compactos da listagem de empresas [08 §4; TASK-025, D-039]
      description: |
        Por empresa com algum indicador na competência: o semáforo do Fator R (as monitoradas no
        PA), o estado da conciliação (quem usa a Conciliação) e os alertas críticos (obrigações
        atrasadas na competência e credenciais vencidas). Uma consulta por fonte, sem N+1.
      parameters:
        - { name: competence, in: query, required: true, schema: { $ref: "#/components/schemas/Competence" } }
      responses:
        "200":
          description: Indicadores
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CompanyIndicatorList" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }

  /documents:
    get:
      tags: [documents]
      operationId: listDocumentIndex
      summary: A área Documentos consolidada [06 §6, 08 §8; TASK-026, D-040]
      description: |
        Índice de navegação sobre os documentos de cada módulo, sem tabela nova nem cópia de
        arquivo (REQ-037, REQ-043, REQ-044): os extratos do PGDAS-D do Fator R (armazenamento
        local), os documentos da Conciliação (MinIO) e os arquivos de procuração e certificado do
        Controle (armazenamento local). Cada documento traz o status do seu módulo e a situação
        comum de leitura (decisão do usuário): Fator R — `received` e `parsed` em processamento,
        `needs_review` em revisão, `linked` concluído, `rejected` descartado; Conciliação —
        `pendente` e `triado` em processamento, as revisões e `pendencia_periodo_fechado` em
        revisão, `extraido` e `importado` concluídos, `duplicado` descartado; Controle — o arquivo,
        `arquivado`. `detail` é a tela do módulo que abre o documento. O status do módulo só vale
        com o módulo escolhido. A competência casa com o PA do PGDAS-D e com a competência ou o
        período do documento da Conciliação (os arquivos do Controle não têm competência).
      parameters:
        - { name: module, in: query, schema: { $ref: "#/components/schemas/DocumentModule" } }
        - { name: company_id, in: query, schema: { $ref: "#/components/schemas/Uuid" } }
        - { name: competence, in: query, schema: { $ref: "#/components/schemas/Competence" } }
        - { name: kind, in: query, schema: { $ref: "#/components/schemas/DocumentKind" } }
        - { name: status, in: query, description: "Status do módulo (exige module)", schema: { type: string } }
        - { name: situation, in: query, schema: { $ref: "#/components/schemas/DocumentSituation" } }
        - { name: bank, in: query, description: "Banco lido no documento da Conciliação (sem diferenciar maiúsculas)", schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0, default: 0 } }
      responses:
        "200":
          description: Uma página do índice, o mais recente primeiro
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DocumentIndex" }
        "400": { $ref: "#/components/responses/BadRequest" }

  /companies/{id}/history:
    parameters:
      - $ref: "#/components/parameters/IdPath"
    get:
      tags: [companies]
      operationId: getCompanyHistory
      summary: Histórico de competências da empresa — matriz competência × módulo com estado, conclusão e eventos
      responses:
        "200":
          description: Histórico
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CompanyHistory" }
        "404": { $ref: "#/components/responses/NotFound" }

  /factor-r/portfolio:
    get:
      tags: [factor-r]
      operationId: getFactorRPortfolio
      summary: Carteira do Fator R no PA, ordenada por semáforo e economia [REQ-011, AC-007]
      description: |
        Empresas ativas, sujeitas ao Fator R (`companies.factor_r`) e no Simples Nacional no PA
        (D-017). Ordem: vermelho, amarelo, verde e dados insuficientes; dentro de cada grupo, a
        maior economia primeiro e depois o nome. Os filtros de empresa do Dashboard valem pelo
        snapshot da competência do PA, com o responsável do Fiscal; com eles, os KPIs são os das
        empresas filtradas (TASK-024, D-038).
      parameters:
        - $ref: "#/components/parameters/FactorRPA"
        - $ref: "#/components/parameters/CompanyFilterRegimeGroup"
        - $ref: "#/components/parameters/CompanyFilterTaxRegime"
        - { name: responsible_id, in: query, description: "Responsável do Fiscal da empresa (snapshot da competência do PA)", schema: { $ref: "#/components/schemas/Uuid" } }
      responses:
        "200":
          description: Carteira
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FactorRPortfolio" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "422":
          description: Não há tabela do Simples vigente no PA (SIMPLES_TABLE_NOT_IN_FORCE)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /companies/{id}/factor-r/settings:
    parameters:
      - $ref: "#/components/parameters/IdPath"
    get:
      tags: [factor-r]
      operationId: getFactorRSettings
      summary: Configuração do Fator R da empresa (padrões e `version = 0` se ainda não gravada)
      responses:
        "200":
          description: Configuração
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FactorRSettings" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [factor-r]
      operationId: updateFactorRSettings
      summary: Altera a configuração do Fator R da empresa
      description: |
        Só os campos enviados mudam; `null` limpa. `version = 0` cria a configuração. "Sujeita ao
        Fator R" não fica aqui: é o `factor_r` do cadastro (`PATCH /companies/{id}`, D-017).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FactorRSettingsUpdate" }
      responses:
        "200":
          description: Configuração gravada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FactorRSettings" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /companies/{id}/factor-r/movements:
    parameters:
      - $ref: "#/components/parameters/IdPath"
    get:
      tags: [factor-r]
      operationId: listFactorRMovements
      summary: Série mensal de receita e folha da empresa, em ordem de competência [REQ-009]
      parameters:
        - name: from
          in: query
          description: Primeira competência (inclusive); ausente = desde o início
          schema: { $ref: "#/components/schemas/Competence" }
        - name: to
          in: query
          description: Última competência (inclusive); ausente = até a última
          schema: { $ref: "#/components/schemas/Competence" }
      responses:
        "200":
          description: Movimentos
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FactorRMovementList" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }

  /companies/{id}/factor-r/movements/{competence}:
    parameters:
      - $ref: "#/components/parameters/IdPath"
      - name: competence
        in: path
        required: true
        schema: { $ref: "#/components/schemas/Competence" }
    put:
      tags: [factor-r]
      operationId: putFactorRMovement
      summary: Lança o mês à mão (cria ou substitui a competência inteira, com origem manual)
      description: |
        Valor ausente vale `0.00`. `version = 0` cria o mês. Um mês do PGDAS-D lançado de novo à
        mão ("Detalhar folha") perde a folha total declarada e passa a ter a divisão informada.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FactorRMovementInput" }
      responses:
        "200":
          description: Mês gravado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FactorRMovement" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /companies/{id}/factor-r/calc:
    parameters:
      - $ref: "#/components/parameters/IdPath"
    get:
      tags: [factor-r]
      operationId: getFactorRCalc
      summary: Fator R da empresa no PA — janela, RBT12, FS12, anexo, metas, gaps, alíquotas e economia [AC-005]
      description: |
        Cálculo determinístico, por código (motor portado da origem, ADR-007). Com dados
        insuficientes (`status = dados_insuficientes`), anexo, alíquotas e economia ficam nulos.
      parameters:
        - $ref: "#/components/parameters/FactorRPA"
      responses:
        "200":
          description: Resultado do cálculo
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FactorRCalc" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422":
          description: Não há tabela do Simples vigente no PA (SIMPLES_TABLE_NOT_IN_FORCE)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /companies/{id}/factor-r/simulations:
    parameters:
      - $ref: "#/components/parameters/IdPath"
    post:
      tags: [factor-r]
      operationId: createFactorRSimulation
      summary: Simula a correção da folha até a meta e grava a simulação no trace [REQ-013, AC-010]
      description: |
        Todo valor é calculado pelo motor e pelo simulador portados (nunca pelo LLM). A simulação
        roda numa corrida do agente consultor (gatilho `ficha`, sem LLM) e fica no trace: é ela que
        autoriza uma recomendação "corrigir". Parâmetros ausentes usam os padrões da origem: meta
        da política, pró-labore 100% do reforço, INSS 11%, IRRF 27,5% e 12 meses.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FactorRSimulationInput" }
      responses:
        "201":
          description: Simulação gravada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FactorRSimulation" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422":
          description: Não há tabela do Simples vigente no PA (SIMPLES_TABLE_NOT_IN_FORCE)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    get:
      tags: [factor-r]
      operationId: listFactorRSimulations
      summary: Histórico de simulações da empresa, mais recentes primeiro
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 50, default: 10 }
      responses:
        "200":
          description: Simulações
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FactorRSimulationList" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }

  /factor-r/agents/consult:
    post:
      tags: [factor-r]
      operationId: consultFactorRAgent
      summary: Agente consultor — situação, simulação ou explicação para uma empresa [REQ-014]
      description: |
        O LLM (alias `consultor`, pelo LiteLLM) só classifica a intenção e redige o texto a partir
        da decisão já calculada. O texto é validado contra a decisão: número, data ou palavra de
        valor que não está nela, ou recomendação que contradiz o veredito, faz a resposta usar o
        template. Sem LLM (gateway fora, alias desligado), a intenção vem de palavras-chave e o
        texto do template. "Corrigir" só com simulação gravada (409
        `RECOMMENDATION_WITHOUT_SIMULATION`). Toda resposta traz o disclaimer do PGDAS-D.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FactorRConsultInput" }
      responses:
        "200":
          description: Resposta do agente
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FactorRAgentResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422":
          description: Não há tabela do Simples vigente no PA (SIMPLES_TABLE_NOT_IN_FORCE)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /factor-r/agents/prioritize:
    post:
      tags: [factor-r]
      operationId: prioritizeFactorRAgent
      summary: Agente priorizador — fila da carteira (Anexo V e entre 28% e a meta) por economia de DAS [REQ-014]
      description: |
        Só lê a carteira calculada; não altera nada. O LLM (alias `priorizador`) só classifica e
        redige, com a mesma validação do consultor. O worker também registra a fila uma vez por
        semana, aos domingos, sem LLM (gatilho `rotina`).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FactorRPrioritizeInput" }
      responses:
        "200":
          description: Resposta do agente
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FactorRAgentResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "422":
          description: Não há tabela do Simples vigente no PA (SIMPLES_TABLE_NOT_IN_FORCE)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /factor-r/pgdas:
    post:
      tags: [factor-r]
      operationId: uploadPgdasDocument
      summary: Envia um extrato PGDAS-D ao inbox e enfileira o processamento [REQ-012, REQ-046, AC-014]
      description: |
        PDF com camada de texto ou TXT (UTF-8 ou latin-1), validado pelo conteúdo e nunca pela
        extensão, até 10 MB. O original fica fora de qualquer diretório servido, com o sha256 como
        nome; o nome enviado é só metadado. A resposta não espera o processamento: o job
        `pgdas_parse` roda no worker (parser determinístico, sem LLM: ADR-006) e o estado aparece em
        `GET /factor-r/pgdas/{id}` (campo `job`). O mesmo arquivo enviado de novo devolve o
        documento existente (200, `duplicate = true`), sem novo job.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        "202":
          description: Documento recebido; processamento enfileirado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PgdasUpload" }
        "200":
          description: O arquivo já tinha sido enviado (documento existente)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PgdasUpload" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "413":
          description: Arquivo acima de 10 MB (FILE_TOO_LARGE)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "415":
          description: O conteúdo não é PDF nem TXT (UNSUPPORTED_FILE)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    get:
      tags: [factor-r]
      operationId: listPgdasDocuments
      summary: Documentos do inbox, mais recentes primeiro, com a contagem por status
      description: |
        A contagem por status é a do inbox inteiro, independente dos filtros. Com `company_id`,
        vêm os extratos vinculados à empresa (aba Fator R da ficha).
      parameters:
        - name: status
          in: query
          schema: { $ref: "#/components/schemas/PgdasStatus" }
        - name: company_id
          in: query
          description: Só os extratos vinculados a esta empresa
          schema: { $ref: "#/components/schemas/Uuid" }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
        - name: offset
          in: query
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        "200":
          description: Documentos
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PgdasDocumentList" }
        "400": { $ref: "#/components/responses/BadRequest" }

  /factor-r/pgdas/{id}:
    parameters:
      - $ref: "#/components/parameters/IdPath"
    get:
      tags: [factor-r]
      operationId: getPgdasDocument
      summary: Documento do inbox — campos lidos, decisão, job de processamento e sugestão de cadastro
      responses:
        "200":
          description: Documento
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PgdasDocument" }
        "404": { $ref: "#/components/responses/NotFound" }

  /factor-r/pgdas/{id}/file:
    parameters:
      - $ref: "#/components/parameters/IdPath"
    get:
      tags: [factor-r]
      operationId: downloadPgdasDocument
      summary: Baixa o original como anexo (nosniff, sem cache)
      responses:
        "200":
          description: O arquivo enviado
          content:
            application/pdf:
              schema: { type: string, format: binary }
            text/plain:
              schema: { type: string, format: binary }
        "404": { $ref: "#/components/responses/NotFound" }

  /factor-r/pgdas/{id}/link:
    parameters:
      - $ref: "#/components/parameters/IdPath"
    post:
      tags: [factor-r]
      operationId: linkPgdasDocument
      summary: Vincula manualmente um documento em revisão a uma empresa [AC-008]
      description: |
        Numa corrida nova do agente `parser_pgdas` (gatilho `vinculo_manual`): grava a receita do
        PA e os meses anteriores conferidos, só em competências vazias, e a nota ouro. Só para
        documentos em `needs_review` (409 `PGDAS_INVALID_STATE` nos demais).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PgdasLinkInput" }
      responses:
        "200":
          description: Documento vinculado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PgdasDocument" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /factor-r/pgdas/{id}/review:
    parameters:
      - $ref: "#/components/parameters/IdPath"
    post:
      tags: [factor-r]
      operationId: reviewPgdasDocument
      summary: Decisão de revisão do analista — hoje, a rejeição do documento
      description: |
        Numa corrida nova do agente (gatilho `rejeicao`), com o motivo informado. Documento já
        vinculado ou rejeitado não muda (409 `PGDAS_INVALID_STATE`).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PgdasReviewInput" }
      responses:
        "200":
          description: Documento rejeitado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PgdasDocument" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /factor-r/pgdas/{id}/create-company:
    parameters:
      - $ref: "#/components/parameters/IdPath"
    post:
      tags: [factor-r]
      operationId: createCompanyFromPgdas
      summary: Cadastra a empresa do extrato e vincula o documento, numa transação só [REQ-012]
      description: |
        Sempre por pedido explícito do analista, nunca automaticamente. A empresa entra pelo
        cadastro canônico (mesmas validações de `POST /companies`), com o CNPJ lido no extrato.
        Recusas antes de qualquer gravação: estado (409 `PGDAS_INVALID_STATE`), extrato sem CNPJ
        válido (422 `PGDAS_NO_VALID_CNPJ`), CNPJ diferente do lido (422 `PGDAS_CNPJ_MISMATCH`) e
        CNPJ já cadastrado (409 `CNPJ_CONFLICT`, com a empresa em `details.conflicting_company`).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PgdasCreateCompanyInput" }
      responses:
        "201":
          description: Empresa cadastrada e documento vinculado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PgdasCreateCompanyResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }

  /reconciliation/documents:
    post:
      tags: [reconciliation]
      operationId: uploadReconciliationDocument
      summary: Envia um extrato ou comprovante; guarda o original no MinIO e enfileira a triagem [REQ-018, AC-013, AC-014]
      description: |
        PDF, imagem (PNG ou JPEG) ou texto (CSV/TXT), validado pelo conteúdo e nunca pela
        extensão, até 20 MB. O original vai para o bucket versionado com o SHA-256 como chave (o
        nome enviado é só metadado) e o documento nasce `pendente`, com o job
        `reconciliation_triage` na fila: a resposta não espera o processamento. O mesmo arquivo de
        novo é recusado (409 `DUPLICATE_DOCUMENT`, com o documento existente em
        `details.document_id`), como na origem. Com `company_id` e `competence` informados e o
        Contábil fechado na competência, o original é guardado e o documento fica como
        `pendencia_periodo_fechado`, sem job. Com o MinIO fora ou não configurado, nada é gravado
        (503 `STORAGE_UNAVAILABLE`). É também o endpoint do workflow de ingestão do n8n.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
                company_id: { $ref: "#/components/schemas/Uuid" }
                competence: { $ref: "#/components/schemas/Competence" }
      responses:
        "202":
          description: Documento recebido (pendente, com a triagem na fila, ou parado por período fechado)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReconciliationUpload" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "409": { $ref: "#/components/responses/Conflict" }
        "413":
          description: Arquivo acima de 20 MB (FILE_TOO_LARGE)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "415":
          description: O conteúdo não é PDF, imagem PNG/JPEG nem texto (UNSUPPORTED_FILE)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503":
          description: MinIO fora ou não configurado (STORAGE_UNAVAILABLE); nada foi gravado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    get:
      tags: [reconciliation]
      operationId: listReconciliationDocuments
      summary: Documentos da Conciliação, mais recentes primeiro, com a contagem por status
      description: |
        A competência casa com a informada no envio ou com o período do extrato lido na triagem
        que encosta no mês. Desde a TASK-024 (D-038), `status` aceita mais de um, separados por
        vírgula (os grupos do Dashboard), e os filtros de empresa do Dashboard valem pelo snapshot
        de `filter_competence` (a competência do Dashboard), com o responsável do Contábil. A
        contagem por status é a dos documentos das empresas filtradas (a empresa e os filtros do
        Dashboard), independente dos demais filtros.
      parameters:
        - name: status
          in: query
          description: Um ou mais status, separados por vírgula
          schema: { type: string, examples: ["pendente,triado"] }
        - { name: company_id, in: query, schema: { $ref: "#/components/schemas/Uuid" } }
        - $ref: "#/components/parameters/CompanyFilterRegimeGroup"
        - $ref: "#/components/parameters/CompanyFilterTaxRegime"
        - { name: responsible_id, in: query, description: "Responsável do Contábil da empresa (snapshot de filter_competence)", schema: { $ref: "#/components/schemas/Uuid" } }
        - { name: filter_competence, in: query, description: "Competência do snapshot dos filtros de empresa (obrigatória com eles)", schema: { $ref: "#/components/schemas/Competence" } }
        - { name: kind, in: query, schema: { $ref: "#/components/schemas/ReconciliationDocumentKind" } }
        - { name: bank, in: query, description: "Banco lido na triagem (sem diferenciar maiúsculas)", schema: { type: string } }
        - { name: competence, in: query, schema: { $ref: "#/components/schemas/Competence" } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0, default: 0 } }
      responses:
        "200":
          description: Documentos
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReconciliationDocumentList" }
        "400": { $ref: "#/components/responses/BadRequest" }

  /reconciliation/companies:
    get:
      tags: [reconciliation]
      operationId: getReconciliationOverview
      summary: A Conciliação por empresa na competência [TASK-024, D-038]
      description: |
        As empresas que usam a Conciliação na competência (extrato que a cobre ou documento dela)
        ou têm item na fila dela, com o estado da conclusão (em andamento, pronta, concluída), o
        que falta, o Contábil, a obrigação Conciliação e se a Conciliação bloqueia o fechamento do
        Contábil. É a lista do drill-down das prontas para concluir e do Contábil bloqueado do
        Dashboard. Uma consulta só para a competência inteira.
      parameters:
        - { name: competence, in: query, required: true, schema: { $ref: "#/components/schemas/Competence" } }
        - { name: state, in: query, schema: { type: string, enum: [em_andamento, pronta, concluida] } }
        - { name: blocked, in: query, description: "true: só as que bloqueiam o Contábil", schema: { type: boolean } }
        - $ref: "#/components/parameters/CompanyFilterRegimeGroup"
        - $ref: "#/components/parameters/CompanyFilterTaxRegime"
        - { name: responsible_id, in: query, description: "Responsável do Contábil da empresa (snapshot da competência)", schema: { $ref: "#/components/schemas/Uuid" } }
      responses:
        "200":
          description: A Conciliação por empresa
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReconciliationOverview" }
        "400": { $ref: "#/components/responses/BadRequest" }

  /reconciliation/documents/{id}:
    parameters:
      - $ref: "#/components/parameters/IdPath"
    get:
      tags: [reconciliation]
      operationId: getReconciliationDocument
      summary: Documento da Conciliação — hash, versão do original, triagem, diagnóstico, job, importação e tentativas
      responses:
        "200":
          description: Documento
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReconciliationDocumentDetail" }
        "404": { $ref: "#/components/responses/NotFound" }

  /reconciliation/documents/{id}/retry:
    parameters:
      - $ref: "#/components/parameters/IdPath"
    post:
      tags: [reconciliation]
      operationId: retryReconciliationDocument
      summary: Reprocessa o documento em revisão, parado por período fechado ou com o processamento encerrado sem sucesso [06 §4]
      description: |
        Não ignora portão nenhum: o documento volta para a fila e passa de novo pela triagem
        (`revisao_triagem`, `pendencia_periodo_fechado`, ou `pendente` com o job encerrado sem
        sucesso) ou pela extração (`revisao_extracao` de extrato ou de comprovante sem lançamento,
        ou `triado` com o job encerrado sem sucesso). Fica no log de extração como intervenção
        humana (alias `humano`). Importado, ainda na fila ou comprovante que já tem lançamento (a
        correção dele é campo a campo, na fila de revisão): 409 `DOCUMENT_NOT_RETRYABLE`. Contábil
        fechado na competência do envio ou do período lido: 423 `PERIOD_CLOSED` [AC-025].
      responses:
        "202":
          description: Documento de volta à fila, com o novo job
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReconciliationUpload" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "423":
          description: Contábil fechado (PERIOD_CLOSED)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /reconciliation/documents/{id}/file:
    parameters:
      - $ref: "#/components/parameters/IdPath"
    get:
      tags: [reconciliation]
      operationId: downloadReconciliationDocument
      summary: Lê a versão gravada do original, para ver (inline) ou baixar (?download=1)
      description: |
        O tipo é o detectado no envio (`nosniff`, sem cache); o nome enviado só vai no
        Content-Disposition. O original nunca é servido por diretório público [09 §5].
      parameters:
        - name: download
          in: query
          description: "1 = como anexo"
          schema: { type: string, enum: ["1"] }
      responses:
        "200":
          description: O original enviado
          content:
            application/pdf:
              schema: { type: string, format: binary }
            image/png:
              schema: { type: string, format: binary }
            image/jpeg:
              schema: { type: string, format: binary }
            text/plain:
              schema: { type: string, format: binary }
        "404": { $ref: "#/components/responses/NotFound" }
        "503":
          description: MinIO fora (STORAGE_UNAVAILABLE)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /reconciliation/entries:
    get:
      tags: [reconciliation]
      operationId: listReconciliationEntries
      summary: Lançamentos do cliente (lidos dos comprovantes e manuais), por data
      parameters:
        - { name: company_id, in: query, schema: { $ref: "#/components/schemas/Uuid" } }
        - { name: status, in: query, schema: { $ref: "#/components/schemas/ReconciliationEntryStatus" } }
        - { name: date_from, in: query, description: "Data do lançamento a partir de", schema: { type: string, format: date } }
        - { name: date_to, in: query, description: "Data do lançamento até", schema: { type: string, format: date } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0, default: 0 } }
      responses:
        "200":
          description: Lançamentos (sem data por último)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReconciliationClientEntryList" }
        "400": { $ref: "#/components/responses/BadRequest" }
    post:
      tags: [reconciliation]
      operationId: createReconciliationEntry
      summary: Insere um lançamento do cliente à mão [CC-12]
      description: |
        O criar_lancamento da origem, com a empresa obrigatória: nasce com o status `manual`,
        fica no log de extração como intervenção humana e passa pela trava do Contábil na
        competência da data (423 `PERIOD_CLOSED`) [AC-025]. Valor positivo, até 2 casas; o sentido
        diz se entra (C) ou sai (D).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReconciliationClientEntryCreate" }
      responses:
        "201":
          description: Lançamento gravado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReconciliationClientEntry" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "423":
          description: Contábil fechado (PERIOD_CLOSED)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /reconciliation/entries/import:
    post:
      tags: [reconciliation]
      operationId: importReconciliationEntries
      summary: Importa lançamentos do cliente de um CSV (data;valor;sentido;contraparte) [CC-12]
      description: |
        O csv_lancamentos da origem, na empresa informada: uma linha por lançamento, separada por
        ponto e vírgula, com a data em AAAA-MM-DD, o valor com ponto ou vírgula decimal, o sentido
        C ou D e a contraparte (colunas a mais são ignoradas); a 1ª linha com "data" é o
        cabeçalho; linhas em branco são puladas. Tudo ou nada: com uma linha inválida, nada é
        gravado e a resposta traz o erro de cada linha (400 `INVALID_ENTRIES_CSV`, com
        `details.lines`). UTF-8 ou Windows-1252, até 2 MB e 5.000 lançamentos. Trava do Contábil
        em cada competência (423 `PERIOD_CLOSED`).
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, company_id]
              properties:
                file: { type: string, format: binary }
                company_id: { $ref: "#/components/schemas/Uuid" }
      responses:
        "201":
          description: Lançamentos gravados
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReconciliationEntriesImport" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "413":
          description: CSV acima de 2 MB (FILE_TOO_LARGE)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "423":
          description: Contábil fechado (PERIOD_CLOSED)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /companies/{id}/reconciliation/run:
    parameters:
      - $ref: "#/components/parameters/IdPath"
    post:
      tags: [reconciliation]
      operationId: runReconciliation
      summary: Roda o matching determinístico da competência (passes 1 a 4) e devolve os baldes [REQ-024, AC-018]
      description: |
        O rodar_matching da origem para a empresa e a competência: as linhas livres do extrato da
        competência contra os lançamentos livres da empresa. Antes da cascata, o pré-filtro da
        origem e os casos de borda (transferência entre contas, estorno em até 7 dias, bruto ×
        líquido até R$ 20,00 em D±3) tiram linhas do automático, com o motivo marcado para a fila
        [REQ-030]. A cascata só concilia o que não é ambíguo dos dois lados (ADR-008); entram no
        automático os lançamentos extraídos e manuais (o parcial espera a revisão). Conciliação
        automática tem origem `auto`, o passe, o método e o score, sem autor. Idempotente: a rodada
        repetida não concilia de novo nem duplica marcas. O worker também roda a competência
        quando chega extrato importado ou comprovante (job `reconciliation_run`). Contábil fechado:
        423 `PERIOD_CLOSED` [AC-025].
      parameters:
        - { name: competence, in: query, required: true, schema: { $ref: "#/components/schemas/Competence" } }
      responses:
        "200":
          description: Resultado da rodada e baldes da competência
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReconciliationRunSummary" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "423":
          description: Contábil fechado (PERIOD_CLOSED)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /reconciliation/review/{id}/proposal:
    parameters:
      - { name: id, in: path, required: true, description: "Linha do extrato", schema: { $ref: "#/components/schemas/Uuid" } }
    post:
      tags: [reconciliation]
      operationId: requestResolverProposal
      summary: Pede ao resolvedor uma hipótese para a linha do extrato [REQ-025, AC-019]
      description: |
        O pedir_hipotese da origem, agora assíncrono: enfileira o job `agent_resolver` e responde
        sem esperar o modelo. O resolvedor só grava a proposta (hipótese, justificativa e pares),
        com o trace da corrida; nada é conciliado até o aceite humano. Com um pedido da mesma
        linha já na fila, devolve o mesmo job (`already_queued`). Linha conciliada: 409
        `LINE_RECONCILED`; Contábil fechado: 423 `PERIOD_CLOSED` [AC-025]. O pedido fica no log
        de extração como ação humana.
      responses:
        "202":
          description: Pedido na fila
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ResolverProposalRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Linha já conciliada (LINE_RECONCILED)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "423":
          description: Contábil fechado (PERIOD_CLOSED)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /reconciliation/review/{id}/proposals:
    parameters:
      - { name: id, in: path, required: true, description: "Linha do extrato", schema: { $ref: "#/components/schemas/Uuid" } }
    get:
      tags: [reconciliation]
      operationId: listResolverProposals
      summary: Propostas do resolvedor para a linha, da mais recente para a mais antiga
      responses:
        "200":
          description: Propostas
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ResolverProposalList" }
        "404": { $ref: "#/components/responses/NotFound" }

  /reconciliation/review/{id}/accept-proposal:
    parameters:
      - { name: id, in: path, required: true, description: "Linha do extrato", schema: { $ref: "#/components/schemas/Uuid" } }
    post:
      tags: [reconciliation]
      operationId: acceptResolverProposal
      summary: Aceita a proposta do resolvedor — o único caminho do resolvedor até a conciliação [AC-019]
      description: |
        O aceitar_hip da origem: cada par vira conciliação com origem `manual`, o método
        `resolvedor` (ou `sem_comprovante`, no par de extrato sem comprovante), o autor e a
        proposta. A linha do par (ou, sem ela, a linha da proposta) e os lançamentos só entram se
        forem da empresa e estiverem livres; os outros são ignorados, como na origem. Sem nenhum
        par a conciliar, nada muda e a proposta segue pendente (409
        `PROPOSAL_NOTHING_TO_ACCEPT`: rejeite). Proposta já decidida: 409 `PROPOSAL_DECIDED`;
        Contábil fechado em alguma competência das linhas: 423 `PERIOD_CLOSED` [AC-025].
        Serializado com a rodada do matching da empresa.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ResolverProposalDecision" }
      responses:
        "200":
          description: Proposta aceita e conciliações criadas
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ResolverProposalAccept" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Proposta já decidida (PROPOSAL_DECIDED) ou sem par a conciliar (PROPOSAL_NOTHING_TO_ACCEPT)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "423":
          description: Contábil fechado (PERIOD_CLOSED)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /reconciliation/review/{id}/reject-proposal:
    parameters:
      - { name: id, in: path, required: true, description: "Linha do extrato", schema: { $ref: "#/components/schemas/Uuid" } }
    post:
      tags: [reconciliation]
      operationId: rejectResolverProposal
      summary: Rejeita a proposta do resolvedor; nada é conciliado
      description: |
        O rejeitar_hip da origem: a proposta fica `rejeitada`, com o autor e a data, e a ação vai
        para o log de extração. Proposta já decidida: 409 `PROPOSAL_DECIDED`; Contábil fechado:
        423 `PERIOD_CLOSED` [AC-025].
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ResolverProposalDecision" }
      responses:
        "200":
          description: Proposta rejeitada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ResolverProposal" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Proposta já decidida (PROPOSAL_DECIDED)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "423":
          description: Contábil fechado (PERIOD_CLOSED)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /companies/{id}/chart-accounts:
    parameters:
      - $ref: "#/components/parameters/IdPath"
    get:
      tags: [reconciliation]
      operationId: listChartAccounts
      summary: Plano de contas da empresa, por código [REQ-026, CC-20]
      parameters:
        - { name: active, in: query, description: "true: só as contas ativas", schema: { type: string, enum: ["true"] } }
      responses:
        "200":
          description: Contas
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChartAccountList" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [reconciliation]
      operationId: createChartAccount
      summary: Inclui uma conta no plano da empresa (M5.1)
      description: |
        Código sem espaço nem ponto e vírgula, até 32 caracteres; nome até 255. Código repetido na
        empresa: 409 `ACCOUNT_CODE_EXISTS`. A ação fica no log de extração.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChartAccountCreate" }
      responses:
        "201":
          description: Conta incluída
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChartAccount" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /companies/{id}/chart-accounts/{accountId}:
    parameters:
      - $ref: "#/components/parameters/IdPath"
      - { name: accountId, in: path, required: true, schema: { $ref: "#/components/schemas/Uuid" } }
    patch:
      tags: [reconciliation]
      operationId: updateChartAccount
      summary: Altera o nome ou desativa (reativa) a conta; o código não muda
      description: |
        Desativada, a conta sai das novas classificações, das regras que apontam para ela e do
        histórico; as classificações feitas ficam. Nada é apagado.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChartAccountPatch" }
      responses:
        "200":
          description: Conta alterada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChartAccount" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }

  /companies/{id}/chart-accounts/import:
    parameters:
      - $ref: "#/components/parameters/IdPath"
    post:
      tags: [reconciliation]
      operationId: importChartAccounts
      summary: Importa o plano de contas de um CSV (codigo;nome) [CC-20]
      description: |
        Uma conta por linha, separada por ponto e vírgula (colunas a mais são ignoradas); a 1ª linha
        com "codigo" é o cabeçalho; linhas em branco são puladas. Tudo ou nada: com uma linha
        inválida (ou código repetido no arquivo), nada é gravado e a resposta traz o erro de cada
        linha (400 `INVALID_ACCOUNTS_CSV`, com `details.lines`). Conta que já existe ganha o nome do
        arquivo e volta a ativa. UTF-8 ou Windows-1252, até 2 MB e 5.000 contas.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        "201":
          description: Plano importado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChartAccountsImport" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "413":
          description: CSV acima de 2 MB (FILE_TOO_LARGE)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /companies/{id}/chart-accounts/copy:
    parameters:
      - $ref: "#/components/parameters/IdPath"
    post:
      tags: [reconciliation]
      operationId: copyChartAccounts
      summary: Copia o plano de outra empresa (o padrão) [CC-20, D-020]
      description: |
        As contas ativas da empresa padrão que esta ainda não tem; as que ela já tem ficam como
        estão (`skipped`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [source_company_id]
              additionalProperties: false
              properties:
                source_company_id: { $ref: "#/components/schemas/Uuid" }
      responses:
        "201":
          description: Contas copiadas
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChartAccountsCopy" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }

  /companies/{id}/classification-rules:
    parameters:
      - $ref: "#/components/parameters/IdPath"
    get:
      tags: [reconciliation]
      operationId: listClassificationRules
      summary: Regras de classificação, da mais nova para a mais antiga (a ordem em que valem)
      parameters:
        - { name: active, in: query, description: "true: só as ativas", schema: { type: string, enum: ["true"] } }
      responses:
        "200":
          description: Regras
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ClassificationRuleList" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [reconciliation]
      operationId: createClassificationRule
      summary: Confirma uma regra de classificação (M5.2, M5.5) [REQ-027]
      description: |
        CNPJ (só os dígitos, 11 ou 14), contraparte (comparada normalizada) ou regex do descritivo
        (o `re` do Python, com IGNORECASE, no subconjunto que o porte traduz). A conta precisa estar
        no plano ativo. A regra vale para as próximas classificações e nunca troca o que já foi
        confirmado; a mais nova vale, e a ativa com o mesmo tipo e padrão é desativada
        (`replaced_rule_ids`). É também como o contador confirma a regra proposta depois da
        correção ou do aceite da sugestão.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ClassificationRuleCreate" }
      responses:
        "201":
          description: Regra confirmada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ClassificationRuleCreated" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }

  /companies/{id}/classification-rules/{ruleId}/deactivate:
    parameters:
      - $ref: "#/components/parameters/IdPath"
      - { name: ruleId, in: path, required: true, schema: { $ref: "#/components/schemas/Uuid" } }
    post:
      tags: [reconciliation]
      operationId: deactivateClassificationRule
      summary: Desativa a regra (nunca apaga)
      responses:
        "200":
          description: Regra desativada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ClassificationRule" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Regra já desativada (RULE_INACTIVE)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /companies/{id}/classification/run:
    parameters:
      - $ref: "#/components/parameters/IdPath"
    post:
      tags: [reconciliation]
      operationId: runClassification
      summary: Classifica as linhas conciliadas da competência — regra, depois histórico [REQ-026, AC-020]
      description: |
        A rodada do matching já classifica o que concilia; esta rota aplica uma regra recém-
        confirmada às linhas que ainda esperam classificação. Só preenche o que não foi confirmado:
        a classificação do contador nunca é trocada. Sem regra nem histórico (as classificações
        confirmadas dos meses anteriores, a mais recente vale), a linha fica à espera do agente ou
        do contador. Contábil fechado: 423 `PERIOD_CLOSED` [AC-025].
      parameters:
        - { name: competence, in: query, required: true, schema: { $ref: "#/components/schemas/Competence" } }
      responses:
        "200":
          description: Classificação da competência
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ClassificationRunSummary" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "423":
          description: Contábil fechado (PERIOD_CLOSED)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /reconciliation/review/{id}/classification:
    parameters:
      - { name: id, in: path, required: true, description: "Linha do extrato", schema: { $ref: "#/components/schemas/Uuid" } }
    put:
      tags: [reconciliation]
      operationId: correctClassification
      summary: Classifica a linha à mão e propõe a regra derivada (M5.5) [REQ-027]
      description: |
        Origem `manual`, com o autor. A resposta traz a regra derivada da correção (CNPJ, senão
        contraparte, senão o descritivo escapado), que só vale depois de confirmada em
        `POST /companies/{id}/classification-rules`. Só a linha conciliada é classificada (409
        `LINE_NOT_RECONCILED`); a conta precisa estar no plano ativo (400); Contábil fechado: 423.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [account_code]
              additionalProperties: false
              properties:
                account_code: { type: string }
      responses:
        "200":
          description: Classificação gravada e regra proposta
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ClassificationCorrection" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Linha não conciliada (LINE_NOT_RECONCILED)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "423":
          description: Contábil fechado (PERIOD_CLOSED)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /reconciliation/review/{id}/classification-suggestion:
    parameters:
      - { name: id, in: path, required: true, description: "Linha do extrato", schema: { $ref: "#/components/schemas/Uuid" } }
    post:
      tags: [reconciliation]
      operationId: requestClassificationSuggestion
      summary: Pede ao agente classificador uma conta para a linha [AC-020]
      description: |
        Enfileira o job `agent_classifier` (o mesmo job se o pedido já está na fila). Antes do
        modelo, o job roda de novo a regra e o histórico; o agente só sugere uma conta do plano
        ativo, e a sugestão fica pendente até o contador aceitar ou rejeitar. Recusas: 409
        `LINE_NOT_RECONCILED`, `LINE_ALREADY_CLASSIFIED` (regra, histórico ou contador) e
        `CHART_EMPTY`; 423 `PERIOD_CLOSED`.
      responses:
        "202":
          description: Pedido na fila
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ClassificationSuggestionRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "423":
          description: Contábil fechado (PERIOD_CLOSED)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /reconciliation/review/{id}/classification-suggestions:
    parameters:
      - { name: id, in: path, required: true, description: "Linha do extrato", schema: { $ref: "#/components/schemas/Uuid" } }
    get:
      tags: [reconciliation]
      operationId: listClassificationSuggestions
      summary: Sugestões do agente para a linha, da mais recente para a mais antiga
      responses:
        "200":
          description: Sugestões
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ClassificationSuggestionList" }
        "404": { $ref: "#/components/responses/NotFound" }

  /reconciliation/review/{id}/accept-classification-suggestion:
    parameters:
      - { name: id, in: path, required: true, description: "Linha do extrato", schema: { $ref: "#/components/schemas/Uuid" } }
    post:
      tags: [reconciliation]
      operationId: acceptClassificationSuggestion
      summary: Confirma a sugestão do agente — a única forma de a sugestão virar classificação [AC-020]
      description: |
        A linha ganha a conta com a origem `agente`, o autor e a sugestão. A resposta propõe a regra
        sugerida pelo agente (ou, sem ela, a derivada), que só vale confirmada. Recusas: 404
        `SUGGESTION_NOT_FOUND`; 409 `SUGGESTION_DECIDED`, `SUGGESTION_WITHOUT_ACCOUNT` (conta fora
        do plano), `ACCOUNT_INACTIVE` e `LINE_NOT_RECONCILED`; 423 `PERIOD_CLOSED`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ClassificationSuggestionDecision" }
      responses:
        "200":
          description: Sugestão aceita
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ClassificationSuggestionAccept" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "423":
          description: Contábil fechado (PERIOD_CLOSED)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /reconciliation/review/{id}/reject-classification-suggestion:
    parameters:
      - { name: id, in: path, required: true, description: "Linha do extrato", schema: { $ref: "#/components/schemas/Uuid" } }
    post:
      tags: [reconciliation]
      operationId: rejectClassificationSuggestion
      summary: Rejeita a sugestão; a linha continua à espera da classificação
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ClassificationSuggestionDecision" }
      responses:
        "200":
          description: Sugestão rejeitada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ClassificationSuggestion" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Sugestão já decidida (SUGGESTION_DECIDED)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "423":
          description: Contábil fechado (PERIOD_CLOSED)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /companies/{id}/ledger:
    parameters:
      - $ref: "#/components/parameters/IdPath"
    get:
      tags: [reconciliation]
      operationId: getLedger
      summary: Razão como consulta — uma linha por conciliação ativa [REQ-028, AC-021]
      description: |
        O linhas_razao da origem: as conciliações ativas das competências do período, por data e
        conta bancária, com a conta contábil e a origem da classificação, a contraparte, o débito
        (saída do extrato) e o crédito (entrada), e os ids do drill-down (conciliação, transação,
        original do extrato, comprovantes e originais deles). Nunca tabela escrita: reclassificar ou
        desfazer muda o razão porque muda a origem. `account` filtra como a origem: a conta bancária
        contém o texto (sem caixa) ou a conta contábil é igual a ele.
      parameters:
        - { name: from, in: query, required: true, description: "Competência inicial", schema: { $ref: "#/components/schemas/Competence" } }
        - { name: to, in: query, required: true, description: "Competência final", schema: { $ref: "#/components/schemas/Competence" } }
        - { name: account, in: query, schema: { type: string } }
      responses:
        "200":
          description: Razão do período
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Ledger" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }

  /companies/{id}/ledger/export:
    parameters:
      - $ref: "#/components/parameters/IdPath"
    get:
      tags: [reconciliation]
      operationId: exportLedger
      summary: Exporta o razão filtrado em CSV ou XLSX [REQ-029, AC-022]
      description: |
        As colunas da origem (`data;conta;historico;debito;credito`) e as do AC-022 (`competencia`,
        `conta_contabil`, `nome_conta`, `contraparte`, `origem_classificacao`, `origem_conciliacao`),
        na ordem do razão: o mesmo razão dá sempre o mesmo arquivo.
        - `csv` (padrão): separado por ponto e vírgula, com aspas no campo que precisa delas.
        - `xlsx` (TASK-028, D-042): a aba "Razão", com os mesmos títulos na 1ª linha, débito e crédito
          como número de duas casas e a data como data (dd/mm/aaaa), e a aba "Resumo", com a empresa,
          o período, o filtro de conta, a quantidade de lançamentos e os totais. Texto nunca vira
          fórmula, e o arquivo não leva data de geração.
      parameters:
        - { name: format, in: query, schema: { type: string, enum: [csv, xlsx], default: csv } }
        - { name: from, in: query, required: true, schema: { $ref: "#/components/schemas/Competence" } }
        - { name: to, in: query, required: true, schema: { $ref: "#/components/schemas/Competence" } }
        - { name: account, in: query, schema: { type: string } }
      responses:
        "200":
          description: O razão no formato pedido (razao-<cnpj>-<de>-<até>.csv ou .xlsx)
          content:
            text/csv:
              schema: { type: string }
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema: { type: string, format: binary }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }

  /reconciliation/reconciliations/{id}:
    parameters:
      - $ref: "#/components/parameters/IdPath"
    get:
      tags: [reconciliation]
      operationId: getReconciliation
      summary: Conciliação no drill-down do razão — classificação, transação e documentos [AC-021]
      responses:
        "200":
          description: Conciliação
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReconciliationDetail" }
        "404": { $ref: "#/components/responses/NotFound" }

  /reconciliation/metrics:
    get:
      tags: [reconciliation]
      operationId: getReconciliationMetrics
      summary: Painel de métricas da Conciliação [11-observability §7, CC-22]
      description: |
        O /metricas da origem (o percentual automático contra a meta e as conciliações por passe) e
        os demais números do §7: os itens por balde (a mesma contagem da fila), a leitura dos
        extratos e dos comprovantes (aprovação na 1ª tentativa, tentativas médias e custo por
        documento, como o `make eval-extrator`), as correções humanas depois da leitura, o que se
        achou depois do fechamento (reaberturas do Contábil e documentos tardios; D-034), o custo do
        resolvedor e do classificador por item e o sucesso dos playbooks por banco. Tudo é consulta
        sobre as tabelas da Conciliação. Empresa e competência são opcionais; sem base, o percentual
        é nulo. O custo é o que o LiteLLM informa, em dólares, sem conversão.
      parameters:
        - { name: company_id, in: query, schema: { $ref: "#/components/schemas/Uuid" } }
        - { name: competence, in: query, schema: { $ref: "#/components/schemas/Competence" } }
      responses:
        "200":
          description: Métricas do filtro
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReconciliationMetrics" }
        "400": { $ref: "#/components/responses/BadRequest" }

  /reconciliation/playbooks:
    get:
      tags: [reconciliation]
      operationId: listBankPlaybooks
      summary: Playbooks por banco, todas as versões [REQ-022, CC-09]
      description: |
        O /playbooks da origem: a receita de extração de cada banco, que só persiste depois que o
        portão aprova, com a versão, o estado (no máximo uma válida por banco), os sucessos, as
        falhas e a taxa. Por banco e da versão mais nova para a mais antiga. Somente leitura.
      responses:
        "200":
          description: Playbooks
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BankPlaybookList" }

  /companies/{id}/reconciliation:
    parameters:
      - $ref: "#/components/parameters/IdPath"
    get:
      tags: [reconciliation]
      operationId: getCompanyReconciliationSummary
      summary: A Conciliação da empresa na competência, para a aba da ficha [REQ-036, AC-034]
      description: |
        Se o Contábil está fechado (a trava da Conciliação), os extratos importados que cobrem a
        competência, as linhas e o percentual automático contra a meta, os itens da fila por balde,
        os lançamentos do cliente, a classificação das linhas conciliadas e a conclusão da
        conciliação com a obrigação Conciliação do Contábil (TASK-022).
      parameters:
        - { name: competence, in: query, required: true, schema: { $ref: "#/components/schemas/Competence" } }
      responses:
        "200":
          description: Resumo da competência
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CompanyReconciliationSummary" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }

  /companies/{id}/reconciliation/complete:
    parameters:
      - $ref: "#/components/parameters/IdPath"
    post:
      tags: [reconciliation]
      operationId: completeReconciliation
      summary: Conclui a conciliação da competência e a obrigação Conciliação do Contábil [REQ-031, AC-023]
      description: |
        O evento de conclusão da F-008, confirmado pelo contador (D-036). Pronta quando o extrato está
        todo resolvido: ao menos um extrato importado cobre a competência, toda linha conciliada (ou
        confirmada sem comprovante) e classificada, e nenhum documento nem comprovante parcial em
        revisão; comprovante sem extrato só avisa. Senão, 409 `RECONCILIATION_NOT_READY` com
        `details.blocking`.

        Na mesma transação, a obrigação Conciliação (`ACCOUNTING_RECONCILIATION`) vai para OK pelo
        serviço de obrigações, com a origem `SYSTEM_INTEGRATION` e o evento no histórico; as
        dependências HARD do Contábil valem (422 `DEPENDENCY_BLOCKED`). Já final, não aplicável ou
        inexistente, a obrigação fica como está (`obligation_sync`). Idempotente: concluída, devolve o
        estado sem gravar de novo. Com o Contábil fechado, 423 `PERIOD_CLOSED`.

        Concluída, a competência trava as mutações da Conciliação (423 `RECONCILIATION_COMPLETED`) até
        a reabertura, e o documento novo dela fica como pendência (motivo `conciliacao_concluida`).
      parameters:
        - { name: competence, in: query, required: true, schema: { $ref: "#/components/schemas/Competence" } }
      responses:
        "200":
          description: A conciliação concluída (ou já concluída)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReconciliationCompletion" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        "423": { $ref: "#/components/responses/Locked" }

  /companies/{id}/reconciliation/reopen:
    parameters:
      - $ref: "#/components/parameters/IdPath"
    post:
      tags: [reconciliation]
      operationId: reopenReconciliation
      summary: Reabre a conciliação concluída, com motivo [REQ-032, AC-024]
      description: |
        A obrigação Conciliação volta para Pendente (decisão do usuário, D-036), com a origem
        `SYSTEM_INTEGRATION` e o motivo no histórico, se ainda estiver no OK que a conclusão aplicou e
        ninguém tiver mudado o status depois; senão, fica como está (`mantida`). A competência
        destrava. Sem conclusão em vigor, 409 `RECONCILIATION_NOT_COMPLETED`; com o Contábil fechado,
        423 `PERIOD_CLOSED` (reabra o Contábil antes).
      parameters:
        - { name: competence, in: query, required: true, schema: { $ref: "#/components/schemas/Competence" } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              additionalProperties: false
              properties:
                reason: { type: string, maxLength: 1000 }
      responses:
        "200":
          description: A conciliação reaberta
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReconciliationCompletion" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "423": { $ref: "#/components/responses/Locked" }

  /companies/{id}/reconciliation/closure:
    parameters:
      - $ref: "#/components/parameters/IdPath"
    get:
      tags: [reconciliation]
      operationId: getReconciliationClosure
      summary: O fechamento do Contábil visto pela Conciliação [06 §5, REQ-033, REQ-034]
      description: |
        Derivado do período do Contábil (`company_module_periods`): a Conciliação não tem
        fechamento próprio (ADR-003). O período (nulo se não foi gerado), os eventos de abertura,
        fechamento e reabertura (com o motivo), e se fechar o Contábil exige a obrigação
        Conciliação final (`requires_reconciliation`: a empresa usa a Conciliação na competência e a
        obrigação existe e se aplica; D-037).
        Para fechar e reabrir, use `POST /company-module-periods/{id}/close` e `.../reopen`.
      parameters:
        - { name: competence, in: query, required: true, schema: { $ref: "#/components/schemas/Competence" } }
      responses:
        "200":
          description: O fechamento do Contábil na competência
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReconciliationClosure" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }

  /companies/{id}/bank-accounts:
    parameters:
      - $ref: "#/components/parameters/IdPath"
    get:
      tags: [reconciliation]
      operationId: listBankAccounts
      summary: Contas bancárias da empresa e as lidas nos extratos sem cadastro [CC-11]
      description: |
        As contas cadastradas, com os extratos já importados de cada uma, e as contas que os
        extratos importados da empresa leram e que ninguém cadastrou (`read`), com o banco, a
        agência e a conta exatamente como a leitura gravou.
      responses:
        "200":
          description: Contas
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BankAccountList" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [reconciliation]
      operationId: createBankAccount
      summary: Cadastra a conta bancária na empresa (conta_bancaria da origem) [CC-11]
      description: |
        A conta cadastrada decide a empresa dos próximos extratos dela, e o extrato dela enviado
        para outra empresa vai para a revisão (`conta_de_outra_empresa`; D-027). Banco, agência e
        conta precisam ser os que a leitura grava (o leitor do cenário grava `a_fonte` ou `beta`):
        prefira cadastrar a partir de `read`. Sem espaços nas pontas; até 64, 16 e 32 caracteres. A
        identidade é única no sistema: já cadastrada, 409 `BANK_ACCOUNT_EXISTS`, com a empresa dona
        em `details.company_id` quando é outra. A ação fica no log de extração.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BankAccountCreate" }
      responses:
        "201":
          description: Conta cadastrada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BankAccount" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /reconciliation/review-queue:
    get:
      tags: [reconciliation]
      operationId: getReviewQueue
      summary: Fila de revisão por balde, com as contagens [08 §7, REQ-019, REQ-024]
      description: |
        A fila da origem (/fila): documentos e comprovantes parciais em revisão (`revisao`), linhas
        livres marcadas (`divergencia`: divergência, caso de borda ou conciliação desfeita) e sem
        marca (`extrato_sem`), comprovantes completos sem extrato (`comprovante_sem`) e, da TASK-020,
        linhas conciliadas à espera da classificação (`classificacao`). Filtros opcionais por
        empresa, competência (itens sem data aparecem em qualquer competência) e balde. Os filtros
        de empresa do Dashboard (agrupamento, regime e responsável do Contábil, pelo snapshot da
        competência) exigem a competência (TASK-024, D-038).
      parameters:
        - { name: company_id, in: query, schema: { $ref: "#/components/schemas/Uuid" } }
        - { name: competence, in: query, schema: { $ref: "#/components/schemas/Competence" } }
        - { name: bucket, in: query, schema: { $ref: "#/components/schemas/ReviewBucket" } }
        - $ref: "#/components/parameters/CompanyFilterRegimeGroup"
        - $ref: "#/components/parameters/CompanyFilterTaxRegime"
        - { name: responsible_id, in: query, description: "Responsável do Contábil da empresa (snapshot da competência)", schema: { $ref: "#/components/schemas/Uuid" } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 500, default: 100 } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0, default: 0 } }
      responses:
        "200":
          description: Itens e contagens por balde (o total em `total`)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReviewQueue" }
        "400": { $ref: "#/components/responses/BadRequest" }

  /reconciliation/review/{id}:
    parameters:
      - { name: id, in: path, required: true, description: "Linha do extrato", schema: { $ref: "#/components/schemas/Uuid" } }
    get:
      tags: [reconciliation]
      operationId: getReviewLine
      summary: A linha do extrato na fila — conciliação ou candidatos
      description: |
        A linha com a empresa, a conta bancária, o original do extrato e as marcas. Conciliada, a
        conciliação ativa com os comprovantes; livre, os candidatos da origem
        (candidatos_para_extrato): lançamentos livres de mesmo valor e sentido em D±3, mais os que o
        matching anotou, do mais perto ao mais longe.
      responses:
        "200":
          description: Linha
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReviewLineDetail" }
        "404": { $ref: "#/components/responses/NotFound" }

  /reconciliation/review/{id}/manual-match:
    parameters:
      - { name: id, in: path, required: true, description: "Linha do extrato", schema: { $ref: "#/components/schemas/Uuid" } }
    post:
      tags: [reconciliation]
      operationId: manualMatch
      summary: Concilia a linha à mão com um ou mais lançamentos (N:1) [REQ-024]
      description: |
        O conciliar_manual da origem, com N lançamentos: origem `manual`, método `manual` e o autor.
        Os lançamentos precisam ser da empresa e estar livres (409 `ENTRY_NOT_FREE`); a linha, livre
        (409 `LINE_RECONCILED`). O valor não é conferido, como na origem: a diferença vai na
        resposta. A linha passa pela classificação (TASK-020). Contábil fechado: 423.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [entry_ids]
              additionalProperties: false
              properties:
                entry_ids: { type: array, minItems: 1, items: { $ref: "#/components/schemas/Uuid" } }
      responses:
        "201":
          description: Conciliação criada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ManualMatchResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "423":
          description: Contábil fechado (PERIOD_CLOSED)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /reconciliation/review/{id}/confirm-no-receipt:
    parameters:
      - { name: id, in: path, required: true, description: "Linha do extrato", schema: { $ref: "#/components/schemas/Uuid" } }
    post:
      tags: [reconciliation]
      operationId: confirmNoReceipt
      summary: '"Não há comprovante": concilia a linha sem lançamento'
      description: |
        O marcar_sem da origem: método `sem_comprovante`, origem `manual` e o autor; a linha passa
        pela classificação. Linha conciliada: 409 `LINE_RECONCILED`; Contábil fechado: 423.
      responses:
        "201":
          description: Linha confirmada sem comprovante
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ManualMatchResult" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "423":
          description: Contábil fechado (PERIOD_CLOSED)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /reconciliation/entries/{id}:
    parameters:
      - $ref: "#/components/parameters/IdPath"
    get:
      tags: [reconciliation]
      operationId: getReconciliationEntry
      summary: O comprovante na fila — conciliação ou linhas candidatas
      description: |
        O lançamento, a conciliação ativa (se houver) e, livre e completo, as linhas candidatas da
        origem (candidatos_para_comprovante): linhas livres de mesmo valor e sentido em D±3.
      responses:
        "200":
          description: Lançamento
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReviewEntryDetail" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [reconciliation]
      operationId: correctReconciliationEntry
      summary: Corrige campos do comprovante — a revisão campo a campo [REQ-023]
      description: |
        Só os campos enviados mudam (texto vazio limpa o opcional), com as regras do lançamento
        manual. O campo corrigido ganha confiança 1 e origem humana. Com os campos essenciais
        (data, valor, sentido, contraparte), o parcial sai da revisão (`extraido`; o manual continua
        manual) e a competência roda de novo (`round`). Só o lançamento livre (409
        `ENTRY_RECONCILED`); Contábil fechado na data antiga ou nova: 423.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EntryFieldsPatch" }
      responses:
        "200":
          description: Lançamento corrigido
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EntryCorrection" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "423":
          description: Contábil fechado (PERIOD_CLOSED)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /reconciliation/reconciliations:
    get:
      tags: [reconciliation]
      operationId: listRecentReconciliations
      summary: As últimas conciliações ativas (para desfazer)
      parameters:
        - { name: company_id, in: query, schema: { $ref: "#/components/schemas/Uuid" } }
        - { name: origin, in: query, schema: { type: string, enum: [auto, manual] } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 50, default: 8 } }
      responses:
        "200":
          description: Conciliações, da mais recente
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RecentReconciliationList" }
        "400": { $ref: "#/components/responses/BadRequest" }

  /reconciliation/reconciliations/{id}/undo:
    parameters:
      - $ref: "#/components/parameters/IdPath"
    post:
      tags: [reconciliation]
      operationId: undoReconciliation
      summary: Desfaz a conciliação, automática ou manual, com motivo [D-032]
      description: |
        Nada é apagado: a conciliação guarda quem, quando e por quê, e os lançamentos ficam livres.
        A linha perde a classificação e ganha a marca `desfeita`: volta para a fila como divergência
        e não volta sozinha ao automático. Já desfeita: 409 `RECONCILIATION_UNDONE`; Contábil
        fechado: 423.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              additionalProperties: false
              properties:
                reason: { type: string, minLength: 1, maxLength: 500 }
      responses:
        "200":
          description: Conciliação desfeita
          content:
            application/json:
              schema:
                type: object
                required: [reconciliation_id, statement_transaction_id, undone_at]
                properties:
                  reconciliation_id: { $ref: "#/components/schemas/Uuid" }
                  statement_transaction_id: { $ref: "#/components/schemas/Uuid" }
                  undone_at: { type: string, format: date-time }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "423":
          description: Contábil fechado (PERIOD_CLOSED)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /reconciliation/documents/{id}/identify:
    parameters:
      - $ref: "#/components/parameters/IdPath"
    post:
      tags: [reconciliation]
      operationId: identifyReconciliationDocument
      summary: '"Que documento é esse?": o contador diz o tipo e a empresa [REQ-019]'
      description: |
        Para o documento em revisão da triagem ou da extração (o comprovante sem lançamento): o tipo
        (extrato ou comprovante), a empresa e, no extrato, banco, agência, conta e período (os não
        informados ficam como a triagem leu). O documento volta para a extração (202, com o job),
        com os mesmos portões. Outro estado: 409 `DOCUMENT_NOT_IDENTIFIABLE`; já na fila: 409
        `DOCUMENT_NOT_RETRYABLE`; Contábil fechado: 423.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DocumentIdentify" }
      responses:
        "202":
          description: Documento de volta à extração
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReconciliationUpload" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "423":
          description: Contábil fechado (PERIOD_CLOSED)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /reconciliation/documents/{id}/pages:
    parameters:
      - $ref: "#/components/parameters/IdPath"
    get:
      tags: [reconciliation]
      operationId: getReconciliationDocumentPages
      summary: Como mostrar o original na fila — páginas do PDF como imagem [D-032]
      description: |
        PDF: o total de páginas, renderizadas em `GET .../pages/{page}` no DPI do extrator do
        comprovante (o bbox de cada campo cai no lugar). Sem páginas (`pages` 0: imagem ou texto),
        a tela abre o próprio arquivo (`GET .../file`).
      responses:
        "200":
          description: Páginas
          content:
            application/json:
              schema:
                type: object
                required: [content_type, pages, dpi]
                properties:
                  content_type: { type: string }
                  pages: { type: integer, minimum: 0 }
                  dpi: { type: integer }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /reconciliation/documents/{id}/pages/{page}:
    parameters:
      - $ref: "#/components/parameters/IdPath"
      - { name: page, in: path, required: true, description: "Página, a partir de 1", schema: { type: integer, minimum: 1 } }
    get:
      tags: [reconciliation]
      operationId: getReconciliationDocumentPage
      summary: A página do PDF renderizada (PNG)
      responses:
        "200":
          description: Página em PNG
          content:
            image/png:
              schema: { type: string, format: binary }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /jobs/{id}:
    parameters:
      - $ref: "#/components/parameters/IdPath"
    get:
      tags: [jobs]
      operationId: getJob
      summary: Estado de um job da fila — status, tentativas, horários e erro sanitizado [06 §8]
      description: |
        `worker_online` diz se algum worker deu sinal recente: job pendente sem worker ativo
        significa fila parada (runbook "Worker parado", 11 §9). O payload não é exposto.
      responses:
        "200":
          description: Job
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Job" }
        "404": { $ref: "#/components/responses/NotFound" }

  /jobs/{id}/retry:
    parameters:
      - $ref: "#/components/parameters/IdPath"
    post:
      tags: [jobs]
      operationId: retryJob
      summary: Reenvia um job encerrado com falha (dead), com as tentativas zeradas
      description: |
        Só para `dead` (409 `JOB_NOT_RETRYABLE` nos demais estados). O reenvio não pula portões de
        domínio, que ficam no processamento do job. Com outro job ativo para o mesmo item, 409
        `JOB_ALREADY_ACTIVE`.
      responses:
        "200":
          description: Job de volta à fila
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Job" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

components:
  parameters:
    AIAliasPath:
      name: alias
      in: path
      required: true
      description: Alias do catálogo (ex. `triador`); desconhecido = 404 `AI_ALIAS_NOT_FOUND`
      schema: { type: string, pattern: "^[a-z][a-z0-9_]{1,39}$" }
    TraceIdPath:
      name: trace_id
      in: path
      required: true
      description: trace_id da corrida (32 hex), o mesmo no Langfuse; outro formato devolve 404
      schema: { type: string, pattern: "^[0-9a-f]{32}$" }
    FactorRPA:
      name: pa
      in: query
      description: Período de apuração `AAAA-MM`; ausente = competência corrente
      schema: { $ref: "#/components/schemas/Competence" }
    IdPath:
      name: id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/Uuid"
    DashboardRegimeGroup:
      name: regime_group
      in: query
      schema: { $ref: "#/components/schemas/RegimeGroup" }
    CompanyFilterRegimeGroup:
      name: regime_group
      in: query
      description: Filtro de empresa do Dashboard (D-038), pelo snapshot da competência
      schema: { $ref: "#/components/schemas/RegimeGroup" }
    CompanyFilterTaxRegime:
      name: tax_regime
      in: query
      description: Filtro de empresa do Dashboard (D-038), pelo snapshot da competência
      schema: { $ref: "#/components/schemas/TaxRegime" }
    DashboardTaxRegime:
      name: tax_regime
      in: query
      schema: { $ref: "#/components/schemas/TaxRegime" }
    DashboardResponsible:
      name: responsible_id
      in: query
      description: Responsável do módulo da obrigação (snapshot da competência)
      schema: { $ref: "#/components/schemas/Uuid" }
    GridCompetence:
      name: competence
      in: query
      required: true
      schema: { $ref: "#/components/schemas/Competence" }
    GridTaxRegime:
      name: tax_regime
      in: query
      description: Regime do snapshot da competência
      schema: { $ref: "#/components/schemas/TaxRegime" }
    GridResponsible:
      name: responsible_id
      in: query
      description: Responsável do módulo no snapshot da competência
      schema: { $ref: "#/components/schemas/Uuid" }
    GridStatus:
      name: status
      in: query
      description: Linhas com ao menos uma obrigação aplicável neste status
      schema: { type: string }
    GridObligationType:
      name: obligation_type_id
      in: query
      description: Restringe o filtro `status` a uma coluna (exige `status`)
      schema: { $ref: "#/components/schemas/Uuid" }
    GridClosingStatus:
      name: closing_status
      in: query
      description: Status do estágio de fechamento do módulo (Fiscal - coluna Fechamento)
      schema: { type: string }
    GridPeriodState:
      name: period_state
      in: query
      schema: { type: string, enum: [OPEN, CLOSED] }
    GridNote:
      name: note
      in: query
      description: Com ou sem observação geral
      schema: { type: string, enum: [with, without] }
    GridOverdue:
      name: overdue
      in: query
      description: Somente linhas com obrigações atrasadas
      schema: { type: boolean }
    GridPending:
      name: pending
      in: query
      description: Somente linhas com pendências (status que bloqueiam)
      schema: { type: boolean }
    GridNotStarted:
      name: not_started
      in: query
      description: Somente linhas com obrigações não iniciadas
      schema: { type: boolean }
    GridReadyToClose:
      name: ready_to_close
      in: query
      description: Somente linhas prontas para fechar (todos os itens relevantes finais e módulo aberto)
      schema: { type: boolean }

  schemas:
    Error:
      type: object
      description: Envelope padrão de erro.
      required: [code, message]
      properties:
        code:
          type: string
          description: Código estável, em inglês (ex.`VERSION_CONFLICT`).
          examples: [VERSION_CONFLICT]
        message:
          type: string
          description: Mensagem para o usuário, em português.
        details:
          type: object
          additionalProperties: true

    Health:
      type: object
      required: [status, database]
      properties:
        status:
          type: string
          enum: [ok, unavailable]
        database:
          type: string
          enum: [ok, unavailable]

    Competence:
      type: string
      description: Competência mensal no formato `AAAA-MM` (exibida como `MM/AAAA`).
      pattern: "^[0-9]{4}-(0[1-9]|1[0-2])$"
      examples: ["2026-09"]

    Date:
      type: string
      format: date
      description: Data civil `AAAA-MM-DD`, sem fuso.
      examples: ["2026-10-20"]

    Cnpj:
      type: string
      description: CNPJ armazenado somente com os 14 dígitos.
      pattern: "^[0-9]{14}$"
      examples: ["00000001000101"]

    Version:
      type: integer
      format: int32
      minimum: 1
      description: Versão para controle de concorrência otimista.

    Uuid:
      type: string
      format: uuid

    TaxRegime:
      type: string
      enum: [SIMPLES_NACIONAL, LUCRO_PRESUMIDO, LUCRO_REAL, LUCRO_ARBITRADO, IMUNE_ISENTA]
      description: Regime tributário [PRD §8.1].

    RegimeGroup:
      type: string
      enum: [NORMAL, SIMPLES]
      description: Agrupamento do Fiscal (Normal não é regime) [PRD §5.1].

    ModuleCode:
      type: string
      enum: [FISCAL, DECLARATIONS, ACCOUNTING, PAYROLL, CREDENTIALS]
      description: Módulo contratual [PRD §7.4]. DCTFWeb é visão, não módulo.

    PayrollType:
      type: string
      enum: [NO_PAYROLL, PRO_LABORE, PAYROLL]
      description: Tipo de folha (Sem folha, Pró-labore, Folha) [PRD §17.1].

    UserRef:
      type: object
      required: [id, name]
      properties:
        id: { $ref: "#/components/schemas/Uuid" }
        name: { type: string }

    CompanyResponsibles:
      type: object
      required: [fiscal, accounting, payroll, declarations]
      properties:
        fiscal: { oneOf: [{ $ref: "#/components/schemas/UserRef" }, { type: "null" }] }
        accounting: { oneOf: [{ $ref: "#/components/schemas/UserRef" }, { type: "null" }] }
        payroll: { oneOf: [{ $ref: "#/components/schemas/UserRef" }, { type: "null" }] }
        declarations: { oneOf: [{ $ref: "#/components/schemas/UserRef" }, { type: "null" }] }

    Company:
      type: object
      required: [id, internal_code, legal_name, trade_name, cnpj, city, state, state_registration, municipal_registration,
                 service_start_date, service_end_date, active, payroll_type, factor_r, responsibles, notes,
                 current_tax_regime, current_regime_group, active_modules, version]
      properties:
        id: { $ref: "#/components/schemas/Uuid" }
        internal_code: { type: string }
        legal_name: { type: string }
        trade_name: { type: [string, "null"] }
        cnpj: { $ref: "#/components/schemas/Cnpj" }
        city: { type: [string, "null"] }
        state: { type: [string, "null"] }
        state_registration: { type: [string, "null"] }
        municipal_registration: { type: [string, "null"] }
        service_start_date: { $ref: "#/components/schemas/Date" }
        service_end_date: { oneOf: [{ $ref: "#/components/schemas/Date" }, { type: "null" }] }
        active: { type: boolean }
        payroll_type: { $ref: "#/components/schemas/PayrollType" }
        factor_r: { type: [boolean, "null"] }
        responsibles: { $ref: "#/components/schemas/CompanyResponsibles" }
        notes: { type: [string, "null"] }
        current_tax_regime: { oneOf: [{ $ref: "#/components/schemas/TaxRegime" }, { type: "null" }] }
        current_regime_group: { oneOf: [{ $ref: "#/components/schemas/RegimeGroup" }, { type: "null" }] }
        active_modules:
          type: array
          items: { $ref: "#/components/schemas/ModuleCode" }
        version: { $ref: "#/components/schemas/Version" }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    CompanyList:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Company" }
        total: { type: integer }

    CompanyCreate:
      type: object
      additionalProperties: false
      required: [internal_code, legal_name, cnpj, service_start_date, payroll_type, tax_regime]
      properties:
        internal_code: { type: string, maxLength: 30 }
        legal_name: { type: string, maxLength: 200 }
        trade_name: { type: [string, "null"], maxLength: 200 }
        cnpj: { type: string, description: "Com ou sem máscara; armazenado com 14 dígitos" }
        city: { type: [string, "null"] }
        state: { type: [string, "null"], description: "UF com 2 letras" }
        state_registration: { type: [string, "null"] }
        municipal_registration: { type: [string, "null"] }
        service_start_date: { $ref: "#/components/schemas/Date" }
        service_end_date: { oneOf: [{ $ref: "#/components/schemas/Date" }, { type: "null" }] }
        payroll_type: { $ref: "#/components/schemas/PayrollType" }
        factor_r: { type: [boolean, "null"] }
        fiscal_responsible_user_id: { oneOf: [{ $ref: "#/components/schemas/Uuid" }, { type: "null" }] }
        accounting_responsible_user_id: { oneOf: [{ $ref: "#/components/schemas/Uuid" }, { type: "null" }] }
        payroll_responsible_user_id: { oneOf: [{ $ref: "#/components/schemas/Uuid" }, { type: "null" }] }
        declarations_responsible_user_id: { oneOf: [{ $ref: "#/components/schemas/Uuid" }, { type: "null" }] }
        notes: { type: [string, "null"] }
        tax_regime: { $ref: "#/components/schemas/TaxRegime" }
        modules:
          type: array
          description: Módulos ativos desde o início do atendimento. Ausente = todos.
          items: { $ref: "#/components/schemas/ModuleCode" }

    CompanyUpdate:
      type: object
      additionalProperties: false
      required: [version]
      properties:
        version: { $ref: "#/components/schemas/Version" }
        internal_code: { type: string }
        legal_name: { type: string }
        trade_name: { type: [string, "null"] }
        cnpj: { type: string }
        city: { type: [string, "null"] }
        state: { type: [string, "null"] }
        state_registration: { type: [string, "null"] }
        municipal_registration: { type: [string, "null"] }
        service_start_date: { $ref: "#/components/schemas/Date" }
        service_end_date: { oneOf: [{ $ref: "#/components/schemas/Date" }, { type: "null" }] }
        active: { type: boolean }
        payroll_type: { $ref: "#/components/schemas/PayrollType" }
        factor_r: { type: [boolean, "null"] }
        fiscal_responsible_user_id: { oneOf: [{ $ref: "#/components/schemas/Uuid" }, { type: "null" }] }
        accounting_responsible_user_id: { oneOf: [{ $ref: "#/components/schemas/Uuid" }, { type: "null" }] }
        payroll_responsible_user_id: { oneOf: [{ $ref: "#/components/schemas/Uuid" }, { type: "null" }] }
        declarations_responsible_user_id: { oneOf: [{ $ref: "#/components/schemas/Uuid" }, { type: "null" }] }
        notes: { type: [string, "null"] }

    ConflictingCompany:
      type: object
      description: Presente em `details.conflicting_company` dos erros CNPJ_CONFLICT/CODE_CONFLICT [CA-002].
      required: [id, internal_code, legal_name]
      properties:
        id: { $ref: "#/components/schemas/Uuid" }
        internal_code: { type: string }
        legal_name: { type: string }

    TaxRegimePeriod:
      type: object
      required: [id, tax_regime, regime_group, effective_from, effective_to, created_by, created_at]
      properties:
        id: { $ref: "#/components/schemas/Uuid" }
        tax_regime: { $ref: "#/components/schemas/TaxRegime" }
        regime_group: { $ref: "#/components/schemas/RegimeGroup" }
        effective_from: { $ref: "#/components/schemas/Competence" }
        effective_to: { oneOf: [{ $ref: "#/components/schemas/Competence" }, { type: "null" }] }
        created_by: { $ref: "#/components/schemas/UserRef" }
        created_at: { type: string, format: date-time }

    TaxRegimeTimeline:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/TaxRegimePeriod" }

    TaxRegimeChange:
      type: object
      additionalProperties: false
      required: [tax_regime, effective_from]
      properties:
        tax_regime: { $ref: "#/components/schemas/TaxRegime" }
        effective_from: { $ref: "#/components/schemas/Competence" }

    Applicability:
      type: string
      enum: [DEFAULT, APPLICABLE, NOT_APPLICABLE]
      description: Padrão / Aplicável / Não se aplica [PRD §9.2].

    SettingPeriod:
      type: object
      required: [effective_from, effective_to, created_by, created_at]
      properties:
        effective_from: { $ref: "#/components/schemas/Competence" }
        effective_to: { oneOf: [{ $ref: "#/components/schemas/Competence" }, { type: "null" }] }
        created_by: { $ref: "#/components/schemas/UserRef" }
        created_at: { type: string, format: date-time }

    ModulePeriod:
      allOf:
        - $ref: "#/components/schemas/SettingPeriod"
        - type: object
          required: [enabled]
          properties:
            enabled: { type: boolean }

    ModuleState:
      type: object
      required: [module, enabled, timeline]
      properties:
        module: { $ref: "#/components/schemas/ModuleCode" }
        enabled: { type: boolean, description: "Estado na competência de referência" }
        timeline:
          type: array
          items: { $ref: "#/components/schemas/ModulePeriod" }

    CompanyModules:
      type: object
      required: [reference_competence, suggested_effective_from, items]
      properties:
        reference_competence: { $ref: "#/components/schemas/Competence" }
        suggested_effective_from:
          $ref: "#/components/schemas/Competence"
        items:
          type: array
          items: { $ref: "#/components/schemas/ModuleState" }

    CompanyModuleChange:
      type: object
      additionalProperties: false
      required: [enabled, effective_from]
      properties:
        enabled: { type: boolean }
        effective_from: { $ref: "#/components/schemas/Competence" }

    ObligationTypeRef:
      type: object
      required: [id, code, name, primary_module]
      properties:
        id: { $ref: "#/components/schemas/Uuid" }
        code: { type: string }
        name: { type: string }
        primary_module: { type: string }

    OverridePeriod:
      allOf:
        - $ref: "#/components/schemas/SettingPeriod"
        - type: object
          required: [applicability]
          properties:
            applicability: { $ref: "#/components/schemas/Applicability" }

    OverrideState:
      type: object
      required: [obligation_type, applicability, default_applicable, effective_applicable, timeline]
      properties:
        obligation_type: { $ref: "#/components/schemas/ObligationTypeRef" }
        applicability: { $ref: "#/components/schemas/Applicability" }
        default_applicable:
          type: [boolean, "null"]
          description: Regra padrão para o regime vigente; null = tipo não gerado no regime
        effective_applicable:
          type: [boolean, "null"]
          description: Resultado override > padrão; null = não gerado no regime
        timeline:
          type: array
          items: { $ref: "#/components/schemas/OverridePeriod" }

    ObligationOverrides:
      type: object
      required: [reference_competence, suggested_effective_from, tax_regime, items]
      properties:
        reference_competence: { $ref: "#/components/schemas/Competence" }
        suggested_effective_from: { $ref: "#/components/schemas/Competence" }
        tax_regime: { oneOf: [{ $ref: "#/components/schemas/TaxRegime" }, { type: "null" }] }
        items:
          type: array
          items: { $ref: "#/components/schemas/OverrideState" }

    ObligationOverrideChange:
      type: object
      additionalProperties: false
      required: [applicability, effective_from]
      properties:
        applicability: { $ref: "#/components/schemas/Applicability" }
        effective_from: { $ref: "#/components/schemas/Competence" }

    DisplayModule:
      type: string
      enum: [FISCAL, DECLARATIONS, ACCOUNTING, PAYROLL, DCTFWEB]

    ObligationModule:
      type: string
      enum: [FISCAL, DECLARATIONS, ACCOUNTING, PAYROLL]

    DisplayContext:
      type: object
      required: [module_code, sort_order]
      properties:
        module_code: { $ref: "#/components/schemas/DisplayModule" }
        sort_order: { type: integer }

    RegimeRule:
      type: object
      required: [tax_regime]
      properties:
        tax_regime: { $ref: "#/components/schemas/TaxRegime" }
        default_applicable: { type: boolean }
        counts_in_progress: { type: boolean }

    Dependency:
      type: object
      required: [prerequisite_obligation_type_id, dependency_mode]
      properties:
        prerequisite_obligation_type_id: { $ref: "#/components/schemas/Uuid" }
        prerequisite_code: { type: string, readOnly: true }
        dependency_mode: { type: string, enum: [HARD, SOFT] }

    ObligationType:
      type: object
      required: [id, code, name, primary_module, status_set_code, periodicity, active, sort_order, counts_in_progress,
                 due_date_rule_id, allows_transmission_date, allows_protocol, initial_status_code, status_when_no_payroll,
                 is_closing_stage, version, display_contexts, regime_rules, dependencies]
      properties:
        id: { $ref: "#/components/schemas/Uuid" }
        code: { type: string }
        name: { type: string }
        primary_module: { $ref: "#/components/schemas/ObligationModule" }
        status_set_code: { type: string }
        periodicity: { type: string, enum: [MONTHLY] }
        active: { type: boolean }
        sort_order: { type: integer }
        counts_in_progress: { type: boolean }
        due_date_rule_id: { oneOf: [{ $ref: "#/components/schemas/Uuid" }, { type: "null" }] }
        allows_transmission_date: { type: boolean }
        allows_protocol: { type: boolean }
        initial_status_code: { type: string }
        status_when_no_payroll: { type: [string, "null"], enum: [NO_MOVEMENT, NOT_APPLICABLE, null] }
        is_closing_stage: { type: boolean }
        version: { $ref: "#/components/schemas/Version" }
        display_contexts: { type: array, items: { $ref: "#/components/schemas/DisplayContext" } }
        regime_rules: { type: array, items: { $ref: "#/components/schemas/RegimeRule" } }
        dependencies: { type: array, items: { $ref: "#/components/schemas/Dependency" } }

    ObligationTypeList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/ObligationType" } }

    ObligationTypeCreate:
      type: object
      additionalProperties: false
      required: [code, name, primary_module, status_set_code]
      properties:
        code: { type: string, description: "Maiúsculas, dígitos e _" }
        name: { type: string }
        primary_module: { $ref: "#/components/schemas/ObligationModule" }
        status_set_code: { type: string }
        sort_order: { type: integer }
        active: { type: boolean }
        counts_in_progress: { type: boolean }
        due_date_rule_id: { oneOf: [{ $ref: "#/components/schemas/Uuid" }, { type: "null" }] }
        allows_transmission_date: { type: boolean }
        allows_protocol: { type: boolean }
        initial_status_code: { type: string }
        status_when_no_payroll: { type: [string, "null"], enum: [NO_MOVEMENT, NOT_APPLICABLE, null] }
        display_contexts: { type: array, items: { $ref: "#/components/schemas/DisplayContext" } }
        regime_rules: { type: array, items: { $ref: "#/components/schemas/RegimeRule" } }
        dependencies: { type: array, items: { $ref: "#/components/schemas/Dependency" } }

    ObligationTypeUpdate:
      type: object
      additionalProperties: false
      required: [version]
      properties:
        version: { $ref: "#/components/schemas/Version" }
        name: { type: string }
        active: { type: boolean }
        sort_order: { type: integer }
        counts_in_progress: { type: boolean }
        due_date_rule_id: { $ref: "#/components/schemas/Uuid" }
        clear_due_date_rule: { type: boolean }
        allows_transmission_date: { type: boolean }
        allows_protocol: { type: boolean }
        initial_status_code: { type: string }
        status_when_no_payroll: { type: string, enum: [NO_MOVEMENT, NOT_APPLICABLE, NONE] }
        display_contexts: { type: array, items: { $ref: "#/components/schemas/DisplayContext" } }
        regime_rules: { type: array, items: { $ref: "#/components/schemas/RegimeRule" } }
        dependencies: { type: array, items: { $ref: "#/components/schemas/Dependency" } }

    StatusDefinition:
      type: object
      required: [code, label, sort_order, counts_as_started, counts_as_operational_progress, is_final, is_blocking, excluded_from_denominator]
      properties:
        code: { type: string }
        label: { type: string }
        sort_order: { type: integer }
        counts_as_started: { type: boolean }
        counts_as_operational_progress: { type: boolean }
        is_final: { type: boolean }
        is_blocking: { type: boolean }
        excluded_from_denominator: { type: boolean }

    StatusSet:
      type: object
      required: [id, code, name, statuses]
      properties:
        id: { $ref: "#/components/schemas/Uuid" }
        code: { type: string }
        name: { type: string }
        statuses: { type: array, items: { $ref: "#/components/schemas/StatusDefinition" } }

    StatusSetList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/StatusSet" } }

    DueDateRule:
      type: object
      required: [id, name, month_offset, base_day, day_type, non_business_day_adjustment, calendar_id, notes, version]
      properties:
        id: { $ref: "#/components/schemas/Uuid" }
        name: { type: string }
        month_offset: { type: integer, minimum: 0, maximum: 12 }
        base_day: { type: integer, minimum: 1, maximum: 31 }
        day_type: { type: string, enum: [CALENDAR, BUSINESS] }
        non_business_day_adjustment: { type: string, enum: [PREVIOUS, NEXT, NONE] }
        calendar_id: { oneOf: [{ $ref: "#/components/schemas/Uuid" }, { type: "null" }] }
        notes: { type: [string, "null"] }
        version: { $ref: "#/components/schemas/Version" }

    DueDateRuleList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/DueDateRule" } }

    DueDateRuleInput:
      type: object
      additionalProperties: false
      required: [name, month_offset, base_day, day_type, non_business_day_adjustment]
      properties:
        version: { $ref: "#/components/schemas/Version" }
        name: { type: string }
        month_offset: { type: integer, minimum: 0, maximum: 12 }
        base_day: { type: integer, minimum: 1, maximum: 31 }
        day_type: { type: string, enum: [CALENDAR, BUSINESS] }
        non_business_day_adjustment: { type: string, enum: [PREVIOUS, NEXT, NONE] }
        calendar_id: { oneOf: [{ $ref: "#/components/schemas/Uuid" }, { type: "null" }] }
        notes: { type: [string, "null"] }

    Calendar:
      type: object
      required: [id, name, scope, state, city, holiday_count]
      properties:
        id: { $ref: "#/components/schemas/Uuid" }
        name: { type: string }
        scope: { type: string, enum: [NATIONAL, STATE, MUNICIPAL] }
        state: { type: [string, "null"] }
        city: { type: [string, "null"] }
        holiday_count: { type: integer }

    CalendarList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/Calendar" } }

    Holiday:
      type: object
      required: [id, calendar_id, calendar_name, date, name, scope]
      properties:
        id: { $ref: "#/components/schemas/Uuid" }
        calendar_id: { $ref: "#/components/schemas/Uuid" }
        calendar_name: { type: string }
        date: { $ref: "#/components/schemas/Date" }
        name: { type: string }
        scope: { type: string, enum: [NATIONAL, STATE, MUNICIPAL, CUSTOM] }

    HolidayList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/Holiday" } }

    HolidayInput:
      type: object
      additionalProperties: false
      required: [scope, date, name]
      properties:
        scope: { type: string, enum: [NATIONAL, STATE, MUNICIPAL] }
        state: { type: [string, "null"] }
        city: { type: [string, "null"] }
        date: { $ref: "#/components/schemas/Date" }
        name: { type: string }

    CredentialType:
      type: string
      enum: [RFB_POWER_OF_ATTORNEY, DIGITAL_CERTIFICATE]
      description: Procuração RFB ou certificado digital.

    RenewalStatus:
      type: string
      enum: [CURRENT, RENEWAL_REQUESTED, AWAITING_CLIENT, RENEWED]
      description: Etapa de renovação [PRD §19.4]. RENEWED só é aceito na entrada e gravado como CURRENT.

    CredentialSituation:
      type: object
      required: [code, label, threshold_days, days_left]
      properties:
        code: { type: string, enum: [EXPIRED, DUE_SOON, CURRENT, NO_DATE] }
        label: { type: string, examples: ["Vence em até 7 dias"] }
        threshold_days: { type: [integer, "null"], description: "Faixa \"vence em até N dias\" (só em DUE_SOON)" }
        days_left: { type: [integer, "null"], description: "Dias até o vencimento; negativo se vencido" }

    CredentialFile:
      type: object
      required: [name, mime_type, size_bytes, uploaded_at]
      properties:
        name: { type: string }
        mime_type: { type: [string, "null"] }
        size_bytes: { type: [integer, "null"], format: int64 }
        uploaded_at: { type: string, format: date-time }

    CredentialControl:
      type: object
      required: [type, expires_at, renewal_status, renewal_label, situation, notes, file, version, updated_at]
      properties:
        type: { $ref: "#/components/schemas/CredentialType" }
        expires_at: { oneOf: [{ $ref: "#/components/schemas/Date" }, { type: "null" }] }
        renewal_status: { $ref: "#/components/schemas/RenewalStatus" }
        renewal_label: { type: string }
        situation: { $ref: "#/components/schemas/CredentialSituation" }
        notes: { type: [string, "null"] }
        file: { oneOf: [{ $ref: "#/components/schemas/CredentialFile" }, { type: "null" }] }
        version: { type: integer, format: int32, minimum: 0, description: "0 = ainda sem registro gravado" }
        updated_at: { type: [string, "null"], format: date-time }

    CredentialCompany:
      type: object
      required: [id, internal_code, legal_name, trade_name, cnpj, tax_regime]
      properties:
        id: { $ref: "#/components/schemas/Uuid" }
        internal_code: { type: string }
        legal_name: { type: string }
        trade_name: { type: [string, "null"] }
        cnpj: { $ref: "#/components/schemas/Cnpj" }
        tax_regime: { type: string, description: "Regime vigente na competência corrente (vazio se não houver)" }

    CredentialRow:
      type: object
      required: [company, rfb_power_of_attorney, digital_certificate]
      properties:
        company: { $ref: "#/components/schemas/CredentialCompany" }
        rfb_power_of_attorney: { $ref: "#/components/schemas/CredentialControl" }
        digital_certificate: { $ref: "#/components/schemas/CredentialControl" }

    CredentialList:
      type: object
      required: [items, total, thresholds]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/CredentialRow" } }
        total: { type: integer }
        thresholds: { type: array, items: { type: integer }, description: "Faixas configuradas, em dias" }

    CredentialUpdate:
      type: object
      additionalProperties: false
      required: [version, renewal_status]
      properties:
        version: { type: integer, format: int32, minimum: 0 }
        expires_at: { oneOf: [{ $ref: "#/components/schemas/Date" }, { type: "null" }] }
        renewal_status: { $ref: "#/components/schemas/RenewalStatus" }
        notes: { type: [string, "null"], maxLength: 2000 }

    ImportRowStatus:
      type: string
      enum: [NEW, EXISTING, INVALID_CNPJ, DUPLICATE_CODE, MISSING_REQUIRED, INVALID_VALUE]
      description: Classificação da linha [PRD §35.5]; só NEW e EXISTING (confirmada) são importadas.

    ImportFieldError:
      type: object
      required: [field, column, message]
      properties:
        field: { type: string }
        column: { type: string, description: "Cabeçalho da coluna na planilha" }
        message: { type: string }

    ImportRow:
      type: object
      required: [line, status, status_label, errors, internal_code, legal_name, cnpj, existing_company_id]
      properties:
        line: { type: integer, description: "Linha na planilha (cabeçalho = 1)" }
        status: { $ref: "#/components/schemas/ImportRowStatus" }
        status_label: { type: string }
        errors: { type: array, items: { $ref: "#/components/schemas/ImportFieldError" } }
        internal_code: { type: string }
        legal_name: { type: string }
        cnpj: { type: string, description: "Somente dígitos" }
        existing_company_id: { oneOf: [{ $ref: "#/components/schemas/Uuid" }, { type: "null" }] }

    ImportSummary:
      type: object
      required: [total, importable, by_status]
      properties:
        total: { type: integer }
        importable: { type: integer }
        by_status: { type: object, additionalProperties: { type: integer } }

    ImportPreview:
      type: object
      required: [token, file_name, expires_at, summary, unknown_headers, rows]
      properties:
        token: { $ref: "#/components/schemas/Uuid" }
        file_name: { type: string }
        expires_at: { type: string, format: date-time }
        summary: { $ref: "#/components/schemas/ImportSummary" }
        unknown_headers: { type: array, items: { type: string }, description: "Colunas ignoradas" }
        rows: { type: array, items: { $ref: "#/components/schemas/ImportRow" } }

    ImportCommit:
      type: object
      additionalProperties: false
      required: [token]
      properties:
        token: { $ref: "#/components/schemas/Uuid" }
        update_existing_rows: { type: array, items: { type: integer }, description: "Linhas de empresas existentes cuja atualização foi confirmada" }

    ImportResult:
      type: object
      required: [created, updated, skipped_existing, skipped_invalid, companies]
      properties:
        created: { type: integer }
        updated: { type: integer }
        skipped_existing: { type: integer }
        skipped_invalid: { type: integer }
        companies:
          type: array
          items:
            type: object
            required: [line, company_id, internal_code, legal_name, action]
            properties:
              line: { type: integer }
              company_id: { $ref: "#/components/schemas/Uuid" }
              internal_code: { type: string }
              legal_name: { type: string }
              action: { type: string, enum: [CREATED, UPDATED] }

    CredentialThresholds:
      type: object
      additionalProperties: false
      required: [days]
      properties:
        days:
          type: array
          description: Faixas "vence em até N dias", crescentes (padrão 7, 15, 30, 60)
          items: { type: integer, minimum: 1, maximum: 365 }

    AIProvider:
      type: string
      description: Provedor com rota no gateway (litellm/config.yaml)
      enum: [openai, anthropic]

    AIModelSource:
      type: string
      description: >-
        De onde vem o modelo das novas corridas: `settings` = escolha da tela; `env` = padrão do
        ambiente (`<ALIAS>_MODEL`); `none` = sem modelo (as corridas falham até configurar).
      enum: [settings, env, none]

    AIModelName:
      type: string
      description: >-
        Nome do modelo no provedor, sem o prefixo (ex. `gpt-6-luna`). Nome com cara de chave de
        API (`sk-…`, `pk-…`, `rk-…`) é recusado.
      pattern: "^[A-Za-z0-9][A-Za-z0-9._:-]{0,199}$"
      examples: [gpt-6-luna]

    AIModelParameters:
      type: object
      additionalProperties: false
      description: Parâmetros de chamada permitidos (lista fechada); ausente = padrão do provedor. Nunca credenciais.
      properties:
        temperature: { type: number, minimum: 0, maximum: 2 }
        max_tokens: { type: integer, format: int32, minimum: 1, maximum: 1000000 }

    AIModelAlias:
      type: object
      required: [alias, module, purpose, requirements, provider, model, default_model, effective_model, source, parameters, enabled, version, updated_at]
      properties:
        alias: { type: string, examples: [triador] }
        module: { type: string, enum: [conciliacao, fator_r] }
        purpose: { type: string }
        requirements:
          type: object
          description: O que o agente exige do modelo (conferido na validação)
          required: [structured_output, vision]
          properties:
            structured_output: { type: boolean }
            vision: { type: boolean }
        provider:
          description: Escolha gravada na tela; null = padrão do ambiente
          oneOf: [{ $ref: "#/components/schemas/AIProvider" }, { type: "null" }]
        model:
          description: Escolha gravada na tela; null = padrão do ambiente
          oneOf: [{ $ref: "#/components/schemas/AIModelName" }, { type: "null" }]
        default_model: { type: [string, "null"], description: "Padrão do ambiente, em provedor/modelo", examples: [openai/gpt-6-luna] }
        effective_model: { type: [string, "null"], description: "Modelo das novas corridas, em provedor/modelo; null = sem modelo" }
        source: { $ref: "#/components/schemas/AIModelSource" }
        parameters: { $ref: "#/components/schemas/AIModelParameters" }
        enabled: { type: boolean, description: "Desligado: as corridas do agente não resolvem modelo" }
        version: { type: integer, format: int32, minimum: 1 }
        updated_at: { type: string, format: date-time }

    AIModelList:
      type: object
      required: [gateway_configured, items]
      properties:
        gateway_configured:
          type: boolean
          description: false = LITELLM_BASE_URL ausente; sem gateway não há como validar nem trocar o modelo
        items:
          type: array
          items: { $ref: "#/components/schemas/AIModelAlias" }

    AIModelUpdate:
      type: object
      additionalProperties: false
      description: Configuração completa do alias. provider e model nulos voltam ao padrão do ambiente.
      required: [provider, model, parameters, enabled, version]
      properties:
        provider: { oneOf: [{ $ref: "#/components/schemas/AIProvider" }, { type: "null" }] }
        model: { oneOf: [{ $ref: "#/components/schemas/AIModelName" }, { type: "null" }] }
        parameters: { $ref: "#/components/schemas/AIModelParameters" }
        enabled: { type: boolean }
        version: { type: integer, format: int32, minimum: 1, description: "Versão lida; diferente da atual = 409 VERSION_CONFLICT" }

    AIModelValidateRequest:
      type: object
      additionalProperties: false
      required: [provider, model, parameters]
      properties:
        provider: { oneOf: [{ $ref: "#/components/schemas/AIProvider" }, { type: "null" }] }
        model: { oneOf: [{ $ref: "#/components/schemas/AIModelName" }, { type: "null" }] }
        parameters: { $ref: "#/components/schemas/AIModelParameters" }

    AIModelCheck:
      type: object
      required: [code, ok, message]
      properties:
        code:
          type: string
          enum: [MODEL_CONFIGURED, MODEL_KNOWN, CHAT_MODE, STRUCTURED_OUTPUT, VISION, PARAM_TEMPERATURE, PARAM_MAX_TOKENS]
        ok: { type: boolean }
        message: { type: string }

    AIModelCapabilities:
      type: object
      description: Capacidades do modelo segundo a tabela de modelos do gateway
      required: [mode, structured_output, vision, max_output_tokens, parameters]
      properties:
        mode: { type: string, examples: [chat] }
        structured_output: { type: boolean }
        vision: { type: boolean }
        max_output_tokens: { type: [integer, "null"], format: int32 }
        parameters:
          type: array
          description: Parâmetros permitidos que o modelo aceita
          items: { type: string, enum: [temperature, max_tokens] }

    AIModelValidation:
      type: object
      required: [ok, model, source, checks, capabilities]
      properties:
        ok: { type: boolean }
        model: { type: [string, "null"], description: "Modelo conferido, em provedor/modelo" }
        source: { $ref: "#/components/schemas/AIModelSource" }
        checks:
          type: array
          items: { $ref: "#/components/schemas/AIModelCheck" }
        capabilities:
          oneOf: [{ $ref: "#/components/schemas/AIModelCapabilities" }, { type: "null" }]

    AIRunStatus:
      type: string
      description: Resultado da corrida, como na origem
      enum: [ok, error, needs_review]

    AISyncStatus:
      type: string
      description: Sincronização com o Langfuse; failed é reenviado periodicamente
      enum: [pending, ok, failed]

    AIRun:
      type: object
      required: [trace_id, agent, trigger, status, confidence, latency_ms, company_id, competence, alias, provider, model, tokens_in, tokens_out, cost_usd, langfuse_sync_status, has_human_eval, created_at]
      properties:
        trace_id: { type: string, pattern: "^[0-9a-f]{32}$" }
        agent: { type: string, examples: [consultor] }
        trigger: { type: string, examples: [pergunta] }
        status: { $ref: "#/components/schemas/AIRunStatus" }
        confidence: { oneOf: [{ $ref: "#/components/schemas/DecimalString" }, { type: "null" }] }
        latency_ms: { type: [integer, "null"], format: int32 }
        company_id: { oneOf: [{ $ref: "#/components/schemas/Uuid" }, { type: "null" }] }
        competence:
          description: Competência (Conciliação) ou PA (Fator R)
          oneOf: [{ $ref: "#/components/schemas/Competence" }, { type: "null" }]
        alias: { type: [string, "null"], description: "Snapshot da resolução do alias; nulo em agente determinístico" }
        provider: { type: [string, "null"] }
        model: { type: [string, "null"] }
        tokens_in: { type: [integer, "null"], format: int32 }
        tokens_out: { type: [integer, "null"], format: int32 }
        cost_usd: { oneOf: [{ $ref: "#/components/schemas/DecimalString" }, { type: "null" }] }
        langfuse_sync_status: { $ref: "#/components/schemas/AISyncStatus" }
        has_human_eval: { type: boolean }
        created_at: { type: string, format: date-time }

    AIRunList:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/AIRun" }
        total: { type: integer, format: int64 }

    AIRunSpan:
      type: object
      description: Passo da corrida (plan, parse, tool, decide, render) ou chamada ao LLM (generation)
      required: [id, name, type, start, end]
      properties:
        id: { type: string }
        parent_id: { type: string, description: "Ausente: filho da raiz" }
        name: { type: string }
        type: { type: string, enum: [chain, tool, generation] }
        start: { type: string, format: date-time }
        end: { type: string, format: date-time }
        level: { type: string, enum: [WARNING, ERROR] }
        status_message: { type: string }
        input: {}
        output: {}
        metadata: { type: object, additionalProperties: { type: string } }
        model: { type: string }
        response_model: { type: string }
        tokens_in: { type: integer }
        tokens_out: { type: integer }
        cost_usd: { type: string, description: "Custo informado pelo gateway, em decimal textual" }

    AIDecision:
      type: object
      required: [id, kind, data, created_at]
      properties:
        id: { $ref: "#/components/schemas/Uuid" }
        kind: { type: string }
        data: { type: object, additionalProperties: true }
        created_at: { type: string, format: date-time }

    AIGoldEval:
      type: object
      required: [field, expected, obtained, within_tolerance, status]
      properties:
        field: { type: string }
        expected: { type: [string, "null"] }
        obtained: { type: [string, "null"] }
        within_tolerance: { type: [boolean, "null"] }
        status: { type: string, enum: [ok, erro, ouro_indisponivel] }

    AIHumanEvalRating:
      type: string
      description: Nota humana, como na origem (score categórico human_eval no Langfuse)
      enum: [acerto, parcial, erro]

    AIHumanEval:
      type: object
      required: [id, user_id, rating, comment, created_at]
      properties:
        id: { $ref: "#/components/schemas/Uuid" }
        user_id: { $ref: "#/components/schemas/Uuid" }
        rating: { $ref: "#/components/schemas/AIHumanEvalRating" }
        comment: { type: [string, "null"] }
        created_at: { type: string, format: date-time }

    AIHumanEvalInput:
      type: object
      additionalProperties: false
      required: [rating]
      properties:
        rating: { $ref: "#/components/schemas/AIHumanEvalRating" }
        comment: { type: [string, "null"], maxLength: 2000, description: "Obrigatório quando a nota é erro" }

    AIRunDetail:
      allOf:
        - $ref: "#/components/schemas/AIRun"
        - type: object
          required: [model_config_version, prompt_version, error_code, metadata, input, output, decision, spans, decisions, gold_evals, human_evals, langfuse_attempts, langfuse_last_error, langfuse_synced_at, langfuse_url]
          properties:
            model_config_version: { type: [integer, "null"], format: int32, description: "Versão da configuração do alias usada (D-021)" }
            prompt_version: { type: [string, "null"] }
            error_code: { type: [string, "null"], description: "Código do erro (nunca a mensagem crua)" }
            metadata: { type: object, additionalProperties: { type: string } }
            input: { type: object, additionalProperties: true, description: "Entrada sanitizada" }
            output: { type: object, additionalProperties: true }
            decision: { type: object, additionalProperties: true }
            spans:
              type: array
              items: { $ref: "#/components/schemas/AIRunSpan" }
            decisions:
              type: array
              items: { $ref: "#/components/schemas/AIDecision" }
            gold_evals:
              type: array
              items: { $ref: "#/components/schemas/AIGoldEval" }
            human_evals:
              type: array
              items: { $ref: "#/components/schemas/AIHumanEval" }
            langfuse_attempts: { type: integer, format: int32 }
            langfuse_last_error: { type: [string, "null"], description: "Erro sanitizado do último envio" }
            langfuse_synced_at: { type: [string, "null"], format: date-time }
            langfuse_url: { type: [string, "null"], description: "Link para o trace no Langfuse" }

    AIAgentSummary:
      type: object
      required: [agent, runs, avg_latency_ms, avg_confidence, errors, reviews]
      properties:
        agent: { type: string }
        runs: { type: integer, format: int64 }
        avg_latency_ms: { type: [integer, "null"], format: int64 }
        avg_confidence: { oneOf: [{ $ref: "#/components/schemas/DecimalString" }, { type: "null" }] }
        errors: { type: integer, format: int64 }
        reviews: { type: integer, format: int64 }

    AISummary:
      type: object
      required: [runs_24h, runs_total, pending_human_eval, gold_accuracy, human_accuracy, by_agent, llm_cost_30d, llm_tokens_30d]
      properties:
        runs_24h: { type: integer, format: int64 }
        runs_total: { type: integer, format: int64 }
        pending_human_eval: { type: integer, format: int64 }
        gold_accuracy: { oneOf: [{ $ref: "#/components/schemas/DecimalString" }, { type: "null" }] }
        human_accuracy: { oneOf: [{ $ref: "#/components/schemas/DecimalString" }, { type: "null" }] }
        by_agent:
          type: array
          items: { $ref: "#/components/schemas/AIAgentSummary" }
        llm_cost_30d: { oneOf: [{ $ref: "#/components/schemas/DecimalString" }, { type: "null" }] }
        llm_tokens_30d: { type: [integer, "null"], format: int64 }

    CompetenceInfo:
      type: object
      required: [competence, created_at, companies, instances, open_periods, closed_periods]
      properties:
        competence: { $ref: "#/components/schemas/Competence" }
        created_at: { type: string, format: date-time }
        companies: { type: integer }
        instances: { type: integer }
        open_periods: { type: integer }
        closed_periods: { type: integer }

    CompetenceList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/CompetenceInfo" } }

    LatestCompetence:
      type: object
      required: [competence, current]
      properties:
        competence: { $ref: "#/components/schemas/Competence" }
        current: { $ref: "#/components/schemas/Competence" }

    EnsureSummary:
      type: object
      required: [competence, companies_processed, periods_created, instances_created]
      properties:
        competence: { $ref: "#/components/schemas/Competence" }
        companies_processed: { type: integer }
        periods_created: { type: integer }
        instances_created: { type: integer }

    Progress:
      type: object
      required: [denominator, operational_done, final_done, blocking, operational_progress, final_completion, ready_to_close]
      properties:
        denominator: { type: integer, description: "Itens aplicáveis que contam no progresso" }
        operational_done: { type: integer }
        final_done: { type: integer }
        blocking: { type: integer, description: "Pendências (status que bloqueiam)" }
        operational_progress: { type: number, description: "0..1" }
        final_completion: { type: number, description: "0..1" }
        ready_to_close: { type: boolean }

    ObligationInstance:
      type: object
      required: [id, company_id, competence, obligation_type, status_code, status_label, applicable, counts_in_progress,
                 is_final, is_started, is_blocking, is_overdue, due_date_original, due_date_effective, due_overridden,
                 due_date_override_reason, transmission_date, protocol, has_history, version, last_changed_at, last_changed_by]
      properties:
        id: { $ref: "#/components/schemas/Uuid" }
        company_id: { $ref: "#/components/schemas/Uuid" }
        competence: { $ref: "#/components/schemas/Competence" }
        obligation_type: { $ref: "#/components/schemas/ObligationTypeRef" }
        status_code: { type: string }
        status_label: { type: string }
        applicable: { type: boolean }
        counts_in_progress: { type: boolean }
        is_final: { type: boolean }
        is_started: { type: boolean }
        is_blocking: { type: boolean }
        is_overdue: { type: boolean, description: "Calculado: aplicável, não final e vencimento efetivo < hoje" }
        due_date_original: { oneOf: [{ $ref: "#/components/schemas/Date" }, { type: "null" }] }
        due_date_effective: { oneOf: [{ $ref: "#/components/schemas/Date" }, { type: "null" }] }
        due_overridden: { type: boolean }
        due_date_override_reason: { type: [string, "null"] }
        transmission_date: { oneOf: [{ $ref: "#/components/schemas/Date" }, { type: "null" }] }
        protocol: { type: [string, "null"] }
        has_history: { type: boolean }
        version: { $ref: "#/components/schemas/Version" }
        last_changed_at: { type: [string, "null"], format: date-time }
        last_changed_by: { type: [string, "null"] }

    RowSummary:
      type: object
      required: [module, progress, overdue, nearest_deadline]
      properties:
        module: { type: string }
        progress: { $ref: "#/components/schemas/Progress" }
        overdue: { type: integer }
        nearest_deadline: { oneOf: [{ $ref: "#/components/schemas/Date" }, { type: "null" }] }

    StatusChange:
      type: object
      additionalProperties: false
      required: [status_code, version]
      properties:
        status_code: { type: string }
        version: { $ref: "#/components/schemas/Version" }
        confirm_exception: { type: boolean, description: "Confirma exceção de dependência SOFT (DCTFWeb)" }
        exception_reason: { type: [string, "null"] }

    BulkStatusChange:
      type: object
      additionalProperties: false
      required: [status_code]
      description: Informe instance_ids ou target (exatamente um).
      properties:
        instance_ids:
          type: array
          maxItems: 5000
          items: { type: string, format: uuid }
        target:
          type: [object, "null"]
          additionalProperties: false
          required: [competence, obligation_type_id, company_ids]
          properties:
            competence: { $ref: "#/components/schemas/Competence" }
            obligation_type_id: { type: string, format: uuid }
            company_ids:
              type: array
              minItems: 1
              maxItems: 2000
              items: { type: string, format: uuid }
        status_code: { type: string }
        dry_run: { type: boolean, description: "Só calcula o resultado, sem gravar" }
        confirm_exception: { type: boolean, description: "Confirma exceção de dependência SOFT para o lote" }
        exception_reason: { type: [string, "null"] }

    BulkStatusSkipped:
      type: object
      required: [id, company_code, company_name, reason, message]
      properties:
        id: { type: string, format: uuid }
        company_code: { type: string }
        company_name: { type: string }
        reason:
          type: string
          enum: [PERIOD_CLOSED, NOT_APPLICABLE, DEPENDENCY_BLOCKED, INVALID_STATUS, UNCHANGED]
        message: { type: string }

    BulkStatusResult:
      type: object
      required: [dry_run, selected, updated, skipped, soft_warnings]
      properties:
        dry_run: { type: boolean }
        selected: { type: integer }
        updated: { type: integer, description: "Instâncias alteradas (ou que seriam, com dry_run)" }
        skipped:
          type: array
          items: { $ref: "#/components/schemas/BulkStatusSkipped" }
        soft_warnings: { type: integer, description: "Instâncias com pré-requisitos SOFT pendentes" }

    StatusChangeResult:
      type: object
      required: [instance, row]
      properties:
        instance: { $ref: "#/components/schemas/ObligationInstance" }
        row: { $ref: "#/components/schemas/RowSummary" }

    InstanceDetails:
      type: object
      additionalProperties: false
      required: [version]
      properties:
        version: { $ref: "#/components/schemas/Version" }
        transmission_date: { oneOf: [{ $ref: "#/components/schemas/Date" }, { type: "null" }] }
        protocol: { type: [string, "null"], maxLength: 120 }
        due_date_effective: { $ref: "#/components/schemas/Date" }
        due_date_override_reason: { type: string, description: "Obrigatório ao alterar o vencimento" }
        applicable: { type: boolean }

    HistoryEntry:
      type: object
      required: [id, field, old_value, new_value, old_label, new_label, change_source, override_reason, user, created_at]
      properties:
        id: { $ref: "#/components/schemas/Uuid" }
        field: { type: string, enum: [STATUS, DUE_DATE, APPLICABLE, TRANSMISSION_DATE, PROTOCOL] }
        old_value: { type: [string, "null"] }
        new_value: { type: [string, "null"] }
        old_label: { type: [string, "null"] }
        new_label: { type: [string, "null"] }
        change_source:
          type: string
          enum: [INLINE, BULK, IMPORT, SYSTEM, SYSTEM_INTEGRATION]
          description: "SYSTEM_INTEGRATION: mudança automática de outro módulo (a conclusão da Conciliação, TASK-022), com o evento em override_reason"
        override_reason: { type: [string, "null"] }
        user: { $ref: "#/components/schemas/UserRef" }
        created_at: { type: string, format: date-time }

    InstanceHistory:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/HistoryEntry" } }

    CompanyModulePeriod:
      type: object
      required: [id, company_id, competence, module, state, closed_at, closed_by, general_note, version]
      properties:
        id: { $ref: "#/components/schemas/Uuid" }
        company_id: { $ref: "#/components/schemas/Uuid" }
        competence: { $ref: "#/components/schemas/Competence" }
        module: { type: string, enum: [FISCAL, DECLARATIONS, ACCOUNTING, PAYROLL] }
        state: { type: string, enum: [OPEN, CLOSED] }
        closed_at: { type: [string, "null"], format: date-time }
        closed_by:
          oneOf:
            - $ref: "#/components/schemas/UserRef"
            - type: "null"
        general_note: { type: [string, "null"] }
        version: { $ref: "#/components/schemas/Version" }

    CompanyModulePeriodClose:
      type: object
      additionalProperties: false
      required: [version]
      properties:
        version: { $ref: "#/components/schemas/Version" }
        confirm_set_closing:
          type: boolean
          description: Confirma marcar o estágio de fechamento do módulo (Fiscal "Fechamento") como encerrado no mesmo ato

    CompanyModulePeriodReopen:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason: { type: string, maxLength: 1000 }
        version: { $ref: "#/components/schemas/Version" }

    CompanyModulePeriodNote:
      type: object
      additionalProperties: false
      required: [version, general_note]
      properties:
        version: { $ref: "#/components/schemas/Version" }
        general_note: { type: [string, "null"], maxLength: 2000, description: "Vazio ou null limpa a observação" }

    CompanyModulePeriodEvent:
      type: object
      required: [id, event_type, reason, user, created_at]
      properties:
        id: { $ref: "#/components/schemas/Uuid" }
        event_type: { type: string, enum: [OPENED, CLOSED, REOPENED] }
        reason: { type: [string, "null"] }
        user: { $ref: "#/components/schemas/UserRef" }
        created_at: { type: string, format: date-time }

    CompanyModulePeriodEvents:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/CompanyModulePeriodEvent" } }

    DependencyRef:
      type: object
      required: [obligation_type_id, code, name, status_code]
      properties:
        obligation_type_id: { $ref: "#/components/schemas/Uuid" }
        code: { type: string }
        name: { type: string }
        status_code: { type: string }

    DependencyStatus:
      type: object
      required: [ready, pending]
      properties:
        ready: { type: boolean, description: "Todos os componentes SOFT aplicáveis estão finais" }
        pending: { type: array, items: { $ref: "#/components/schemas/DependencyRef" } }

    GridColumn:
      type: object
      required: [obligation_type, sort_order, is_closing_stage, allows_transmission_date, allows_protocol, status_set_code, statuses]
      properties:
        obligation_type: { $ref: "#/components/schemas/ObligationTypeRef" }
        sort_order: { type: integer }
        is_closing_stage: { type: boolean, description: "Estágio de fechamento do módulo (Fiscal - Fechamento)" }
        allows_transmission_date: { type: boolean }
        allows_protocol: { type: boolean }
        status_set_code: { type: string }
        statuses: { type: array, items: { $ref: "#/components/schemas/StatusDefinition" } }

    GridCell:
      allOf:
        - $ref: "#/components/schemas/ObligationInstance"
        - type: object
          required: [blocked_by, blocked_message, dependency_status, locked]
          properties:
            blocked_by:
              type: array
              description: Etapas anteriores (HARD) aplicáveis e não finais que impedem concluir
              items: { $ref: "#/components/schemas/DependencyRef" }
            blocked_message:
              type: [string, "null"]
              description: Mensagem do bloqueio (PRD §18.3); null quando nada bloqueia
            dependency_status:
              description: Indicador SOFT (DCTFWeb); null quando o tipo não tem dependência SOFT
              oneOf:
                - $ref: "#/components/schemas/DependencyStatus"
                - type: "null"
            locked:
              type: boolean
              description: Módulo principal da instância fechado na competência (edição bloqueada até reabrir)

    GridRow:
      type: object
      required: [company, snapshot, period, progress, overdue, nearest_deadline, ready_to_close, dependencies, cells]
      properties:
        company:
          type: object
          required: [id, internal_code, legal_name, trade_name, cnpj]
          properties:
            id: { $ref: "#/components/schemas/Uuid" }
            internal_code: { type: string }
            legal_name: { type: string }
            trade_name: { type: [string, "null"] }
            cnpj: { $ref: "#/components/schemas/Cnpj" }
        snapshot:
          type: object
          description: Configuração usada na geração da competência (D4); responsável do módulo da grade
          required: [tax_regime, regime_group, payroll_type, factor_r, responsible]
          properties:
            tax_regime: { $ref: "#/components/schemas/TaxRegime" }
            regime_group: { $ref: "#/components/schemas/RegimeGroup" }
            payroll_type: { $ref: "#/components/schemas/PayrollType" }
            factor_r: { type: [boolean, "null"], description: "Somente no Simples; null nos demais regimes" }
            responsible:
              oneOf:
                - $ref: "#/components/schemas/UserRef"
                - type: "null"
        period:
          type: object
          required: [id, state, closed_at, closed_by, general_note, version]
          properties:
            id: { $ref: "#/components/schemas/Uuid" }
            state: { type: string, enum: [OPEN, CLOSED] }
            closed_at: { type: [string, "null"], format: date-time }
            closed_by:
              oneOf:
                - $ref: "#/components/schemas/UserRef"
                - type: "null"
            general_note: { type: [string, "null"] }
            version: { $ref: "#/components/schemas/Version" }
        progress: { $ref: "#/components/schemas/Progress" }
        overdue: { type: integer }
        nearest_deadline: { oneOf: [{ $ref: "#/components/schemas/Date" }, { type: "null" }] }
        ready_to_close: { type: boolean, description: "Todos os itens relevantes finais e módulo aberto (sugerir fechamento); false sem fechamento próprio" }
        dependencies:
          description: Coluna "dependências" da DCTFWeb (apta/pendente); null nas demais grades
          oneOf:
            - $ref: "#/components/schemas/DependencyStatus"
            - type: "null"
        cells:
          type: object
          description: Células por código do tipo de obrigação (colunas sem instância ficam ausentes)
          additionalProperties: { $ref: "#/components/schemas/GridCell" }

    ModuleGrid:
      type: object
      required: [module, period_module, closable, competence, group, today, columns, rows, total]
      properties:
        module: { type: string }
        period_module:
          type: string
          description: Módulo do período das linhas (observação e agregado da linha)
        closable: { type: boolean, description: "A grade tem fechamento próprio (a DCTFWeb não tem)" }
        competence: { $ref: "#/components/schemas/Competence" }
        group: { type: [string, "null"], enum: [normal, simples, null] }
        today: { $ref: "#/components/schemas/Date" }
        columns: { type: array, items: { $ref: "#/components/schemas/GridColumn" } }
        rows: { type: array, items: { $ref: "#/components/schemas/GridRow" } }
        total: { type: integer }

    Drilldown:
      type: object
      description: Rota da interface que explica o número, com os filtros na query (PRD §24.7)
      required: [path, query]
      properties:
        path: { type: string, examples: ["/obligations"] }
        query:
          type: object
          additionalProperties: { type: string }

    Metric:
      type: object
      required: [value, drilldown]
      properties:
        value: { type: integer }
        drilldown:
          oneOf:
            - $ref: "#/components/schemas/Drilldown"
            - type: "null"

    DashboardCounts:
      type: object
      description: Concluídas, em andamento, não iniciadas e pendentes particionam as aplicáveis que contam no progresso
      required: [applicable, done, in_progress, not_started, pending, overdue, operational_progress, final_completion]
      properties:
        applicable: { $ref: "#/components/schemas/Metric" }
        done: { $ref: "#/components/schemas/Metric" }
        in_progress: { $ref: "#/components/schemas/Metric" }
        not_started: { $ref: "#/components/schemas/Metric" }
        pending: { $ref: "#/components/schemas/Metric" }
        overdue: { $ref: "#/components/schemas/Metric" }
        operational_progress: { type: number }
        final_completion: { type: number }

    DashboardKPIs:
      allOf:
        - $ref: "#/components/schemas/DashboardCounts"
        - type: object
          required: [ready_to_close, previous_open]
          properties:
            ready_to_close:
              $ref: "#/components/schemas/Metric"
            previous_open:
              $ref: "#/components/schemas/Metric"

    DashboardModuleCard:
      allOf:
        - $ref: "#/components/schemas/DashboardCounts"
        - type: object
          required: [module, label, companies, ready_to_close, closed]
          properties:
            module: { type: string, enum: [FISCAL, DECLARATIONS, PAYROLL, ACCOUNTING] }
            label: { type: string }
            companies: { type: integer }
            ready_to_close: { $ref: "#/components/schemas/Metric" }
            closed: { $ref: "#/components/schemas/Metric" }

    DashboardCredentialCard:
      type: object
      required: [type, label, expired, due_soon, due_soon_days, current, no_date]
      properties:
        type: { type: string, enum: [RFB_POWER_OF_ATTORNEY, DIGITAL_CERTIFICATE] }
        label: { type: string }
        expired: { $ref: "#/components/schemas/Metric" }
        due_soon: { $ref: "#/components/schemas/Metric" }
        due_soon_days: { type: integer, description: "Maior faixa configurada de vencimento próximo" }
        current: { $ref: "#/components/schemas/Metric" }
        no_date: { $ref: "#/components/schemas/Metric" }

    DashboardResponsible:
      type: object
      required: [user, module, applicable, done, pending, overdue, operational_progress, final_completion]
      properties:
        user:
          oneOf:
            - $ref: "#/components/schemas/UserRef"
            - type: "null"
        module: { type: string }
        applicable: { type: integer }
        done: { type: integer }
        pending: { type: integer }
        overdue: { type: integer }
        operational_progress: { type: number }
        final_completion: { type: number }

    Dashboard:
      type: object
      required: [competence, today, filters, kpis, modules, credentials, responsibles, factor_r, reconciliation]
      properties:
        competence: { $ref: "#/components/schemas/Competence" }
        today: { $ref: "#/components/schemas/Date" }
        filters:
          type: object
          required: [regime_group, tax_regime, responsible_id]
          properties:
            regime_group: { type: [string, "null"] }
            tax_regime: { type: [string, "null"] }
            responsible_id: { type: [string, "null"] }
        kpis: { $ref: "#/components/schemas/DashboardKPIs" }
        modules: { type: array, items: { $ref: "#/components/schemas/DashboardModuleCard" } }
        credentials: { type: array, items: { $ref: "#/components/schemas/DashboardCredentialCard" } }
        responsibles: { type: array, items: { $ref: "#/components/schemas/DashboardResponsible" } }
        factor_r: { $ref: "#/components/schemas/DashboardFactorR" }
        reconciliation: { $ref: "#/components/schemas/DashboardReconciliation" }

    MoneyMetric:
      type: object
      description: Valor em reais clicável (D-038)
      required: [value, drilldown]
      properties:
        value: { $ref: "#/components/schemas/DecimalString" }
        drilldown:
          oneOf:
            - $ref: "#/components/schemas/Drilldown"
            - type: "null"

    DashboardFactorRPriority:
      type: object
      description: Empresa que exige ação, na ordem da carteira (semáforo e economia)
      required: [company, semaforo, fator_r, economia_12m, acao, acao_texto, drilldown]
      properties:
        company: { $ref: "#/components/schemas/FactorRPortfolioCompany" }
        semaforo: { oneOf: [{ $ref: "#/components/schemas/FactorRLight" }, { type: "null" }] }
        fator_r: { oneOf: [{ $ref: "#/components/schemas/DecimalString" }, { type: "null" }] }
        economia_12m: { oneOf: [{ $ref: "#/components/schemas/DecimalString" }, { type: "null" }] }
        acao: { $ref: "#/components/schemas/FactorRAction" }
        acao_texto: { type: string }
        drilldown: { $ref: "#/components/schemas/Drilldown" }

    DashboardFactorR:
      type: object
      description: |
        A carteira do Fator R no PA igual à competência do Dashboard (PRD §8; TASK-024, D-038),
        calculada pelo motor da carteira (`GET /factor-r/portfolio`), com o responsável do Fiscal
        no filtro. O drill-down leva à carteira com o filtro de semáforo (`semaforo`, separado por
        vírgula; `insuficiente` são os dados insuficientes). Sem tabela do Simples vigente no PA,
        `unavailable` traz o motivo e os números ficam zerados.
      required: [pa, unavailable, meta_operacional, monitored, red, yellow, green, insufficient, savings_at_play, action_required, priorities]
      properties:
        pa: { $ref: "#/components/schemas/Competence" }
        unavailable: { type: [string, "null"] }
        meta_operacional: { type: string, description: "A meta operacional da política (vazia se indisponível)" }
        monitored: { $ref: "#/components/schemas/Metric" }
        red: { $ref: "#/components/schemas/Metric" }
        yellow: { $ref: "#/components/schemas/Metric" }
        green: { $ref: "#/components/schemas/Metric" }
        insufficient: { $ref: "#/components/schemas/Metric" }
        savings_at_play:
          $ref: "#/components/schemas/MoneyMetric"
          description: A economia positiva em 12 meses de quem está no vermelho ou no amarelo
        action_required:
          $ref: "#/components/schemas/Metric"
          description: Empresas com ação sugerida diferente de manter (vermelho, amarelo e dados insuficientes)
        priorities:
          type: array
          description: As cinco primeiras que exigem ação, na ordem da carteira
          items: { $ref: "#/components/schemas/DashboardFactorRPriority" }

    DashboardReconciliation:
      type: object
      description: |
        A Conciliação (PRD §8, 08 §3; TASK-024, D-038), com o responsável do Contábil no filtro.
        Os documentos contam todas as competências (decisão do usuário): processando (pendente e
        triado), em revisão de triagem ou extração e parados por período fechado. A fila e as
        empresas são as da competência: as prontas para concluir (o extrato todo resolvido, ainda
        não concluídas) e as com o Contábil bloqueado (aberto, a empresa usa a Conciliação e a
        obrigação Conciliação aplicável não está final; decisão do usuário).
      required: [processing, extraction_review, closed_period, queue, divergent, without_receipt, without_statement, ready, blocks_accounting]
      properties:
        processing: { $ref: "#/components/schemas/Metric" }
        extraction_review: { $ref: "#/components/schemas/Metric" }
        closed_period: { $ref: "#/components/schemas/Metric" }
        queue: { $ref: "#/components/schemas/Metric" }
        divergent: { $ref: "#/components/schemas/Metric" }
        without_receipt: { $ref: "#/components/schemas/Metric" }
        without_statement: { $ref: "#/components/schemas/Metric" }
        ready: { $ref: "#/components/schemas/Metric" }
        blocks_accounting: { $ref: "#/components/schemas/Metric" }

    ReconciliationOverviewCompany:
      type: object
      description: A Conciliação de uma empresa na competência (TASK-024, D-038)
      required: [company, state, statements, blocking, without_statement, uses_reconciliation, accounting_state, obligation, blocks_accounting]
      properties:
        company:
          type: object
          required: [id, internal_code, legal_name]
          properties:
            id: { $ref: "#/components/schemas/Uuid" }
            internal_code: { type: string }
            legal_name: { type: string }
        state:
          type: string
          enum: [em_andamento, pronta, concluida]
          description: A regra da conclusão (D-036)
        statements: { type: integer, description: "Extratos importados que cobrem a competência" }
        blocking:
          type: object
          required: [missing_statement, divergent, without_receipt, review, classification]
          properties:
            missing_statement: { type: boolean }
            divergent: { type: integer }
            without_receipt: { type: integer }
            review: { type: integer }
            classification: { type: integer }
        without_statement: { type: integer, description: "Comprovantes sem extrato (só avisam)" }
        uses_reconciliation:
          type: boolean
          description: Extrato que cobre a competência ou documento dela (a guarda do fechamento do Contábil, D-037)
        accounting_state: { type: [string, "null"], enum: [OPEN, CLOSED, null] }
        obligation:
          oneOf:
            - type: object
              required: [instance_id, status_code, status_label, is_final, applicable]
              properties:
                instance_id: { $ref: "#/components/schemas/Uuid" }
                status_code: { type: string }
                status_label: { type: string }
                is_final: { type: boolean }
                applicable: { type: boolean }
            - type: "null"
        blocks_accounting:
          type: boolean
          description: O Contábil está aberto e não fecha pela Conciliação (a obrigação aplicável não está final)

    ReconciliationOverview:
      type: object
      required: [competence, counts, items]
      properties:
        competence: { $ref: "#/components/schemas/Competence" }
        counts:
          type: object
          description: Totais antes dos filtros de estado e de bloqueio
          required: [total, em_andamento, pronta, concluida, blocks_accounting]
          properties:
            total: { type: integer }
            em_andamento: { type: integer }
            pronta: { type: integer }
            concluida: { type: integer }
            blocks_accounting: { type: integer }
        items:
          type: array
          items: { $ref: "#/components/schemas/ReconciliationOverviewCompany" }

    AttentionItem:
      type: object
      required: [company, title, detail, date, drilldown]
      properties:
        company:
          type: object
          required: [id, internal_code, legal_name]
          properties:
            id: { $ref: "#/components/schemas/Uuid" }
            internal_code: { type: string }
            legal_name: { type: string }
        title: { type: string }
        detail: { type: string }
        date: { oneOf: [{ $ref: "#/components/schemas/Date" }, { type: "null" }] }
        drilldown:
          oneOf:
            - $ref: "#/components/schemas/Drilldown"
            - type: "null"

    AttentionCategory:
      type: object
      required: [key, label, count, sample, drilldown]
      properties:
        key:
          type: string
          enum: [OVERDUE, PENDING, MISSING_DOCUMENTS, ERROR, CERTIFICATE_EXPIRED, CERTIFICATE_DUE_SOON,
                 POWER_OF_ATTORNEY_EXPIRED, POWER_OF_ATTORNEY_DUE_SOON, PREVIOUS_OPEN, DCTFWEB_BLOCKED, ACCOUNTING_BLOCKED]
        label: { type: string }
        count: { type: integer }
        sample: { type: array, maxItems: 5, items: { $ref: "#/components/schemas/AttentionItem" } }
        drilldown:
          oneOf:
            - $ref: "#/components/schemas/Drilldown"
            - type: "null"

    DocumentModule:
      type: string
      enum: [factor_r, reconciliation, credentials]

    DocumentKind:
      type: string
      enum: [pgdas, extrato, comprovante, desconhecido, procuracao, certificado]

    DocumentSituation:
      type: string
      enum: [em_processamento, em_revisao, concluido, descartado]

    DocumentIndexItem:
      type: object
      required: [id, module, storage_backend, kind, status, situation, company, competence, period_start, period_end, bank, file_name, expires_at, received_at, updated_at, detail]
      properties:
        id: { $ref: "#/components/schemas/Uuid" }
        module: { $ref: "#/components/schemas/DocumentModule" }
        storage_backend: { type: string, enum: [local, minio] }
        kind: { $ref: "#/components/schemas/DocumentKind" }
        status: { type: string, description: "O status do módulo, sem tradução" }
        situation: { $ref: "#/components/schemas/DocumentSituation" }
        company:
          oneOf:
            - type: object
              required: [id, internal_code, legal_name]
              properties:
                id: { $ref: "#/components/schemas/Uuid" }
                internal_code: { type: string }
                legal_name: { type: string }
            - type: "null"
        competence: { oneOf: [{ $ref: "#/components/schemas/Competence" }, { type: "null" }] }
        period_start: { oneOf: [{ $ref: "#/components/schemas/Date" }, { type: "null" }] }
        period_end: { oneOf: [{ $ref: "#/components/schemas/Date" }, { type: "null" }] }
        bank: { type: [string, "null"] }
        file_name: { type: string }
        expires_at: { oneOf: [{ $ref: "#/components/schemas/Date" }, { type: "null" }], description: "Validade da procuração ou do certificado" }
        received_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        detail: { $ref: "#/components/schemas/Drilldown" }

    DocumentIndex:
      type: object
      required: [items, total, counts]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/DocumentIndexItem" } }
        total: { type: integer }
        counts:
          type: array
          description: Quantidades por módulo, situação e status com os filtros de empresa, tipo, banco e competência
          items:
            type: object
            required: [module, situation, status, total]
            properties:
              module: { $ref: "#/components/schemas/DocumentModule" }
              situation: { $ref: "#/components/schemas/DocumentSituation" }
              status: { type: string }
              total: { type: integer }

    CompanyOverview:
      type: object
      description: A Visão geral da empresa na competência (TASK-025, D-039)
      required: [company, competence, competence_generated, modules, next_due, factor_r, reconciliation, attention]
      properties:
        company:
          type: object
          required: [id, internal_code, legal_name]
          properties:
            id: { $ref: "#/components/schemas/Uuid" }
            internal_code: { type: string }
            legal_name: { type: string }
        competence: { $ref: "#/components/schemas/Competence" }
        competence_generated: { type: boolean }
        modules:
          type: array
          items:
            type: object
            required: [module, label, period_state, applicable, done, pending, overdue, operational_progress, final_completion, drilldown]
            properties:
              module: { type: string }
              label: { type: string }
              period_state: { type: string, enum: [OPEN, CLOSED] }
              applicable: { type: integer }
              done: { type: integer }
              pending: { type: integer }
              overdue: { type: integer }
              operational_progress: { type: number }
              final_completion: { type: number }
              drilldown: { oneOf: [{ $ref: "#/components/schemas/Drilldown" }, { type: "null" }] }
        next_due:
          type: array
          items:
            type: object
            required: [instance_id, module, module_label, obligation, status_label, due_date, overdue, drilldown]
            properties:
              instance_id: { $ref: "#/components/schemas/Uuid" }
              module: { type: string }
              module_label: { type: string }
              obligation: { type: string }
              status_label: { type: string }
              due_date: { oneOf: [{ $ref: "#/components/schemas/Date" }, { type: "null" }] }
              overdue: { type: boolean }
              drilldown: { oneOf: [{ $ref: "#/components/schemas/Drilldown" }, { type: "null" }] }
        factor_r:
          oneOf:
            - type: object
              required: [pa, status, motivo, semaforo, fator_r, anexo, economia_12m, acao, acao_texto, trend]
              properties:
                pa: { $ref: "#/components/schemas/Competence" }
                status: { $ref: "#/components/schemas/FactorRStatus" }
                motivo: { oneOf: [{ $ref: "#/components/schemas/FactorRReason" }, { type: "null" }] }
                semaforo: { oneOf: [{ $ref: "#/components/schemas/FactorRLight" }, { type: "null" }] }
                fator_r: { oneOf: [{ $ref: "#/components/schemas/DecimalString" }, { type: "null" }] }
                anexo: { oneOf: [{ $ref: "#/components/schemas/FactorRAnnex" }, { type: "null" }] }
                economia_12m: { oneOf: [{ $ref: "#/components/schemas/DecimalString" }, { type: "null" }] }
                acao: { $ref: "#/components/schemas/FactorRAction" }
                acao_texto: { type: string }
                trend:
                  type: array
                  description: Os últimos seis PAs até o da competência (sem os PAs sem tabela do Simples vigente)
                  items:
                    type: object
                    required: [pa, semaforo, fator_r]
                    properties:
                      pa: { $ref: "#/components/schemas/Competence" }
                      semaforo: { oneOf: [{ $ref: "#/components/schemas/FactorRLight" }, { type: "null" }] }
                      fator_r: { oneOf: [{ $ref: "#/components/schemas/DecimalString" }, { type: "null" }] }
            - type: "null"
        reconciliation:
          oneOf:
            - $ref: "#/components/schemas/ReconciliationOverviewCompany"
            - type: "null"
        attention:
          type: array
          description: As categorias do "Exige atenção" com itens, só da empresa
          items: { $ref: "#/components/schemas/AttentionCategory" }

    CompanyIndicatorList:
      type: object
      required: [competence, items]
      properties:
        competence: { $ref: "#/components/schemas/Competence" }
        items:
          type: array
          items:
            type: object
            required: [company_id, factor_r, reconciliation, overdue, credentials_expired]
            properties:
              company_id: { $ref: "#/components/schemas/Uuid" }
              factor_r:
                oneOf:
                  - type: object
                    required: [semaforo, acao]
                    properties:
                      semaforo: { oneOf: [{ $ref: "#/components/schemas/FactorRLight" }, { type: "null" }] }
                      acao: { $ref: "#/components/schemas/FactorRAction" }
                  - type: "null"
              reconciliation:
                oneOf:
                  - type: object
                    required: [state, blocks_accounting]
                    properties:
                      state: { type: string, enum: [em_andamento, pronta, concluida] }
                      blocks_accounting: { type: boolean }
                  - type: "null"
              overdue: { type: integer }
              credentials_expired: { type: integer }

    Attention:
      type: object
      required: [competence, categories]
      properties:
        competence: { $ref: "#/components/schemas/Competence" }
        categories: { type: array, items: { $ref: "#/components/schemas/AttentionCategory" } }

    HistoryPoint:
      type: object
      required: [competence, applicable, done, operational_progress, final_completion, overdue, pending]
      properties:
        competence: { $ref: "#/components/schemas/Competence" }
        applicable: { type: integer }
        done: { type: integer }
        operational_progress: { type: number }
        final_completion: { type: number }
        overdue: { type: integer, description: "Atrasadas em relação a hoje" }
        pending: { type: integer }

    DashboardHistory:
      type: object
      required: [current, previous, delta, series]
      properties:
        current: { $ref: "#/components/schemas/HistoryPoint" }
        previous:
          oneOf:
            - $ref: "#/components/schemas/HistoryPoint"
            - type: "null"
        delta:
          oneOf:
            - type: object
              required: [final_completion, operational_progress, overdue, pending]
              properties:
                final_completion: { type: number }
                operational_progress: { type: number }
                overdue: { type: integer }
                pending: { type: integer }
            - type: "null"
        series:
          type: array
          description: Até 6 competências geradas, da mais antiga à selecionada
          items: { $ref: "#/components/schemas/HistoryPoint" }

    BacklogItem:
      type: object
      required: [kind, instance_id, competence, company, module, obligation_type, status_code, status_label, due_date, days_overdue, responsible, drilldown]
      properties:
        kind: { type: string, enum: [OBLIGATION, MODULE], description: "MODULE = módulo aberto sem obrigação pendente" }
        instance_id: { type: [string, "null"], format: uuid }
        competence: { $ref: "#/components/schemas/Competence" }
        company:
          type: object
          required: [id, internal_code, legal_name, trade_name, cnpj]
          properties:
            id: { $ref: "#/components/schemas/Uuid" }
            internal_code: { type: string }
            legal_name: { type: string }
            trade_name: { type: [string, "null"] }
            cnpj: { $ref: "#/components/schemas/Cnpj" }
        module: { type: string }
        obligation_type:
          oneOf:
            - type: object
              required: [code, name]
              properties:
                code: { type: string }
                name: { type: string }
            - type: "null"
        status_code: { type: [string, "null"] }
        status_label: { type: string }
        due_date: { oneOf: [{ $ref: "#/components/schemas/Date" }, { type: "null" }] }
        days_overdue: { type: integer }
        responsible:
          oneOf:
            - $ref: "#/components/schemas/UserRef"
            - type: "null"
        drilldown: { $ref: "#/components/schemas/Drilldown" }

    Backlog:
      type: object
      required: [items, total, page, page_size]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/BacklogItem" } }
        total: { type: integer }
        page: { type: integer }
        page_size: { type: integer }

    CompanyHistory:
      type: object
      required: [company_id, competences]
      properties:
        company_id: { $ref: "#/components/schemas/Uuid" }
        competences:
          type: array
          description: Mais recente primeiro
          items:
            type: object
            required: [competence, tax_regime, modules]
            properties:
              competence: { $ref: "#/components/schemas/Competence" }
              tax_regime: { $ref: "#/components/schemas/TaxRegime" }
              modules:
                type: array
                items:
                  type: object
                  required: [module, period_id, state, closed_at, progress, events]
                  properties:
                    module: { type: string, enum: [FISCAL, DECLARATIONS, ACCOUNTING, PAYROLL] }
                    period_id: { $ref: "#/components/schemas/Uuid" }
                    state: { type: string, enum: [OPEN, CLOSED] }
                    closed_at: { type: [string, "null"], format: date-time }
                    progress: { $ref: "#/components/schemas/Progress" }
                    events:
                      type: array
                      items:
                        type: object
                        required: [event_type, reason, user_name, created_at]
                        properties:
                          event_type: { type: string, enum: [OPENED, CLOSED, REOPENED] }
                          reason: { type: [string, "null"] }
                          user_name: { type: string }
                          created_at: { type: string, format: date-time }

    UserRole:
      type: string
      enum: [ADMIN, MANAGER, OPERATOR, READ_ONLY]
      description: Perfil (preparado para permissões futuras).

    User:
      type: object
      required: [id, name, email, role, active, created_at, updated_at]
      properties:
        id: { $ref: "#/components/schemas/Uuid" }
        name: { type: string }
        email: { type: [string, "null"] }
        role: { $ref: "#/components/schemas/UserRole" }
        active: { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    UserList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/User" }

    UserCreate:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        name: { type: string, maxLength: 120 }
        email: { type: [string, "null"], maxLength: 200 }
        role: { $ref: "#/components/schemas/UserRole" }

    UserUpdate:
      type: object
      additionalProperties: false
      properties:
        name: { type: string, maxLength: 120 }
        email: { type: [string, "null"], maxLength: 200 }
        role: { $ref: "#/components/schemas/UserRole" }
        active: { type: boolean }

    ReconciliationDocumentStatus:
      type: string
      enum: [pendente, triado, extraido, importado, revisao_triagem, revisao_extracao, duplicado, pendencia_periodo_fechado]
      description: |
        Estados do Conciliador de origem (contrato congelado, D-020): pendente → triado → extraido →
        importado, com as revisões; pendencia_periodo_fechado é o documento tardio com o Contábil
        fechado na competência.

    ReconciliationDocumentKind:
      type: string
      enum: [extrato, comprovante, desconhecido]
      description: Tipo definido pela triagem (nulo até ela)

    ReconciliationUpload:
      type: object
      required: [document_id, job_id, status]
      properties:
        document_id: { $ref: "#/components/schemas/Uuid" }
        job_id: { type: [string, "null"], format: uuid, description: "Job de triagem; nulo no documento parado por período fechado" }
        status: { $ref: "#/components/schemas/ReconciliationDocumentStatus" }

    DocumentJobState:
      type: object
      description: Estado do job que processa o documento [AC-014]
      required: [id, status, attempts, max_attempts, last_error_code]
      properties:
        id: { $ref: "#/components/schemas/Uuid" }
        status: { $ref: "#/components/schemas/JobStatus" }
        attempts: { type: integer, format: int32 }
        max_attempts: { type: integer, format: int32 }
        last_error_code: { type: [string, "null"] }

    ReconciliationDocument:
      type: object
      required: [id, status, company_id, competence, file_name, content_type, size_bytes, sha256, object_version_id, kind, bank, branch, account, period_start, period_end, triage_confidence, triage_trace_id, diagnosis, job, file_url, uploaded_by, created_at, updated_at]
      properties:
        id: { $ref: "#/components/schemas/Uuid" }
        status: { $ref: "#/components/schemas/ReconciliationDocumentStatus" }
        company_id: { type: [string, "null"], format: uuid, description: "Informada no envio ou definida na triagem" }
        competence:
          description: Competência informada no envio
          oneOf: [{ $ref: "#/components/schemas/Competence" }, { type: "null" }]
        file_name: { type: string, description: "Nome enviado (só metadado)" }
        content_type: { type: string, description: "Tipo detectado pelo conteúdo", examples: ["application/pdf", "text/plain; charset=utf-8"] }
        size_bytes: { type: [integer, "null"], format: int64 }
        sha256: { type: string, pattern: "^[0-9a-f]{64}$", description: "Hash do original: chave no bucket e dedupe" }
        object_version_id: { type: [string, "null"], description: "Versão do objeto no bucket versionado" }
        kind:
          oneOf: [{ $ref: "#/components/schemas/ReconciliationDocumentKind" }, { type: "null" }]
        bank: { type: [string, "null"] }
        branch: { type: [string, "null"] }
        account: { type: [string, "null"] }
        period_start: { type: [string, "null"], format: date }
        period_end: { type: [string, "null"], format: date }
        triage_confidence:
          oneOf: [{ $ref: "#/components/schemas/DecimalString" }, { type: "null" }]
        triage_trace_id: { type: [string, "null"], description: "Corrida do triador que classificou o documento (nula nos caminhos determinísticos)" }
        diagnosis:
          description: |
            Diagnóstico do documento em revisão ou pendência: `motivo` (confianca_baixa,
            tipo_desconhecido, documento_ilegivel, agente_desligado, saida_invalida, saldo_nao_fecha,
            metadados_ausentes, csv_ilegivel, empresa_nao_identificada, conta_de_outra_empresa,
            periodo_fechado, campos_abaixo_limiar), os detalhes (no comprovante, `campos` a revisar
            e o `limiar`) e, quando houver, `validacao` (o ResultadoValidacao da origem).
          oneOf: [{ type: object, additionalProperties: true }, { type: "null" }]
        job:
          oneOf: [{ $ref: "#/components/schemas/DocumentJobState" }, { type: "null" }]
        file_url: { type: string, description: "Endpoint de leitura do original", examples: ["/api/v1/reconciliation/documents/{id}/file"] }
        uploaded_by: { type: [string, "null"], format: uuid }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    ReconciliationValidation:
      type: object
      description: |
        ResultadoValidacao da origem: o portão aritmético (tolerância R$ 0,00), o mesmo que a
        ferramenta validar_saldo responde ao extrator [REQ-021].
      required: [ok, soma_c, soma_d, saldo_calculado, saldo_esperado, diferenca, linhas_rejeitadas, lacunas_ordem, datas_fora_periodo]
      properties:
        ok: { type: boolean }
        soma_c: { $ref: "#/components/schemas/DecimalString" }
        soma_d: { $ref: "#/components/schemas/DecimalString" }
        saldo_calculado: { $ref: "#/components/schemas/DecimalString" }
        saldo_esperado: { $ref: "#/components/schemas/DecimalString" }
        diferenca: { $ref: "#/components/schemas/DecimalString" }
        linhas_rejeitadas:
          type: array
          items:
            type: object
            required: [ordem, motivo]
            properties:
              ordem: { type: integer }
              motivo: { type: string, enum: [valor_nao_positivo, sentido_invalido] }
        lacunas_ordem: { type: array, items: { type: integer } }
        datas_fora_periodo: { type: array, items: { type: integer } }

    ReconciliationStatementImport:
      type: object
      description: Importação do extrato (só existe com o portão aprovado) [AC-015]
      required: [id, company_id, bank_account_id, bank, branch, account, period_start, period_end, opening_balance, closing_balance, attempts, validation, transactions, trace_id, created_at]
      properties:
        id: { $ref: "#/components/schemas/Uuid" }
        company_id: { $ref: "#/components/schemas/Uuid" }
        bank_account_id: { type: [string, "null"], format: uuid, description: "Conta bancária cadastrada, se houver" }
        bank: { type: string }
        branch: { type: string }
        account: { type: string }
        period_start: { type: string, format: date }
        period_end: { type: string, format: date }
        opening_balance: { $ref: "#/components/schemas/DecimalString" }
        closing_balance: { $ref: "#/components/schemas/DecimalString" }
        attempts: { type: integer, minimum: 0, maximum: 3, description: "Tentativas do extrator; 0 = leitor determinístico" }
        validation: { $ref: "#/components/schemas/ReconciliationValidation" }
        transactions: { type: integer, format: int64, description: "Transações gravadas por esta importação (as repetidas ficam de fora)" }
        trace_id: { type: [string, "null"], description: "Corrida do extrator (nula no leitor determinístico)" }
        created_at: { type: string, format: date-time }

    ReconciliationExtractionAttempt:
      type: object
      description: |
        Linha do log de extração [CC-10]: tentativa do agente (triador, extrator, extrator_forte),
        leitura determinística (`leitor_local`, tentativa 0) ou intervenção humana (`humano`). A
        saída bruta não é exposta.
      required: [id, alias, attempt, model, prompt_version, validation, tokens_in, tokens_out, cost_usd, latency_ms, trace_id, job_id, actor_id, change, error, created_at]
      properties:
        id: { $ref: "#/components/schemas/Uuid" }
        alias: { type: string }
        attempt: { type: integer, minimum: 0, maximum: 3 }
        model: { type: [string, "null"], description: "Modelo informado pelo provedor" }
        prompt_version: { type: [string, "null"], description: "nome@versão#hash dos prompts enviados" }
        validation:
          description: O validador do extrato (portão) ou as regras de campo do comprovante
          oneOf:
            - { $ref: "#/components/schemas/ReconciliationValidation" }
            - { $ref: "#/components/schemas/ReconciliationReceiptCheck" }
            - { type: "null" }
        tokens_in: { type: [integer, "null"] }
        tokens_out: { type: [integer, "null"] }
        cost_usd:
          oneOf: [{ $ref: "#/components/schemas/DecimalString" }, { type: "null" }]
        latency_ms: { type: [integer, "null"] }
        trace_id: { type: [string, "null"] }
        job_id: { type: [string, "null"], format: uuid }
        actor_id: { type: [string, "null"], format: uuid }
        change: { type: [string, "null"], description: "O que a intervenção humana fez (JSON em texto)" }
        error: { type: [string, "null"], description: "Por que a tentativa foi perdida (saída fora do schema, leitor)" }
        created_at: { type: string, format: date-time }

    ReconciliationReceiptCheck:
      type: object
      description: |
        Regras de campo do comprovante (M3.4 da origem) numa tentativa: os campos essenciais
        (data, valor, sentido, contraparte) nulos, inválidos ou com confiança abaixo do limiar.
      required: [ok, campos_a_revisar, limiar]
      properties:
        ok: { type: boolean, description: "Nenhum campo a revisar" }
        campos_a_revisar: { type: array, items: { type: string, enum: [data, valor, sentido, contraparte] } }
        limiar: { $ref: "#/components/schemas/DecimalString" }

    ReconciliationDocumentDetail:
      description: |
        Documento com a importação do extrato ou o lançamento do comprovante e o histórico das
        tentativas (AC-014)
      allOf:
        - $ref: "#/components/schemas/ReconciliationDocument"
        - type: object
          required: [import, entry, attempts]
          properties:
            import:
              oneOf: [{ $ref: "#/components/schemas/ReconciliationStatementImport" }, { type: "null" }]
            entry:
              description: Lançamento lido do comprovante (um por documento)
              oneOf: [{ $ref: "#/components/schemas/ReconciliationClientEntry" }, { type: "null" }]
            attempts: { type: array, items: { $ref: "#/components/schemas/ReconciliationExtractionAttempt" } }

    ReconciliationEntryStatus:
      type: string
      enum: [pendente, parcial, extraido, manual]
      description: |
        parcial: comprovante com campo essencial a revisar (fora do razão, na fila); extraido:
        comprovante com os campos essenciais acima do limiar; manual: inserido à mão.

    ReconciliationFieldOrigin:
      type: object
      description: Onde o campo está no documento (OrigemCampo da origem), para a fila destacar
      required: [pagina, trecho, bbox]
      properties:
        pagina: { type: integer }
        trecho: { type: string }
        bbox:
          description: "[x0, y0, x1, y1] na página renderizada, ou null"
          oneOf: [{ type: array, items: { type: number } }, { type: "null" }]

    ReconciliationClientEntry:
      type: object
      description: Lançamento do cliente (lancamento_cliente da origem) [REQ-023, CC-12]
      required: [id, company_id, document_id, date, amount, direction, counterparty, counterparty_doc, document_ref, operation_type, status, field_confidence, field_origin, duplicate_flagged, flags, account_code, classification_origin, classification_pending, trace_id, created_by, created_at, updated_at]
      properties:
        id: { $ref: "#/components/schemas/Uuid" }
        company_id: { $ref: "#/components/schemas/Uuid" }
        document_id: { type: [string, "null"], format: uuid, description: "Comprovante de origem (nulo no manual)" }
        date: { type: [string, "null"], format: date }
        amount:
          oneOf: [{ $ref: "#/components/schemas/DecimalString" }, { type: "null" }]
        direction: { type: [string, "null"], enum: [C, D, null] }
        counterparty: { type: [string, "null"] }
        counterparty_doc: { type: [string, "null"], description: "CPF (11) ou CNPJ (14 dígitos)" }
        document_ref: { type: [string, "null"], description: "Nota fiscal, ID da transação, nosso número…" }
        operation_type: { type: [string, "null"], examples: [pix, boleto, ted] }
        status: { $ref: "#/components/schemas/ReconciliationEntryStatus" }
        field_confidence:
          type: object
          description: Confiança de cada campo lido (texto decimal)
          additionalProperties: { $ref: "#/components/schemas/DecimalString" }
        field_origin:
          type: object
          additionalProperties: { $ref: "#/components/schemas/ReconciliationFieldOrigin" }
        duplicate_flagged: { type: boolean, description: "Possível duplicata de leiaute diferente: sinalizada, nunca descartada" }
        flags:
          type: array
          description: "Marcas de borda: parcelado, juros, iss_retido e nf:<número> [REQ-030]"
          items: { type: string }
        account_code: { type: [string, "null"] }
        classification_origin: { type: [string, "null"], enum: [regra, historico, agente, manual, null] }
        classification_pending: { type: boolean }
        trace_id: { type: [string, "null"], description: "Corrida do extrator (nula no leitor determinístico e no manual)" }
        created_by: { type: [string, "null"], format: uuid }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    ReconciliationClientEntryList:
      type: object
      required: [items, total]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/ReconciliationClientEntry" } }
        total: { type: integer, format: int64, description: "Total com os filtros" }

    ReconciliationClientEntryCreate:
      type: object
      required: [company_id, date, amount, direction]
      properties:
        company_id: { $ref: "#/components/schemas/Uuid" }
        date: { type: string, format: date }
        amount: { type: string, description: "Positivo, até 2 casas (ponto ou vírgula decimal)", examples: ["1234.56"] }
        direction: { type: string, enum: [C, D] }
        counterparty: { type: [string, "null"], maxLength: 500 }
        counterparty_doc: { type: [string, "null"], description: "CPF ou CNPJ (11 ou 14 dígitos; pontuação é ignorada)" }
        document_ref: { type: [string, "null"], maxLength: 500 }

    ReconciliationEntriesImport:
      type: object
      required: [inserted, ids]
      properties:
        inserted: { type: integer }
        ids: { type: array, items: { $ref: "#/components/schemas/Uuid" } }

    ReconciliationRunSummary:
      type: object
      description: |
        Resultado da rodada do matching e os baldes da competência (PRD §8 da origem). As linhas
        livres marcadas levam em `flags` a divergência (`tipo` divergencia: o `motivo`, os
        `candidatos` e as linhas `concorrentes`) ou o caso de borda (`tipo` borda: o `motivo` e os
        `relacionados`).
      required: [company_id, competence, new_matches, by_pass, reconciled, divergent, without_receipt, without_statement, awaiting_review, resolver_requested, classification, classifier_requested]
      properties:
        company_id: { $ref: "#/components/schemas/Uuid" }
        competence: { $ref: "#/components/schemas/Competence" }
        new_matches: { type: integer, description: "Conciliações automáticas desta rodada" }
        by_pass:
          type: object
          description: "Conciliações desta rodada por passe (passe_1 a passe_4)"
          additionalProperties: { type: integer }
        reconciled: { type: integer, description: "Linhas da competência conciliadas (balde conciliado)" }
        divergent: { type: integer, description: "Linhas livres marcadas para a fila: divergência ou caso de borda" }
        without_receipt: { type: integer, description: "Linhas livres sem marca (extrato sem comprovante)" }
        without_statement: { type: integer, description: "Lançamentos livres da competência que passaram pelo automático sem linha (comprovante sem extrato)" }
        awaiting_review: { type: integer, description: "Lançamentos parciais da competência, fora do automático até a revisão" }
        resolver_requested:
          type: integer
          description: |
            Pedidos de hipótese que a rodada enfileirou para as linhas livres que nunca tiveram
            proposta nem pedido (RESOLVEDOR_AUTOMATICO; zero quando desligado). O resolvedor só
            sugere.
        classification:
          allOf: [{ $ref: "#/components/schemas/ClassificationRunSummary" }]
          description: Classificação das linhas conciliadas da competência (regra → histórico; TASK-020)
        classifier_requested:
          type: integer
          description: |
            Pedidos de sugestão de conta que a rodada enfileirou para as linhas à espera do agente
            que nunca tiveram sugestão nem pedido (CLASSIFICADOR_AUTOMATICO; zero quando desligado).

    ResolverPair:
      type: object
      description: |
        Par proposto pelo resolvedor (ParProposto da origem). Os IDs são os que o modelo devolveu:
        o aceite só concilia os da empresa ainda livres.
      required: [extrato_transacao_id, lancamento_cliente_ids, tipo, confianca]
      properties:
        extrato_transacao_id: { type: [string, "null"], description: "Linha do extrato (nula: a linha da proposta)" }
        lancamento_cliente_ids: { type: array, items: { type: string } }
        tipo:
          type: string
          description: "1:1, N:1, extrato_sem_comprovante, comprovante_sem_extrato, bruto_liquido, transferencia_interna, estorno ou outro"
        confianca: { type: string, description: "Decimal de 0 a 1 em texto, como o pydantic da origem o grava (ex. \"0.85\")" }

    ResolverHypothesis:
      type: object
      description: A hipótese do resolvedor (HipoteseResolvedor da origem), gravada como veio do modelo validado.
      required: [hipotese, justificativa, pares_propostos, confianca, pede_humano]
      properties:
        hipotese: { type: string }
        justificativa: { type: string }
        pares_propostos: { type: array, items: { $ref: "#/components/schemas/ResolverPair" } }
        confianca: { type: string, description: "Decimal de 0 a 1 em texto, como o pydantic da origem o grava (ex. \"0.85\")" }
        pede_humano: { type: boolean }

    ResolverProposal:
      type: object
      description: Proposta do resolvedor para uma linha do extrato; só o aceite humano concilia [AC-019].
      required: [id, company_id, statement_transaction_id, status, hypothesis, trace_id, created_by, created_at, decided_by, decided_at]
      properties:
        id: { $ref: "#/components/schemas/Uuid" }
        company_id: { $ref: "#/components/schemas/Uuid" }
        statement_transaction_id: { $ref: "#/components/schemas/Uuid" }
        status: { type: string, enum: [pendente, aceita, rejeitada] }
        hypothesis: { $ref: "#/components/schemas/ResolverHypothesis" }
        trace_id: { type: [string, "null"], description: "Corrida do resolvedor na auditoria de IA" }
        created_by: { type: [string, "null"], format: uuid, description: "Quem pediu (nulo no resolvedor automático)" }
        created_at: { type: string, format: date-time }
        decided_by: { type: [string, "null"], format: uuid }
        decided_at: { type: [string, "null"], format: date-time }

    ResolverProposalList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/ResolverProposal" } }

    ResolverProposalRequest:
      type: object
      required: [job_id, status, already_queued]
      properties:
        job_id: { $ref: "#/components/schemas/Uuid" }
        status: { $ref: "#/components/schemas/JobStatus" }
        already_queued: { type: boolean, description: "O pedido da linha já estava na fila (mesmo job)" }

    ResolverProposalDecision:
      type: object
      required: [proposal_id]
      additionalProperties: false
      properties:
        proposal_id: { $ref: "#/components/schemas/Uuid" }

    ResolverProposalAccept:
      type: object
      required: [proposal, reconciliation_ids]
      properties:
        proposal: { $ref: "#/components/schemas/ResolverProposal" }
        reconciliation_ids: { type: array, items: { $ref: "#/components/schemas/Uuid" } }

    ChartAccount:
      type: object
      description: Conta do plano de contas da empresa (plano_contas da origem).
      required: [id, company_id, code, name, active, created_at, updated_at]
      properties:
        id: { $ref: "#/components/schemas/Uuid" }
        company_id: { $ref: "#/components/schemas/Uuid" }
        code: { type: string, maxLength: 32 }
        name: { type: string, maxLength: 255 }
        active: { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    ChartAccountList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/ChartAccount" } }

    ChartAccountCreate:
      type: object
      required: [code, name]
      additionalProperties: false
      properties:
        code: { type: string, maxLength: 32, description: "Sem espaço nem ponto e vírgula" }
        name: { type: string, maxLength: 255 }

    ChartAccountPatch:
      type: object
      additionalProperties: false
      properties:
        name: { type: string, maxLength: 255 }
        active: { type: boolean }

    ChartAccountsImport:
      type: object
      required: [inserted, updated]
      properties:
        inserted: { type: integer, description: "Contas novas" }
        updated: { type: integer, description: "Contas que já existiam: nome do arquivo e reativadas" }

    ChartAccountsCopy:
      type: object
      required: [inserted, skipped]
      properties:
        inserted: { type: integer, description: "Contas copiadas da empresa padrão" }
        skipped: { type: integer, description: "Contas que a empresa já tinha" }

    ClassificationRuleType:
      type: string
      enum: [cnpj, contraparte, regex_descritivo]

    ClassificationRule:
      type: object
      description: Regra de classificação (regra_classificacao da origem); a mais nova vale.
      required: [id, company_id, rule_type, pattern, account_code, active, source_statement_transaction_id, created_by, created_at, deactivated_by, deactivated_at]
      properties:
        id: { $ref: "#/components/schemas/Uuid" }
        company_id: { $ref: "#/components/schemas/Uuid" }
        rule_type: { $ref: "#/components/schemas/ClassificationRuleType" }
        pattern: { type: string, description: "CNPJ só com os dígitos, contraparte ou regex do re do Python (IGNORECASE)" }
        account_code: { type: string }
        active: { type: boolean }
        source_statement_transaction_id: { type: [string, "null"], format: uuid, description: "Linha cuja correção originou a regra" }
        created_by: { type: [string, "null"], format: uuid }
        created_at: { type: string, format: date-time }
        deactivated_by: { type: [string, "null"], format: uuid }
        deactivated_at: { type: [string, "null"], format: date-time }

    ClassificationRuleList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/ClassificationRule" } }

    ClassificationRuleCreate:
      type: object
      required: [rule_type, pattern, account_code]
      additionalProperties: false
      properties:
        rule_type: { $ref: "#/components/schemas/ClassificationRuleType" }
        pattern: { type: string, maxLength: 512 }
        account_code: { type: string }
        source_statement_transaction_id: { type: [string, "null"], format: uuid }

    ClassificationRuleCreated:
      type: object
      required: [rule, replaced_rule_ids]
      properties:
        rule: { $ref: "#/components/schemas/ClassificationRule" }
        replaced_rule_ids: { type: array, items: { $ref: "#/components/schemas/Uuid" }, description: "Regras ativas de mesmo tipo e padrão, desativadas" }

    ClassificationRuleProposal:
      type: object
      description: Regra que o sistema propõe ao contador (M5.5); só vale confirmada em POST /companies/{id}/classification-rules.
      required: [rule_type, pattern, account_code, source_statement_transaction_id]
      properties:
        rule_type: { $ref: "#/components/schemas/ClassificationRuleType" }
        pattern: { type: string }
        account_code: { type: string }
        source_statement_transaction_id: { $ref: "#/components/schemas/Uuid" }

    ClassificationOrigin:
      type: string
      enum: [regra, historico, agente, manual]
      description: "agente com pending: à espera do agente ou do contador; agente sem pending: sugestão aceita"

    ClassificationRunSummary:
      type: object
      description: Classificação das linhas conciliadas da competência.
      required: [by_rule, by_history, pending]
      properties:
        by_rule: { type: integer }
        by_history: { type: integer }
        pending: { type: integer, description: "Linhas sem regra nem histórico, à espera do agente ou do contador" }

    LineClassification:
      type: object
      required: [statement_transaction_id, account_code, origin, pending, rule_id, history_line_id, suggestion_id, classified_by, classified_at]
      properties:
        statement_transaction_id: { $ref: "#/components/schemas/Uuid" }
        account_code: { type: [string, "null"] }
        origin:
          oneOf: [{ $ref: "#/components/schemas/ClassificationOrigin" }, { type: "null" }]
        pending: { type: boolean }
        rule_id: { type: [string, "null"], format: uuid }
        history_line_id: { type: [string, "null"], format: uuid, description: "Linha do histórico que classificou" }
        suggestion_id: { type: [string, "null"], format: uuid }
        classified_by: { type: [string, "null"], format: uuid }
        classified_at: { type: [string, "null"], format: date-time }

    ClassificationCorrection:
      type: object
      required: [classification, proposed_rule]
      properties:
        classification: { $ref: "#/components/schemas/LineClassification" }
        proposed_rule:
          oneOf: [{ $ref: "#/components/schemas/ClassificationRuleProposal" }, { type: "null" }]

    ClassifierSuggestionPayload:
      type: object
      description: A SugestaoClassificacao da origem, como o agente a devolveu (validada).
      required: [conta_codigo, conta_nome, justificativa, regra_sugerida, confianca]
      properties:
        conta_codigo: { type: [string, "null"] }
        conta_nome: { type: [string, "null"] }
        justificativa: { type: string }
        regra_sugerida: { type: [object, "null"], additionalProperties: true }
        confianca: { type: string, description: "Decimal de 0 a 1 em texto, como o pydantic da origem o grava" }

    ClassificationSuggestion:
      type: object
      description: Sugestão do agente classificador; só o aceite humano muda a conta da linha [AC-020].
      required: [id, company_id, statement_transaction_id, status, account_code, suggestion, trace_id, created_by, created_at, decided_by, decided_at]
      properties:
        id: { $ref: "#/components/schemas/Uuid" }
        company_id: { $ref: "#/components/schemas/Uuid" }
        statement_transaction_id: { $ref: "#/components/schemas/Uuid" }
        status: { type: string, enum: [pendente, aceita, rejeitada] }
        account_code: { type: [string, "null"], description: "A conta sugerida, só quando está no plano ativo" }
        suggestion: { $ref: "#/components/schemas/ClassifierSuggestionPayload" }
        trace_id: { type: [string, "null"] }
        created_by: { type: [string, "null"], format: uuid, description: "Quem pediu (nulo no classificador automático)" }
        created_at: { type: string, format: date-time }
        decided_by: { type: [string, "null"], format: uuid }
        decided_at: { type: [string, "null"], format: date-time }

    ClassificationSuggestionList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/ClassificationSuggestion" } }

    ClassificationSuggestionRequest:
      type: object
      required: [job_id, status, already_queued]
      properties:
        job_id: { $ref: "#/components/schemas/Uuid" }
        status: { $ref: "#/components/schemas/JobStatus" }
        already_queued: { type: boolean }

    ClassificationSuggestionDecision:
      type: object
      required: [suggestion_id]
      additionalProperties: false
      properties:
        suggestion_id: { $ref: "#/components/schemas/Uuid" }

    ClassificationSuggestionAccept:
      type: object
      required: [classification, suggestion, proposed_rule]
      properties:
        classification: { $ref: "#/components/schemas/LineClassification" }
        suggestion: { $ref: "#/components/schemas/ClassificationSuggestion" }
        proposed_rule:
          oneOf: [{ $ref: "#/components/schemas/ClassificationRuleProposal" }, { type: "null" }]

    LedgerLine:
      type: object
      description: Linha do razão (uma conciliação ativa), com os ids do drill-down.
      required: [date, competence, bank_account, account_code, account_name, classification_origin, classification_pending, history, counterparty, debit, credit, reconciliation_id, reconciliation_method, reconciliation_origin, statement_transaction_id, statement_document_id, entry_ids, receipt_document_ids]
      properties:
        date: { type: string, format: date }
        competence: { $ref: "#/components/schemas/Competence" }
        bank_account: { type: string, description: "Conta bancária de origem (banco agência/conta)" }
        account_code: { type: [string, "null"] }
        account_name: { type: [string, "null"] }
        classification_origin:
          oneOf: [{ $ref: "#/components/schemas/ClassificationOrigin" }, { type: "null" }]
        classification_pending: { type: boolean }
        history: { type: string, description: "Descritivo do extrato" }
        counterparty: { type: [string, "null"], description: "Contrapartes distintas dos comprovantes" }
        debit: { $ref: "#/components/schemas/DecimalString" }
        credit: { $ref: "#/components/schemas/DecimalString" }
        reconciliation_id: { $ref: "#/components/schemas/Uuid" }
        reconciliation_method: { type: string }
        reconciliation_origin: { type: string, enum: [auto, manual] }
        statement_transaction_id: { $ref: "#/components/schemas/Uuid" }
        statement_document_id: { $ref: "#/components/schemas/Uuid" }
        entry_ids: { type: array, items: { $ref: "#/components/schemas/Uuid" } }
        receipt_document_ids: { type: array, items: { $ref: "#/components/schemas/Uuid" } }

    Ledger:
      type: object
      required: [company_id, from, to, items, total_debit, total_credit]
      properties:
        company_id: { $ref: "#/components/schemas/Uuid" }
        from: { $ref: "#/components/schemas/Competence" }
        to: { $ref: "#/components/schemas/Competence" }
        items: { type: array, items: { $ref: "#/components/schemas/LedgerLine" } }
        total_debit: { $ref: "#/components/schemas/DecimalString" }
        total_credit: { $ref: "#/components/schemas/DecimalString" }

    ReconciliationDetail:
      type: object
      description: Conciliação no drill-down do razão (AC-021).
      required: [id, company_id, method, origin, pass, score, proposal_id, created_by, created_at, undone_at, statement_transaction, entries, classification]
      properties:
        id: { $ref: "#/components/schemas/Uuid" }
        company_id: { $ref: "#/components/schemas/Uuid" }
        method: { type: string }
        origin: { type: string, enum: [auto, manual] }
        pass: { type: [integer, "null"] }
        score:
          oneOf: [{ $ref: "#/components/schemas/DecimalString" }, { type: "null" }]
        proposal_id: { type: [string, "null"], format: uuid }
        created_by: { type: [string, "null"], format: uuid }
        created_at: { type: string, format: date-time }
        undone_at: { type: [string, "null"], format: date-time }
        statement_transaction:
          type: object
          required: [id, date, competence, description, amount, direction, bank_account, statement_import_id, statement_document_id]
          properties:
            id: { $ref: "#/components/schemas/Uuid" }
            date: { type: string, format: date }
            competence: { $ref: "#/components/schemas/Competence" }
            description: { type: string }
            amount: { $ref: "#/components/schemas/DecimalString" }
            direction: { type: string, enum: [C, D] }
            bank_account: { type: string }
            statement_import_id: { $ref: "#/components/schemas/Uuid" }
            statement_document_id: { $ref: "#/components/schemas/Uuid" }
        entries:
          type: array
          items:
            type: object
            required: [id, date, amount, direction, counterparty, counterparty_doc, document_ref, status, document_id]
            properties:
              id: { $ref: "#/components/schemas/Uuid" }
              date: { type: [string, "null"], format: date }
              amount:
                oneOf: [{ $ref: "#/components/schemas/DecimalString" }, { type: "null" }]
              direction: { type: [string, "null"], enum: [C, D, null] }
              counterparty: { type: [string, "null"] }
              counterparty_doc: { type: [string, "null"] }
              document_ref: { type: [string, "null"] }
              status: { $ref: "#/components/schemas/ReconciliationEntryStatus" }
              document_id: { type: [string, "null"], format: uuid, description: "Original do comprovante" }
        classification:
          type: object
          required: [account_code, account_name, origin, pending, rule, history_line_id, suggestion_id, classified_by, classified_at]
          properties:
            account_code: { type: [string, "null"] }
            account_name: { type: [string, "null"] }
            origin:
              oneOf: [{ $ref: "#/components/schemas/ClassificationOrigin" }, { type: "null" }]
            pending: { type: boolean }
            rule:
              oneOf:
                - type: object
                  required: [id, rule_type, pattern]
                  properties:
                    id: { $ref: "#/components/schemas/Uuid" }
                    rule_type: { $ref: "#/components/schemas/ClassificationRuleType" }
                    pattern: { type: string }
                - { type: "null" }
            history_line_id: { type: [string, "null"], format: uuid }
            suggestion_id: { type: [string, "null"], format: uuid }
            classified_by: { type: [string, "null"], format: uuid }
            classified_at: { type: [string, "null"], format: date-time }

    ReviewBucket:
      type: string
      enum: [revisao, divergencia, extrato_sem, comprovante_sem, classificacao]
      description: |
        revisao: documento em revisão (triagem, extração, período fechado) ou comprovante parcial;
        divergencia: linha livre com divergência, caso de borda ou conciliação desfeita;
        extrato_sem: linha livre sem marca; comprovante_sem: comprovante completo sem extrato;
        classificacao: linha conciliada à espera da classificação.

    ReviewQueueItem:
      type: object
      required: [kind, id, bucket, company_id, company_code, company_name, state, date, amount, direction, summary, reason, competence]
      properties:
        kind: { type: string, enum: [linha, comprovante, documento] }
        id: { $ref: "#/components/schemas/Uuid" }
        bucket: { $ref: "#/components/schemas/ReviewBucket" }
        company_id: { type: [string, "null"], format: uuid }
        company_code: { type: [string, "null"] }
        company_name: { type: [string, "null"] }
        state: { type: string, description: "Estado do documento, status do lançamento ou tipo da marca da linha" }
        date: { type: [string, "null"], format: date }
        amount:
          oneOf: [{ $ref: "#/components/schemas/DecimalString" }, { type: "null" }]
        direction: { type: [string, "null"], enum: [C, D, null] }
        summary: { type: string, description: "Descritivo, contraparte ou nome do arquivo" }
        reason: { type: [string, "null"], description: "Código do motivo (a tela mostra o texto)" }
        competence:
          oneOf: [{ $ref: "#/components/schemas/Competence" }, { type: "null" }]

    ReviewQueue:
      type: object
      required: [items, counts]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/ReviewQueueItem" } }
        counts: { type: object, additionalProperties: { type: integer }, description: "Por balde e o total (total)" }

    ReconciliationMatching:
      type: object
      description: |
        Conciliação das linhas do extrato: o percentual automático da origem (automáticas ÷ linhas,
        uma casa) contra a meta (`META_CONCILIACAO_AUTO`) e as conciliações ativas por método.
      required: [lines, reconciled, auto, manual, free, auto_percent, target_percent, by_method, undone_auto]
      properties:
        lines: { type: integer, description: "Linhas do extrato" }
        reconciled: { type: integer, description: "Linhas com conciliação ativa" }
        auto: { type: integer }
        manual: { type: integer, description: "À mão, sem comprovante e aceite do resolvedor" }
        free: { type: integer }
        auto_percent:
          oneOf: [{ $ref: "#/components/schemas/DecimalString" }, { type: "null" }]
        target_percent: { $ref: "#/components/schemas/DecimalString" }
        by_method:
          type: object
          description: "Conciliações ativas por método: passe_1 a passe_4, manual, sem_comprovante e resolvedor"
          additionalProperties: { type: integer }
        undone_auto: { type: integer, description: "Conciliações automáticas desfeitas" }

    ReconciliationExtraction:
      type: object
      description: |
        Leitura dos documentos de um tipo, como o `make eval-extrator` (D-027): as tentativas são as
        do agente; aprovado é o extrato importado ou o comprovante completo sem campo corrigido à
        mão; o leitor determinístico fica à parte; o custo soma todas as chamadas de modelo do
        documento (triagem e extração), em dólares.
      required: [documents, local_reader, agent, first_attempt, first_attempt_percent, average_attempts, not_approved, cost_usd, cost_per_document_usd]
      properties:
        documents: { type: integer, description: "Documentos lidos, pelo leitor ou pelo agente" }
        local_reader: { type: integer, description: "Lidos pelo leitor determinístico, sem agente" }
        agent: { type: integer, description: "Lidos pelo agente" }
        first_attempt: { type: integer, description: "Aprovados na 1ª tentativa do agente" }
        first_attempt_percent:
          oneOf: [{ $ref: "#/components/schemas/DecimalString" }, { type: "null" }]
        average_attempts:
          oneOf: [{ $ref: "#/components/schemas/DecimalString" }, { type: "null" }]
        not_approved: { type: integer, description: "Lidos pelo agente e não aprovados" }
        cost_usd: { $ref: "#/components/schemas/DecimalString" }
        cost_per_document_usd:
          oneOf: [{ $ref: "#/components/schemas/DecimalString" }, { type: "null" }]

    ReconciliationAgentCost:
      type: object
      description: Corridas de um agente que só sugere e o custo por item (M4.7 da origem)
      required: [runs, cost_usd, cost_per_run_usd]
      properties:
        runs: { type: integer }
        cost_usd: { $ref: "#/components/schemas/DecimalString" }
        cost_per_run_usd:
          oneOf: [{ $ref: "#/components/schemas/DecimalString" }, { type: "null" }]

    ReconciliationMetrics:
      type: object
      description: Painel de métricas da Conciliação (11-observability §7)
      required: [company_id, competence, matching, buckets, extraction, corrections, after_close, agents, playbooks]
      properties:
        company_id: { type: [string, "null"], format: uuid }
        competence:
          oneOf: [{ $ref: "#/components/schemas/Competence" }, { type: "null" }]
        matching: { $ref: "#/components/schemas/ReconciliationMatching" }
        buckets:
          type: object
          description: "Itens da fila por balde e o total (total), a mesma contagem da fila"
          additionalProperties: { type: integer }
        extraction:
          type: object
          required: [statements, receipts]
          properties:
            statements: { $ref: "#/components/schemas/ReconciliationExtraction" }
            receipts: { $ref: "#/components/schemas/ReconciliationExtraction" }
        corrections:
          type: object
          description: Correções humanas depois da leitura (campo do comprovante e "que documento é esse?")
          required: [actions, documents, rate_percent]
          properties:
            actions: { type: integer }
            documents: { type: integer, description: "Documentos corrigidos" }
            rate_percent:
              description: "Documentos corrigidos ÷ documentos lidos"
              oneOf: [{ $ref: "#/components/schemas/DecimalString" }, { type: "null" }]
        after_close:
          type: object
          description: |
            Erro achado depois do fechamento (meta zero; D-034): as reaberturas do Contábil (sempre
            com motivo) nas competências com a Conciliação e, à parte, os documentos que chegaram
            com a competência fechada.
          required: [reopenings, late_documents]
          properties:
            reopenings: { type: integer }
            late_documents: { type: integer }
        agents:
          type: object
          required: [resolver, classifier]
          properties:
            resolver: { $ref: "#/components/schemas/ReconciliationAgentCost" }
            classifier: { $ref: "#/components/schemas/ReconciliationAgentCost" }
        playbooks:
          type: array
          description: Sucesso dos playbooks de cada banco, somando as versões (não depende dos filtros)
          items:
            type: object
            required: [bank, versions, valid_version, successes, failures, success_percent]
            properties:
              bank: { type: string }
              versions: { type: integer }
              valid_version: { type: [integer, "null"] }
              successes: { type: integer }
              failures: { type: integer }
              success_percent:
                oneOf: [{ $ref: "#/components/schemas/DecimalString" }, { type: "null" }]

    BankPlaybook:
      type: object
      description: Versão do playbook de um banco (playbook_banco da origem; schema congelado, D-020)
      required: [id, bank, version, valid, successes, failures, success_percent, table_start_page, ignored_pages, date_format, decimal_separator, sign_representation, balance_location, winning_strategy, validated_at, created_at, updated_at]
      properties:
        id: { $ref: "#/components/schemas/Uuid" }
        bank: { type: string }
        version: { type: integer }
        valid: { type: boolean }
        successes: { type: integer }
        failures: { type: integer }
        success_percent:
          oneOf: [{ $ref: "#/components/schemas/DecimalString" }, { type: "null" }]
        table_start_page: { type: integer }
        ignored_pages: { type: array, items: { type: integer } }
        date_format: { type: string }
        decimal_separator: { type: string }
        sign_representation: { type: string }
        balance_location: { type: string }
        winning_strategy: { type: string }
        validated_at: { type: [string, "null"], format: date-time }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    BankPlaybookList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/BankPlaybook" } }

    ReconciliationCompletionRecord:
      type: object
      description: Uma conclusão da conciliação, com a reabertura quando houver
      required: [id, completed_by, completed_at, obligation_status_before, obligation_sync, reopened_by, reopened_at, reopen_reason, reopen_obligation_sync]
      properties:
        id: { $ref: "#/components/schemas/Uuid" }
        completed_by: { type: string, description: "Nome de quem concluiu" }
        completed_at: { type: string, format: date-time }
        obligation_status_before: { type: [string, "null"], description: "Status da obrigação antes da conclusão" }
        obligation_sync:
          type: string
          enum: [concluida, ja_final, nao_aplicavel, sem_obrigacao]
          description: "concluida: a obrigação foi para OK; ja_final: já era final; nao_aplicavel; sem_obrigacao"
        reopened_by: { type: [string, "null"], description: "Nome de quem reabriu" }
        reopened_at: { type: [string, "null"], format: date-time }
        reopen_reason: { type: [string, "null"] }
        reopen_obligation_sync:
          type: [string, "null"]
          enum: [pendente, mantida, nao_aplicavel, sem_obrigacao, null]
          description: "pendente: a obrigação voltou para Pendente; mantida: alguém mudou depois, ou já era final"

    ReconciliationCompletion:
      type: object
      description: |
        A conclusão da conciliação da empresa na competência (F-008; D-036): em andamento, pronta
        (o extrato todo resolvido) ou concluída, o que ainda impede, o aviso, a obrigação Conciliação
        do Contábil e o histórico das conclusões.
      required: [state, ready, blocking, warnings, obligation, current, history]
      properties:
        state: { type: string, enum: [em_andamento, pronta, concluida] }
        ready: { type: boolean }
        blocking:
          type: object
          required: [missing_statement, divergent, without_receipt, review, classification]
          properties:
            missing_statement: { type: boolean, description: "Nenhum extrato importado cobre a competência" }
            divergent: { type: integer, description: "Linhas livres marcadas (divergência, borda ou desfeita)" }
            without_receipt: { type: integer, description: "Linhas livres sem marca (extrato sem comprovante)" }
            review: { type: integer, description: "Documentos e comprovantes parciais em revisão" }
            classification: { type: integer, description: "Linhas conciliadas à espera da conta" }
        warnings:
          type: object
          required: [without_statement]
          properties:
            without_statement: { type: integer, description: "Comprovantes sem linha do extrato (não impedem)" }
        obligation:
          description: A obrigação Conciliação do Contábil na competência (nula se não foi gerada)
          oneOf:
            - type: object
              required: [instance_id, status_code, status_label, is_final, applicable]
              properties:
                instance_id: { $ref: "#/components/schemas/Uuid" }
                status_code: { type: string }
                status_label: { type: string }
                is_final: { type: boolean }
                applicable: { type: boolean }
            - { type: "null" }
        current:
          description: A conclusão em vigor (nula se não está concluída)
          oneOf: [{ $ref: "#/components/schemas/ReconciliationCompletionRecord" }, { type: "null" }]
        history:
          type: array
          description: As conclusões, da mais recente para a mais antiga
          items: { $ref: "#/components/schemas/ReconciliationCompletionRecord" }

    ReconciliationClosure:
      type: object
      description: O fechamento do Contábil visto pela Conciliação (06 §5; D-037)
      required: [company_id, competence, period, events, requires_reconciliation]
      properties:
        company_id: { $ref: "#/components/schemas/Uuid" }
        competence: { $ref: "#/components/schemas/Competence" }
        period:
          description: O período do Contábil da empresa na competência (nulo se não foi gerado)
          oneOf: [{ $ref: "#/components/schemas/CompanyModulePeriod" }, { type: "null" }]
        events:
          type: array
          description: Abertura, fechamento e reabertura, do mais recente para o mais antigo
          items: { $ref: "#/components/schemas/CompanyModulePeriodEvent" }
        requires_reconciliation:
          type: boolean
          description: >-
            Fechar o Contábil exige a obrigação Conciliação final: a empresa usa a Conciliação na
            competência (extrato que a cobre ou documento dela) e a obrigação existe e se aplica

    CompanyReconciliationSummary:
      type: object
      description: A Conciliação da empresa na competência (a aba da ficha)
      required: [company_id, competence, accounting_closed, statements, matching, buckets, entries, classification, completion]
      properties:
        company_id: { $ref: "#/components/schemas/Uuid" }
        competence: { $ref: "#/components/schemas/Competence" }
        accounting_closed: { type: boolean, description: "Contábil fechado: a Conciliação da competência está travada" }
        statements:
          type: array
          items:
            type: object
            required: [import_id, document_id, file_name, bank_account, period_start, period_end, opening_balance, closing_balance, attempts, transactions]
            properties:
              import_id: { $ref: "#/components/schemas/Uuid" }
              document_id: { $ref: "#/components/schemas/Uuid" }
              file_name: { type: string }
              bank_account: { type: string, description: "Banco agência/conta" }
              period_start: { type: string, format: date }
              period_end: { type: string, format: date }
              opening_balance: { $ref: "#/components/schemas/DecimalString" }
              closing_balance: { $ref: "#/components/schemas/DecimalString" }
              attempts: { type: integer, description: "Tentativas do extrator (0: leitor determinístico)" }
              transactions: { type: integer }
        matching: { $ref: "#/components/schemas/ReconciliationMatching" }
        buckets:
          type: object
          additionalProperties: { type: integer }
        entries:
          type: object
          required: [total, partial]
          properties:
            total: { type: integer }
            partial: { type: integer }
        classification:
          type: object
          required: [classified, pending]
          properties:
            classified: { type: integer, description: "Linhas conciliadas com a conta confirmada" }
            pending: { type: integer, description: "Linhas conciliadas à espera da conta" }
        completion: { $ref: "#/components/schemas/ReconciliationCompletion" }

    BankAccount:
      type: object
      description: Conta bancária cadastrada da empresa (conta_bancaria da origem; CC-11)
      required: [id, company_id, bank, branch, account, label, active, statements, last_period_end, created_by, created_at]
      properties:
        id: { $ref: "#/components/schemas/Uuid" }
        company_id: { $ref: "#/components/schemas/Uuid" }
        bank: { type: string }
        branch: { type: string }
        account: { type: string }
        label: { type: string, description: "Banco agência/conta, como no razão" }
        active: { type: boolean }
        statements: { type: integer, description: "Extratos já importados da conta pela empresa" }
        last_period_end: { type: [string, "null"], format: date }
        created_by: { type: [string, "null"], format: uuid }
        created_at: { type: string, format: date-time }

    BankAccountList:
      type: object
      required: [items, read]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/BankAccount" } }
        read:
          type: array
          description: Contas lidas nos extratos importados da empresa que ninguém cadastrou
          items:
            type: object
            required: [bank, branch, account, label, statements, last_period_end]
            properties:
              bank: { type: string }
              branch: { type: string }
              account: { type: string }
              label: { type: string }
              statements: { type: integer }
              last_period_end: { type: string, format: date }

    BankAccountCreate:
      type: object
      required: [bank, branch, account]
      additionalProperties: false
      properties:
        bank: { type: string, maxLength: 64 }
        branch: { type: string, maxLength: 16 }
        account: { type: string, maxLength: 32 }

    ReviewLine:
      type: object
      required: [id, company_id, company_code, company_name, date, competence, description, document_ref, amount, direction, balance_after, bank_account, statement_import_id, statement_document_id, marks, account_code, classification_origin, classification_pending]
      properties:
        id: { $ref: "#/components/schemas/Uuid" }
        company_id: { $ref: "#/components/schemas/Uuid" }
        company_code: { type: string }
        company_name: { type: string }
        date: { type: string, format: date }
        competence: { $ref: "#/components/schemas/Competence" }
        description: { type: string }
        document_ref: { type: [string, "null"] }
        amount: { $ref: "#/components/schemas/DecimalString" }
        direction: { type: string, enum: [C, D] }
        balance_after:
          oneOf: [{ $ref: "#/components/schemas/DecimalString" }, { type: "null" }]
        bank_account: { type: string }
        statement_import_id: { $ref: "#/components/schemas/Uuid" }
        statement_document_id: { $ref: "#/components/schemas/Uuid" }
        marks: { type: array, items: {}, description: "Marcas da linha: divergência, borda, desfeita (objetos com tipo e motivo)" }
        account_code: { type: [string, "null"] }
        classification_origin:
          oneOf: [{ $ref: "#/components/schemas/ClassificationOrigin" }, { type: "null" }]
        classification_pending: { type: boolean }

    ReviewEntry:
      type: object
      required: [id, date, amount, direction, counterparty, counterparty_doc, document_ref, status, document_id]
      properties:
        id: { $ref: "#/components/schemas/Uuid" }
        date: { type: [string, "null"], format: date }
        amount:
          oneOf: [{ $ref: "#/components/schemas/DecimalString" }, { type: "null" }]
        direction: { type: [string, "null"], enum: [C, D, null] }
        counterparty: { type: [string, "null"] }
        counterparty_doc: { type: [string, "null"] }
        document_ref: { type: [string, "null"] }
        status: { $ref: "#/components/schemas/ReconciliationEntryStatus" }
        document_id: { type: [string, "null"], format: uuid }

    ReviewCandidate:
      allOf:
        - { $ref: "#/components/schemas/ReviewEntry" }
        - type: object
          required: [operation_type, days_apart, annotated]
          properties:
            operation_type: { type: [string, "null"] }
            days_apart: { type: [integer, "null"], description: "Dias até a linha (nulo sem data)" }
            annotated: { type: boolean, description: "Anotado pelo matching na divergência" }

    ReviewLineDetail:
      type: object
      required: [line, reconciliation, candidates]
      properties:
        line: { $ref: "#/components/schemas/ReviewLine" }
        reconciliation:
          oneOf:
            - type: object
              required: [id, method, origin, pass, created_by, created_at, entries, entries_total]
              properties:
                id: { $ref: "#/components/schemas/Uuid" }
                method: { type: string }
                origin: { type: string, enum: [auto, manual] }
                pass: { type: [integer, "null"] }
                created_by: { type: [string, "null"], format: uuid }
                created_at: { type: string, format: date-time }
                entries: { type: array, items: { $ref: "#/components/schemas/ReviewEntry" } }
                entries_total: { $ref: "#/components/schemas/DecimalString" }
            - { type: "null" }
        candidates: { type: array, items: { $ref: "#/components/schemas/ReviewCandidate" } }

    ManualMatchResult:
      type: object
      required: [reconciliation_id, method, entries_total, difference, classification]
      properties:
        reconciliation_id: { $ref: "#/components/schemas/Uuid" }
        method: { type: string, enum: [manual, sem_comprovante] }
        entries_total: { $ref: "#/components/schemas/DecimalString" }
        difference: { $ref: "#/components/schemas/DecimalString", description: "Valor da linha menos a soma dos lançamentos" }
        classification: { type: string, description: "Origem da classificação aplicada (regra, historico, agente) ou vazio" }

    ReviewLineCandidate:
      type: object
      required: [id, date, amount, direction, description, bank_account, days_apart]
      properties:
        id: { $ref: "#/components/schemas/Uuid" }
        date: { type: string, format: date }
        amount: { $ref: "#/components/schemas/DecimalString" }
        direction: { type: string, enum: [C, D] }
        description: { type: string }
        bank_account: { type: string }
        days_apart: { type: integer }

    ReviewEntryDetail:
      type: object
      required: [entry, reconciliation_id, statement_transaction_id, candidates]
      properties:
        entry: { $ref: "#/components/schemas/ReconciliationClientEntry" }
        reconciliation_id: { type: [string, "null"], format: uuid }
        statement_transaction_id: { type: [string, "null"], format: uuid }
        candidates: { type: array, items: { $ref: "#/components/schemas/ReviewLineCandidate" } }

    EntryFieldsPatch:
      type: object
      additionalProperties: false
      description: Só os campos enviados mudam; texto vazio limpa o opcional.
      properties:
        date: { type: string, format: date }
        amount: { type: string, description: "Positivo, até 2 casas (ponto ou vírgula)" }
        direction: { type: string, enum: [C, D] }
        counterparty: { type: string }
        counterparty_doc: { type: string, description: "CPF ou CNPJ (11 ou 14 dígitos)" }
        document_ref: { type: string }

    EntryCorrection:
      type: object
      required: [entry, round]
      properties:
        entry: { $ref: "#/components/schemas/ReconciliationClientEntry" }
        round:
          oneOf: [{ $ref: "#/components/schemas/ReconciliationRunSummary" }, { type: "null" }]

    RecentReconciliation:
      type: object
      required: [id, company_id, company_code, method, origin, pass, created_by, created_at, statement_transaction_id, date, amount, direction, description]
      properties:
        id: { $ref: "#/components/schemas/Uuid" }
        company_id: { $ref: "#/components/schemas/Uuid" }
        company_code: { type: string }
        method: { type: string }
        origin: { type: string, enum: [auto, manual] }
        pass: { type: [integer, "null"] }
        created_by: { type: [string, "null"], format: uuid }
        created_at: { type: string, format: date-time }
        statement_transaction_id: { $ref: "#/components/schemas/Uuid" }
        date: { type: string, format: date }
        amount: { $ref: "#/components/schemas/DecimalString" }
        direction: { type: string, enum: [C, D] }
        description: { type: string }

    RecentReconciliationList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/RecentReconciliation" } }

    DocumentIdentify:
      type: object
      required: [kind, company_id]
      additionalProperties: false
      properties:
        kind: { type: string, enum: [extrato, comprovante] }
        company_id: { $ref: "#/components/schemas/Uuid" }
        bank: { type: [string, "null"], maxLength: 64 }
        branch: { type: [string, "null"], maxLength: 64 }
        account: { type: [string, "null"], maxLength: 64 }
        period_start: { type: [string, "null"], format: date }
        period_end: { type: [string, "null"], format: date }

    ReconciliationDocumentList:
      type: object
      required: [items, total, count_by_status]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/ReconciliationDocument" } }
        total: { type: integer, format: int64, description: "Total com os filtros" }
        count_by_status: { type: object, additionalProperties: { type: integer, format: int64 } }

    JobStatus:
      type: string
      enum: [pending, running, retry, done, dead]
      description: |
        pending: na fila; running: em execução por um worker; retry: nova tentativa agendada
        (run_after); done: concluído; dead: encerrado sem sucesso (tentativas esgotadas ou falha
        permanente).

    Job:
      type: object
      required: [id, kind, status, attempts, max_attempts, run_after, locked_at, locked_by, last_error_code, last_error_message, finished_at, retried_at, created_at, updated_at, worker_online]
      properties:
        id: { $ref: "#/components/schemas/Uuid" }
        kind: { type: string, examples: ["pgdas_parse"] }
        status: { $ref: "#/components/schemas/JobStatus" }
        attempts: { type: integer, format: int32, minimum: 0, description: "Tentativas iniciadas" }
        max_attempts: { type: integer, format: int32, minimum: 1 }
        run_after: { type: string, format: date-time, description: "Quando o job pode ser executado (backoff entre tentativas)" }
        locked_at: { type: [string, "null"], format: date-time }
        locked_by: { type: [string, "null"], description: "Worker que tem a posse do job" }
        last_error_code: { type: [string, "null"], examples: ["WORKER_LOST"] }
        last_error_message: { type: [string, "null"], description: "Mensagem sanitizada (sem chaves nem tokens), até 300 caracteres" }
        finished_at: { type: [string, "null"], format: date-time }
        retried_at: { type: [string, "null"], format: date-time, description: "Último reenvio manual" }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        worker_online: { type: boolean, description: "Algum worker deu sinal recente" }

    DecimalString:
      type: string
      description: |
        Número decimal exato, como string em notação de ponto fixo (nunca float) [06 §12]. A
        quantidade de casas é a do cálculo (ex.: `43740.00000000`); a interface arredonda só
        para exibir.
      pattern: "^-?[0-9]+(\\.[0-9]+)?$"
      examples: ["43740.00000000", "0.2799"]

    MoneyInput:
      type: string
      description: Valor em reais não negativo, com até 12 dígitos inteiros e 2 casas decimais.
      examples: ["1234.56"]

    FactorRPackage:
      type: string
      enum: [monitoramento, correcao, retainer]
      description: Pacote comercial da carteira (null = sem pacote).

    FactorRSettings:
      type: object
      required: [company_id, cnae, atividade, quantidade_socios, contato, pacote_comercial, honorario_mensal, inicio_atividade, notas, version, updated_at]
      properties:
        company_id: { $ref: "#/components/schemas/Uuid" }
        cnae: { type: [string, "null"] }
        atividade: { type: [string, "null"] }
        quantidade_socios: { type: integer, format: int32, minimum: 0, maximum: 1000 }
        contato: { type: [string, "null"] }
        pacote_comercial: { oneOf: [{ $ref: "#/components/schemas/FactorRPackage" }, { type: "null" }] }
        honorario_mensal: { $ref: "#/components/schemas/DecimalString" }
        inicio_atividade:
          description: Mês de início da atividade da empresa (não é o início do atendimento)
          oneOf: [{ $ref: "#/components/schemas/Competence" }, { type: "null" }]
        notas: { type: [string, "null"] }
        version: { type: integer, format: int32, minimum: 0, description: "0 = ainda sem configuração gravada" }
        updated_at: { type: [string, "null"], format: date-time }

    FactorRSettingsUpdate:
      type: object
      additionalProperties: false
      required: [version]
      properties:
        version: { type: integer, format: int32, minimum: 0 }
        cnae: { type: [string, "null"], maxLength: 20 }
        atividade: { type: [string, "null"], maxLength: 500 }
        quantidade_socios: { type: integer, format: int32, minimum: 0, maximum: 1000 }
        contato: { type: [string, "null"], maxLength: 500 }
        pacote_comercial: { oneOf: [{ $ref: "#/components/schemas/FactorRPackage" }, { type: "null" }] }
        honorario_mensal: { $ref: "#/components/schemas/MoneyInput" }
        inicio_atividade: { oneOf: [{ $ref: "#/components/schemas/Competence" }, { type: "null" }] }
        notas: { type: [string, "null"], maxLength: 5000 }

    FactorRMovementOrigin:
      type: string
      enum: [manual, pgdas, folha, agente]

    FactorRMovement:
      type: object
      required: [competence, receita_bruta, pro_labore, salarios_13_ferias, cpp_recolhida, fgts_recolhido, folha_total_declarada_pgdas, folha_mes, origem, observacao, pgdas_document_id, version, updated_at]
      properties:
        competence: { $ref: "#/components/schemas/Competence" }
        receita_bruta: { $ref: "#/components/schemas/DecimalString" }
        pro_labore: { $ref: "#/components/schemas/DecimalString" }
        salarios_13_ferias: { $ref: "#/components/schemas/DecimalString" }
        cpp_recolhida: { $ref: "#/components/schemas/DecimalString" }
        fgts_recolhido: { $ref: "#/components/schemas/DecimalString" }
        folha_total_declarada_pgdas:
          description: Folha total declarada no PGDAS-D, sem divisão (só em mês de origem pgdas)
          oneOf: [{ $ref: "#/components/schemas/DecimalString" }, { type: "null" }]
        folha_mes:
          description: Folha do mês — a total declarada ou pró-labore + salários + CPP + FGTS
          allOf: [{ $ref: "#/components/schemas/DecimalString" }]
        origem: { $ref: "#/components/schemas/FactorRMovementOrigin" }
        observacao: { type: [string, "null"] }
        pgdas_document_id: { oneOf: [{ $ref: "#/components/schemas/Uuid" }, { type: "null" }] }
        version: { type: integer, format: int32, minimum: 1 }
        updated_at: { type: string, format: date-time }

    FactorRMovementList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/FactorRMovement" } }

    FactorRMovementInput:
      type: object
      additionalProperties: false
      required: [version]
      properties:
        version: { type: integer, format: int32, minimum: 0, description: "0 = mês ainda sem lançamento" }
        receita_bruta: { $ref: "#/components/schemas/MoneyInput" }
        pro_labore: { $ref: "#/components/schemas/MoneyInput" }
        salarios_13_ferias: { $ref: "#/components/schemas/MoneyInput" }
        cpp_recolhida: { $ref: "#/components/schemas/MoneyInput" }
        fgts_recolhido: { $ref: "#/components/schemas/MoneyInput" }
        observacao: { type: [string, "null"], maxLength: 1000 }

    FactorRStatus:
      type: string
      enum: [ok, dados_insuficientes]

    FactorRReason:
      type: string
      enum: [empresa_nova_regra_pendente, rbt12_zero, rbt12_acima_do_limite_do_simples]
      description: |
        Motivo dos dados insuficientes, em ordem de precedência. `empresa_nova_regra_pendente`:
        menos de 12 meses na janela (proporcionalização pendente, P-05 da origem).

    FactorRAnnex:
      type: string
      enum: [III, V]

    FactorRLight:
      type: string
      enum: [vermelho, amarelo, verde]
      description: Semáforo — vermelho abaixo de 28% (Anexo V), amarelo de 28% até a meta, verde na meta.

    FactorRAction:
      type: string
      enum: [reuniao_correcao, vigiar_simular, manter, completar_lancamentos]

    FactorRCalc:
      type: object
      required: [pa, janela_inicio, janela_fim, meses_preenchidos, meses_faltantes, status, motivo, rbt12, fs12, fator_r, anexo, semaforo, folha_minima_28, folha_minima_meta, gap_12m_28, reforco_mensal_28, gap_12m_meta, reforco_mensal_meta, aliquota_efetiva_iii, aliquota_efetiva_v, economia_12m, meta_operacional, cpp_integra_fs12, tabela_vigencia_inicio, regime_no_pa, monitorada]
      properties:
        pa: { $ref: "#/components/schemas/Competence" }
        janela_inicio: { $ref: "#/components/schemas/Competence" }
        janela_fim: { $ref: "#/components/schemas/Competence" }
        meses_preenchidos: { type: array, items: { $ref: "#/components/schemas/Competence" } }
        meses_faltantes:
          description: Meses válidos da janela sem lançamento (mês antes do início da atividade não conta)
          type: array
          items: { $ref: "#/components/schemas/Competence" }
        status: { $ref: "#/components/schemas/FactorRStatus" }
        motivo: { oneOf: [{ $ref: "#/components/schemas/FactorRReason" }, { type: "null" }] }
        rbt12: { $ref: "#/components/schemas/DecimalString" }
        fs12: { $ref: "#/components/schemas/DecimalString" }
        fator_r: { oneOf: [{ $ref: "#/components/schemas/DecimalString" }, { type: "null" }] }
        anexo: { oneOf: [{ $ref: "#/components/schemas/FactorRAnnex" }, { type: "null" }] }
        semaforo: { oneOf: [{ $ref: "#/components/schemas/FactorRLight" }, { type: "null" }] }
        folha_minima_28: { oneOf: [{ $ref: "#/components/schemas/DecimalString" }, { type: "null" }] }
        folha_minima_meta: { oneOf: [{ $ref: "#/components/schemas/DecimalString" }, { type: "null" }] }
        gap_12m_28: { oneOf: [{ $ref: "#/components/schemas/DecimalString" }, { type: "null" }] }
        reforco_mensal_28: { oneOf: [{ $ref: "#/components/schemas/DecimalString" }, { type: "null" }] }
        gap_12m_meta: { oneOf: [{ $ref: "#/components/schemas/DecimalString" }, { type: "null" }] }
        reforco_mensal_meta: { oneOf: [{ $ref: "#/components/schemas/DecimalString" }, { type: "null" }] }
        aliquota_efetiva_iii: { oneOf: [{ $ref: "#/components/schemas/DecimalString" }, { type: "null" }] }
        aliquota_efetiva_v: { oneOf: [{ $ref: "#/components/schemas/DecimalString" }, { type: "null" }] }
        economia_12m:
          description: Economia estimada de DAS em 12 meses (Anexo V menos Anexo III); pode ser negativa na faixa 6
          oneOf: [{ $ref: "#/components/schemas/DecimalString" }, { type: "null" }]
        meta_operacional: { $ref: "#/components/schemas/DecimalString" }
        cpp_integra_fs12: { type: boolean, description: "Política do escritório: a CPP do DAS integra a FS12" }
        tabela_vigencia_inicio: { $ref: "#/components/schemas/Date" }
        regime_no_pa: { oneOf: [{ $ref: "#/components/schemas/TaxRegime" }, { type: "null" }] }
        monitorada:
          type: boolean
          description: Ativa, sujeita ao Fator R e no Simples Nacional no PA, ou seja, está na carteira

    FactorRPortfolioCompany:
      type: object
      required: [id, internal_code, legal_name, trade_name, cnpj]
      properties:
        id: { $ref: "#/components/schemas/Uuid" }
        internal_code: { type: string }
        legal_name: { type: string }
        trade_name: { type: [string, "null"] }
        cnpj: { $ref: "#/components/schemas/Cnpj" }

    FactorRPortfolioLine:
      type: object
      required: [company, pacote_comercial, honorario_mensal, acao, acao_texto, status, motivo, semaforo, fator_r, anexo, rbt12, fs12, reforco_mensal_28, reforco_mensal_meta, meta_operacional, economia_12m, meses_faltantes]
      properties:
        company: { $ref: "#/components/schemas/FactorRPortfolioCompany" }
        pacote_comercial: { oneOf: [{ $ref: "#/components/schemas/FactorRPackage" }, { type: "null" }] }
        honorario_mensal: { $ref: "#/components/schemas/DecimalString" }
        acao: { $ref: "#/components/schemas/FactorRAction" }
        acao_texto: { type: string, examples: ["reunião de correção"] }
        status: { $ref: "#/components/schemas/FactorRStatus" }
        motivo: { oneOf: [{ $ref: "#/components/schemas/FactorRReason" }, { type: "null" }] }
        semaforo: { oneOf: [{ $ref: "#/components/schemas/FactorRLight" }, { type: "null" }] }
        fator_r: { oneOf: [{ $ref: "#/components/schemas/DecimalString" }, { type: "null" }] }
        anexo: { oneOf: [{ $ref: "#/components/schemas/FactorRAnnex" }, { type: "null" }] }
        rbt12: { $ref: "#/components/schemas/DecimalString" }
        fs12: { $ref: "#/components/schemas/DecimalString" }
        reforco_mensal_28: { oneOf: [{ $ref: "#/components/schemas/DecimalString" }, { type: "null" }] }
        reforco_mensal_meta: { oneOf: [{ $ref: "#/components/schemas/DecimalString" }, { type: "null" }] }
        meta_operacional: { $ref: "#/components/schemas/DecimalString" }
        economia_12m: { oneOf: [{ $ref: "#/components/schemas/DecimalString" }, { type: "null" }] }
        meses_faltantes: { type: array, items: { $ref: "#/components/schemas/Competence" } }

    FactorRKPIs:
      type: object
      required: [monitoradas, no_v, no_limite, seguras, dados_insuficientes, economia_em_jogo, honorarios_pacotes]
      properties:
        monitoradas: { type: integer }
        no_v: { type: integer, description: "No Anexo V" }
        no_limite: { type: integer, description: "Amarelo: de 28% até a meta" }
        seguras: { type: integer, description: "Verde: na meta ou acima" }
        dados_insuficientes: { type: integer }
        economia_em_jogo:
          description: Soma da economia positiva das empresas em vermelho e amarelo (12 meses)
          allOf: [{ $ref: "#/components/schemas/DecimalString" }]
        honorarios_pacotes:
          description: Soma dos honorários mensais dos pacotes das empresas monitoradas
          allOf: [{ $ref: "#/components/schemas/DecimalString" }]

    FactorRPortfolio:
      type: object
      required: [pa, meta_operacional, kpis, linhas]
      properties:
        pa: { $ref: "#/components/schemas/Competence" }
        meta_operacional: { $ref: "#/components/schemas/DecimalString" }
        kpis: { $ref: "#/components/schemas/FactorRKPIs" }
        linhas: { type: array, items: { $ref: "#/components/schemas/FactorRPortfolioLine" } }

    FactorRVerdict:
      type: string
      enum: [ja_na_meta, corrigir, nao_forcar]
      description: Veredito do simulador; nulo com dados insuficientes.

    FactorRSimulationInput:
      type: object
      additionalProperties: false
      required: [pa]
      properties:
        pa: { $ref: "#/components/schemas/Competence" }
        meta: { type: [string, "null"], description: "De 0.28 a menos de 1 (até 6 casas); nulo = meta da política", examples: ["0.30"] }
        fracao_pro_labore: { type: [string, "null"], description: "Fração do reforço em pró-labore, de 0 a 1 (padrão 1)" }
        inss: { type: [string, "null"], description: "Alíquota do INSS, de 0 a 1 (padrão 0.11)" }
        irrf: { type: [string, "null"], description: "Alíquota do IRRF, de 0 a 1 (padrão 0.275)" }
        horizonte_meses: { type: [integer, "null"], minimum: 1, maximum: 60, description: "Padrão 12" }

    FactorRSimulation:
      type: object
      required: [simulation_id, trace_id, pa, veredito, texto, parametros, resultado, created_at]
      properties:
        simulation_id: { $ref: "#/components/schemas/Uuid" }
        trace_id: { type: string, description: "Corrida do consultor que fez a simulação" }
        pa: { $ref: "#/components/schemas/Competence" }
        veredito: { oneOf: [{ $ref: "#/components/schemas/FactorRVerdict" }, { type: "null" }] }
        texto: { type: string, description: "Texto do simulador, com o disclaimer do PGDAS-D" }
        parametros:
          type: object
          additionalProperties: true
          description: meta, fracao_pro_labore, inss, irrf, horizonte_meses e piso_economia_anual usados
        resultado:
          type: object
          additionalProperties: true
          description: |
            ResultadoSimulacao da origem: status, motivo, veredito, parametros, fator_atual,
            reforco_12m, reforco_mensal, pro_labore_extra_mensal, pro_labore_extra_horizonte,
            custo_inss, custo_irrf, custo_total, economia_12m, economia_horizonte e liquido. Os
            valores em reais saem em centavos e o fator com 6 casas; o banco guarda o valor exato.
        created_at: { type: string, format: date-time }

    FactorRSimulationList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/FactorRSimulation" } }

    FactorRConsultInput:
      type: object
      additionalProperties: false
      required: [mensagem]
      properties:
        mensagem: { type: string, minLength: 1, maxLength: 1000 }
        company_id: { type: [string, "null"], format: uuid, description: "A empresa da ficha; sem ela, a empresa citada no pedido" }

    FactorRPrioritizeInput:
      type: object
      additionalProperties: false
      required: [mensagem]
      properties:
        mensagem: { type: string, minLength: 1, maxLength: 1000 }
        pa: { oneOf: [{ $ref: "#/components/schemas/Competence" }, { type: "null" }] }

    FactorRAgentResponse:
      type: object
      required: [texto, decisao, trace_id]
      properties:
        texto: { type: string, description: "Texto validado do LLM ou o template, sempre com o disclaimer do PGDAS-D" }
        decisao:
          type: object
          additionalProperties: true
          description: |
            Decisão estruturada com os valores calculados pelo motor (intencao; situação: empresa,
            pa, status, fator_r, anexo, semaforo, rbt12, fs12, gaps, reforços, economia;
            simulação: veredito, simulation_id, reforco_mensal, custo_total, liquido; fila: pa e
            fila com posicao, empresa, semaforo, fator_r, economia_12m e acao; ou erro).
        trace_id: { type: string, description: "Corrida do agente (auditoria local e Langfuse)" }

    PgdasStatus:
      type: string
      enum: [received, parsed, needs_review, linked, rejected]
      description: |
        received: enviado, aguardando o job; needs_review: em revisão (CNPJ fora da carteira,
        confiança abaixo do limiar ou documento sem texto); linked: vinculado a uma empresa;
        rejected: rejeitado pelo analista. parsed é o estado intermediário da origem.

    PgdasUpload:
      type: object
      required: [document_id, job_id, status, duplicate]
      properties:
        document_id: { $ref: "#/components/schemas/Uuid" }
        job_id: { type: [string, "null"], format: uuid, description: "Job pgdas_parse do documento" }
        status: { $ref: "#/components/schemas/PgdasStatus" }
        duplicate: { type: boolean, description: "O arquivo já tinha sido enviado" }

    PgdasFields:
      type: object
      description: Campos lidos pelo parser (nulos até o processamento e quando não encontrados).
      required: [cnpj, pa, rbt12, rpa, fs12, fator_r, das, anexo]
      properties:
        cnpj: { type: [string, "null"], description: "Dígitos do CNPJ lido" }
        pa: { type: [string, "null"], description: "Período de apuração, YYYY-MM", examples: ["2026-09"] }
        rbt12: { type: [string, "null"], examples: ["600000.00"] }
        rpa: { type: [string, "null"], examples: ["50000.00"] }
        fs12: { type: [string, "null"], examples: ["180000.00"] }
        fator_r: { type: [string, "null"], examples: ["0.30"] }
        das: { type: [string, "null"], examples: ["4500.00"] }
        anexo: { type: [string, "null"], examples: ["III"] }

    PgdasIdentification:
      type: object
      description: Dados de cadastro lidos do extrato, fora da confiança e da nota ouro.
      required: [nome_empresarial, sujeita_fator_r, inicio_atividade]
      properties:
        nome_empresarial: { type: [string, "null"] }
        sujeita_fator_r: { type: [boolean, "null"], description: "Fator r numérico = sim; não se aplica = não" }
        inicio_atividade: { type: [string, "null"], description: "YYYY-MM da data de abertura no CNPJ" }

    PgdasPriorSeries:
      type: object
      description: |
        Receita e folha mês a mês dos 12 meses anteriores ao PA, como declaradas (YYYY-MM para o
        valor). Só são gravadas quando conferem: os meses são a janela do PA e a soma bate com o
        RBT12 e a FS12 declarados.
      required: [receitas, folhas, receitas_conferem, folhas_conferem]
      properties:
        receitas: { type: object, additionalProperties: { type: string } }
        folhas: { type: object, additionalProperties: { type: string } }
        receitas_conferem: { type: boolean }
        folhas_conferem: { type: boolean }

    PgdasJobState:
      type: object
      required: [id, status, attempts, max_attempts, last_error_code]
      properties:
        id: { $ref: "#/components/schemas/Uuid" }
        status: { $ref: "#/components/schemas/JobStatus" }
        attempts: { type: integer, format: int32 }
        max_attempts: { type: integer, format: int32 }
        last_error_code: { type: [string, "null"], examples: ["PGDAS_FILE_MISSING"] }

    PgdasSuggestion:
      type: object
      description: Pré-preenchimento do cadastro de uma empresa fora da carteira (só para CNPJ válido).
      required: [cnpj, cnpj_formatado, nome_empresarial, sujeita_fator_r, inicio_atividade]
      properties:
        cnpj: { type: string }
        cnpj_formatado: { type: string, examples: ["11.222.333/0001-81"] }
        nome_empresarial: { type: [string, "null"] }
        sujeita_fator_r: { type: [boolean, "null"] }
        inicio_atividade: { type: [string, "null"] }

    PgdasDocument:
      type: object
      required: [id, status, motivo, company_id, nome_original, mime, tamanho_bytes, campos, confianca_campos, motivos, identificacao, series_anteriores, confianca, parser_version, trace_id, texto_agente, job, sugestao_cadastro, version, created_at, updated_at]
      properties:
        id: { $ref: "#/components/schemas/Uuid" }
        status: { $ref: "#/components/schemas/PgdasStatus" }
        motivo:
          type: [string, "null"]
          description: Motivo da revisão (cnpj_nao_encontrado, confianca_baixa (…), sem_camada_texto, pdf_ilegivel, extracao_excedeu_limites) ou da rejeição
        company_id: { type: [string, "null"], format: uuid, description: "Só no documento vinculado" }
        nome_original: { type: [string, "null"] }
        mime: { type: string, enum: [application/pdf, text/plain] }
        tamanho_bytes: { type: integer, format: int32 }
        campos: { $ref: "#/components/schemas/PgdasFields" }
        confianca_campos: { type: object, additionalProperties: { type: string }, description: "Confiança por campo (1, 0 ou 0.3 com DV inválido)" }
        motivos: { type: array, items: { type: string }, description: "Avisos do parser, ex. cnpj_digito_verificador_invalido" }
        identificacao: { $ref: "#/components/schemas/PgdasIdentification" }
        series_anteriores: { $ref: "#/components/schemas/PgdasPriorSeries" }
        confianca:
          description: Confiança do documento, por regra (0 a 1, 4 casas)
          oneOf: [{ $ref: "#/components/schemas/DecimalString" }, { type: "null" }]
        parser_version: { type: [string, "null"], examples: ["2026.09.3"] }
        trace_id: { type: [string, "null"], description: "Última corrida do agente parser_pgdas sobre o documento" }
        texto_agente: { type: [string, "null"], description: "Texto da última corrida, com o disclaimer do PGDAS-D" }
        job: { oneOf: [{ $ref: "#/components/schemas/PgdasJobState" }, { type: "null" }] }
        sugestao_cadastro: { oneOf: [{ $ref: "#/components/schemas/PgdasSuggestion" }, { type: "null" }] }
        version: { type: integer, format: int32 }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    PgdasDocumentList:
      type: object
      required: [items, total, contagem_por_status]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/PgdasDocument" } }
        total: { type: integer, format: int64, description: "Total com o filtro de status" }
        contagem_por_status: { type: object, additionalProperties: { type: integer, format: int64 } }

    PgdasLinkInput:
      type: object
      additionalProperties: false
      required: [company_id]
      properties:
        company_id: { $ref: "#/components/schemas/Uuid" }

    PgdasReviewInput:
      type: object
      additionalProperties: false
      required: [decisao, motivo]
      properties:
        decisao: { type: string, enum: [rejeitar] }
        motivo: { type: string, minLength: 3, maxLength: 500 }

    PgdasCreateCompanyInput:
      type: object
      additionalProperties: false
      required: [empresa]
      properties:
        empresa: { $ref: "#/components/schemas/CompanyCreate" }
        inicio_atividade: { type: [string, "null"], description: "Início da atividade (YYYY-MM) para a configuração do Fator R" }

    PgdasCreateCompanyResult:
      type: object
      required: [documento, empresa]
      properties:
        documento: { $ref: "#/components/schemas/PgdasDocument" }
        empresa: { $ref: "#/components/schemas/Company" }

  responses:
    BadRequest:
      description: Payload inválido
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Recurso não encontrado
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: Conflito de versão, unicidade ou alerta que exige confirmação
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Gone:
      description: Recurso expirado
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unprocessable:
      description: Regra de negócio violada
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Locked:
      description: Período fechado
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    ServiceUnavailable:
      description: Serviço auxiliar indisponível ou não configurado (ex. gateway de IA)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
