        old_value: { type: [string, "null"] }
        new_value: { type: [string, "null"] }
        old_label: { type: [string, "null"] }
        new_label: { type: [string, "null"] }
        change_source: { type: string, enum: [INLINE, BULK, IMPORT, SYSTEM] }
        override_reason: { type: [string, "null"] }
        user: { $ref: "#/components/schemas/UserRef" }
        created_at: { type: string, format: date-time }

    InstanceHistory:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/HistoryEntry" } }

    UserRole:
      type: string
      enum: [ADMIN, MANAGER, OPERATOR, READ_ONLY]
      description: Perfil (preparado para permissões futuras).

    User:
      type: object
      required: [id, name, email, role, active, created_at, updated_at]
      properties:
        id: { $ref: "#/components/schemas/Uuid" }
        name: { type: string }
        email: { type: [string, "null"] }
        role: { $ref: "#/components/schemas/UserRole" }
        active: { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    UserList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/User" }

    UserCreate:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        name: { type: string, maxLength: 120 }
        email: { type: [string, "null"], maxLength: 200 }
        role: { $ref: "#/components/schemas/UserRole" }

    UserUpdate:
      type: object
      additionalProperties: false
      properties:
        name: { type: string, maxLength: 120 }
        email: { type: [string, "null"], maxLength: 200 }
        role: { $ref: "#/components/schemas/UserRole" }
        active: { type: boolean }

  responses:
    BadRequest:
      description: Payload inválido
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Recurso não encontrado
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: Conflito de versão, unicidade ou alerta que exige confirmação
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Gone:
      description: Recurso expirado
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unprocessable:
      description: Regra de negócio violada
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Locked:
      description: Período fechado
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
