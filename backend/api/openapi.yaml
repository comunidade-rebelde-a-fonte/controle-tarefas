        "404": { $ref: "#/components/responses/NotFound" }

  /company-module-periods/{id}:
    parameters:
      - $ref: "#/components/parameters/IdPath"
    get:
      tags: [periods]
      operationId: getModulePeriod
      summary: Estado do módulo da empresa na competência
      responses:
        "200":
          description: Período
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CompanyModulePeriod" }
        "404": { $ref: "#/components/responses/NotFound" }

  /company-module-periods/{id}/close:
    parameters:
      - $ref: "#/components/parameters/IdPath"
    post:
      tags: [periods]
      operationId: closeModulePeriod
      summary: Fecha o módulo da empresa na competência, sem afetar os demais módulos (CA-013)
      description: |
        No Contábil, a autoridade única da trava da Conciliação (ADR-003): se a empresa usa a
        Conciliação na competência (extrato importado que a cobre ou documento dela), o fechamento
        exige a obrigação Conciliação em status final ou não aplicável (422
        `RECONCILIATION_NOT_FINAL`; TASK-023, D-037, decisão do usuário). Sem Conciliação, o
        Contábil fecha como antes. Fechado, toda mutação da Conciliação na competência responde 423
        `PERIOD_CLOSED` até a reabertura com motivo.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CompanyModulePeriodClose" }
      responses:
        "200":
          description: Período fechado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CompanyModulePeriod" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: >-
            Conflito de versão (VERSION_CONFLICT) ou estágio de fechamento do módulo ainda não
            encerrado sem confirm_set_closing (CLOSING_STATUS_REQUIRED)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422":
          description: >-
            Período já fechado (PERIOD_ALREADY_CLOSED), dependência HARD do estágio de fechamento
            (DEPENDENCY_BLOCKED) ou, no Contábil, a Conciliação usada e não concluída
            (RECONCILIATION_NOT_FINAL)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /company-module-periods/{id}/reopen:
    parameters:
      - $ref: "#/components/parameters/IdPath"
    post:
      tags: [periods]
      operationId: reopenModulePeriod
      summary: Reabre o módulo fechado; o motivo é obrigatório (CA-015)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CompanyModulePeriodReopen" }
      responses:
        "200":
          description: Período reaberto
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CompanyModulePeriod" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422":
          description: Motivo ausente (REASON_REQUIRED) ou período não fechado (PERIOD_NOT_CLOSED)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /company-module-periods/{id}/note:
    parameters:
      - $ref: "#/components/parameters/IdPath"
    patch:
      tags: [periods]
      operationId: updateModulePeriodNote
      summary: Altera a observação geral da empresa no módulo e competência (RN-016)
      requestBody:
        required: true
        content:
