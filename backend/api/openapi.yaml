openapi: 3.1.0
info:
  title: Controle de Obrigações — API
  version: 0.1.0
  description: |
    API REST do Sistema de Controle de Obrigações para Escritório Contábil.

    Convenções [AGENTS.md §8.4]:
    - prefixo `/api/v1`, JSON, campos em inglês `snake_case`;
    - competência no formato `AAAA-MM`; datas civis `AAAA-MM-DD`; instantes em UTC (RFC 3339);
    - erros no envelope `{code, message, details}`, com `message` em português;
    - entidades editáveis usam `version` para concorrência otimista (divergência → `409`).

    Este arquivo é a fonte única do contrato. Os tipos TypeScript do frontend são gerados
    a partir dele (`make gen`).
servers:
  - url: /api/v1

tags:
  - name: system
    description: Estado da aplicação
  - name: users
    description: Usuários e responsáveis (sem login no MVP)
  - name: companies
    description: Cadastro único de empresas
  - name: catalog
    description: Catálogo de obrigações, status e regras de vencimento
  - name: calendar
    description: Calendários e feriados
  - name: settings
    description: Configurações
  - name: imports
    description: Importação de empresas por planilha
  - name: exports
    description: Exportação das grades em XLSX
  - name: credentials
    description: Procurações RFB e certificados digitais
  - name: demo
    description: Dados fictícios de demonstração (somente fora de produção)
  - name: competencies
    description: Competências mensais
  - name: obligations
    description: Instâncias de obrigação (status, detalhes, histórico)
  - name: periods
    description: Fechamento por empresa + módulo + competência, reabertura e observação geral
  - name: grids
    description: Grades dos módulos (colunas do catálogo, linhas por empresa, células com derivados)
  - name: dashboard
    description: Gestão — KPIs, cards, exige atenção, comparação histórica e backlog
  - name: jobs
    description: Fila de processamento assíncrono (TASK-005) — estado de um job e reenvio manual
  - name: ai
    description: |
      Auditoria local das corridas de agente (TASK-009) — trilha local (fonte de verdade), notas
      ouro e humana, status de sincronização com o Langfuse e painel de observabilidade.
  - name: reconciliation
    description: |
      Conciliação (consolidação, TASK-015 em diante) — ingestão manual de extratos e comprovantes,
      com o original imutável no MinIO versionado, e o processamento no worker (TASK-016): triagem,
      extração do extrato com até 3 tentativas e importação só com o saldo fechando em R$ 0,00.
      Estados e tipos usam o vocabulário do Conciliador de origem (D-020).
  - name: factor-r
    description: |
      Fator R (consolidação, TASK-011 a TASK-013) — configuração por empresa, série mensal de
      receita e folha, cálculo do PA, carteira, Inbox PGDAS-D, simulador e agentes consultor e
      priorizador. Os campos do domínio usam os nomes do Fator R de origem e
      do modelo de dados da consolidação (docs/ai-spec/05 §4); valores decimais são strings.

paths:
  /health:
    get:
      tags: [system]
      operationId: getHealth
      summary: Estado da API e do banco de dados
      responses:
        "200":
          description: API e banco disponíveis
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        "503":
          description: Banco de dados indisponível
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"

  /users:
    get:
      tags: [users]
      operationId: listUsers
      summary: Lista usuários/responsáveis
      parameters:
        - name: active
          in: query
          schema: { type: boolean }
      responses:
        "200":
          description: Lista
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserList"
    post:
      tags: [users]
      operationId: createUser
      summary: Cadastra um responsável (sem login)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserCreate"
      responses:
        "201":
          description: Criado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400": { $ref: "#/components/responses/BadRequest" }
        "409": { $ref: "#/components/responses/Conflict" }

  /users/{id}:
    parameters:
      - $ref: "#/components/parameters/IdPath"
    get:
      tags: [users]
      operationId: getUser
      summary: Detalha um usuário
      responses:
        "200":
          description: Usuário
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [users]
      operationId: updateUser
      summary: Altera um usuário (não há exclusão)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserUpdate"
      responses:
        "200":
          description: Atualizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }

  /companies:
    get:
      tags: [companies]
      operationId: listCompanies
      summary: Lista empresas com busca global e filtros
      description: |
        `q` casa nome, razão social, nome fantasia, código e CNPJ com ou sem máscara [PRD §26.5].
        Regime e módulos são os vigentes na competência corrente.
      parameters:
        - { name: q, in: query, schema: { type: string } }
        - { name: cnpj, in: query, schema: { type: string }, description: "Com ou sem máscara" }
        - { name: code, in: query, schema: { type: string } }
        - { name: tax_regime, in: query, schema: { $ref: "#/components/schemas/TaxRegime" } }
        - { name: active, in: query, schema: { type: boolean } }
        - { name: module, in: query, schema: { $ref: "#/components/schemas/ModuleCode" } }
      responses:
        "200":
          description: Lista
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CompanyList" }
        "400": { $ref: "#/components/responses/BadRequest" }
    post:
      tags: [companies]
      operationId: createCompany
      summary: Cadastra empresa com regime inicial (vigência = competência do início do atendimento)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CompanyCreate" }
      responses:
        "201":
          description: Criada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Company" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "409":
          description: CNPJ ou código já cadastrado (`details.conflicting_company`)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /companies/{id}:
    parameters:
      - $ref: "#/components/parameters/IdPath"
    get:
      tags: [companies]
      operationId: getCompany
      summary: Detalha a empresa
      responses:
        "200":
          description: Empresa
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Company" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [companies]
      operationId: updateCompany
      summary: Altera dados cadastrais (exige version)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CompanyUpdate" }
      responses:
        "200":
          description: Atualizada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Company" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /companies/{id}/deactivate:
    parameters:
      - $ref: "#/components/parameters/IdPath"
    post:
      tags: [companies]
      operationId: deactivateCompany
      summary: Inativa a empresa (não há exclusão física)
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                version: { $ref: "#/components/schemas/Version" }
      responses:
        "200":
          description: Inativada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Company" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /companies/{id}/tax-regimes:
    parameters:
      - $ref: "#/components/parameters/IdPath"
    get:
      tags: [companies]
      operationId: listTaxRegimes
      summary: Linha do tempo de regimes tributários
      responses:
        "200":
          description: Linha do tempo (ordem cronológica)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TaxRegimeTimeline" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [companies]
      operationId: changeTaxRegime
      summary: Inclui novo regime a partir de uma competência (encerra o anterior no mês anterior)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TaxRegimeChange" }
      responses:
        "201":
          description: Linha do tempo atualizada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TaxRegimeTimeline" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Unprocessable" }

  /companies/{id}/modules:
    parameters:
      - $ref: "#/components/parameters/IdPath"
    get:
      tags: [companies]
      operationId: getCompanyModules
      summary: Estado dos módulos na competência de referência e histórico de vigências
      responses:
        "200":
          description: Módulos
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CompanyModules" }
        "404": { $ref: "#/components/responses/NotFound" }

  /companies/{id}/modules/{module}:
    parameters:
      - $ref: "#/components/parameters/IdPath"
      - name: module
        in: path
        required: true
        schema: { $ref: "#/components/schemas/ModuleCode" }
    put:
      tags: [companies]
      operationId: setCompanyModule
      summary: Liga/desliga o módulo a partir de uma competência (não reescreve competências geradas)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CompanyModuleChange" }
      responses:
        "200":
          description: Módulos atualizados
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CompanyModules" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Unprocessable" }

  /companies/{id}/obligation-overrides:
    parameters:
      - $ref: "#/components/parameters/IdPath"
    get:
      tags: [companies]
      operationId: getObligationOverrides
      summary: Aplicabilidade de cada tipo do catálogo para a empresa
      responses:
        "200":
          description: Aplicabilidade
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ObligationOverrides" }
        "404": { $ref: "#/components/responses/NotFound" }

  /companies/{id}/obligation-overrides/{obligationTypeId}:
    parameters:
      - $ref: "#/components/parameters/IdPath"
      - name: obligationTypeId
        in: path
        required: true
        schema: { $ref: "#/components/schemas/Uuid" }
    put:
      tags: [companies]
      operationId: setObligationOverride
      summary: Define Padrão / Aplicável / Não se aplica a partir de uma competência
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ObligationOverrideChange" }
      responses:
        "200":
          description: Aplicabilidade atualizada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ObligationOverrides" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Unprocessable" }

  /obligation-types:
    get:
      tags: [catalog]
      operationId: listObligationTypes
      summary: Catálogo de obrigações (com contextos, regras por regime e dependências)
      responses:
        "200":
          description: Tipos
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ObligationTypeList" }
    post:
      tags: [catalog]
      operationId: createObligationType
      summary: Cadastra um tipo de obrigação (sem migration)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ObligationTypeCreate" }
      responses:
        "201":
          description: Criado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ObligationType" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "409": { $ref: "#/components/responses/Conflict" }

  /obligation-types/{id}:
    parameters:
      - $ref: "#/components/parameters/IdPath"
    get:
      tags: [catalog]
      operationId: getObligationType
      summary: Detalha um tipo
      responses:
        "200":
          description: Tipo
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ObligationType" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [catalog]
      operationId: updateObligationType
      summary: Altera um tipo (listas enviadas substituem as atuais; vale para as próximas gerações)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ObligationTypeUpdate" }
      responses:
        "200":
          description: Atualizado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ObligationType" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /status-sets:
    get:
      tags: [catalog]
      operationId: listStatusSets
      summary: Conjuntos de status e metadados
      responses:
        "200":
          description: Conjuntos
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StatusSetList" }

  /due-date-rules:
    get:
      tags: [catalog]
      operationId: listDueDateRules
      summary: Regras de vencimento
      responses:
        "200":
          description: Regras
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DueDateRuleList" }
    post:
      tags: [catalog]
      operationId: createDueDateRule
      summary: Cadastra regra de vencimento
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DueDateRuleInput" }
      responses:
        "201":
          description: Criada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DueDateRule" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "409": { $ref: "#/components/responses/Conflict" }

  /due-date-rules/{id}:
    parameters:
      - $ref: "#/components/parameters/IdPath"
    patch:
      tags: [catalog]
      operationId: updateDueDateRule
      summary: Altera regra de vencimento (exige version)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DueDateRuleInput" }
      responses:
        "200":
          description: Atualizada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DueDateRule" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /calendars:
    get:
      tags: [calendar]
      operationId: listCalendars
      summary: Calendários de feriados (nacional, UF, município)
      responses:
        "200":
          description: Calendários
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CalendarList" }

  /holidays:
    get:
      tags: [calendar]
      operationId: listHolidays
      summary: Feriados
      parameters:
        - { name: calendar_id, in: query, schema: { $ref: "#/components/schemas/Uuid" } }
        - { name: year, in: query, schema: { type: integer } }
      responses:
        "200":
          description: Feriados
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HolidayList" }
        "400": { $ref: "#/components/responses/BadRequest" }
    post:
      tags: [calendar]
      operationId: createHoliday
      summary: Cadastra feriado estadual, municipal ou nacional custom
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/HolidayInput" }
      responses:
        "201":
          description: Criado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Holiday" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "409": { $ref: "#/components/responses/Conflict" }

  /holidays/{id}:
    parameters:
      - $ref: "#/components/parameters/IdPath"
    delete:
      tags: [calendar]
      operationId: deleteHoliday
      summary: Exclui feriado configurável (nacionais do seed não podem ser excluídos)
      responses:
        "204": { description: Excluído }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Unprocessable" }

  /settings/credential-thresholds:
    get:
      tags: [settings]
      operationId: getCredentialThresholds
      summary: Faixas de validade de procurações e certificados
      responses:
        "200":
          description: Faixas
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CredentialThresholds" }
    put:
      tags: [settings]
      operationId: setCredentialThresholds
      summary: Altera as faixas de validade
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CredentialThresholds" }
      responses:
        "200":
          description: Faixas gravadas
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CredentialThresholds" }
        "400": { $ref: "#/components/responses/BadRequest" }

  /settings/ai/models:
    get:
      tags: [settings]
      operationId: listAIModels
      summary: Modelos de IA por alias (Configurações → IA), sem segredos
      description: >-
        Aliases do catálogo, na ordem de exibição, com a escolha gravada na tela, o padrão do
        ambiente e o modelo que as novas corridas usam. Nunca devolve credencial: as chaves dos
        provedores ficam só no ambiente do LiteLLM [REQ-047].
      responses:
        "200":
          description: Configuração dos aliases
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AIModelList" }

  /settings/ai/models/{alias}:
    parameters:
      - $ref: "#/components/parameters/AIAliasPath"
    put:
      tags: [settings]
      operationId: updateAIModel
      summary: Troca o modelo e os parâmetros de um alias (vale para as novas corridas)
      description: >-
        Substitui a configuração do alias, com concorrência otimista por `version`. Mudança no
        modelo efetivo ou nos parâmetros é conferida no gateway antes de gravar: reprovada, 422
        `AI_MODEL_INVALID` com as conferências em `details.checks`; gateway fora do ar, 503.
        Ligar ou desligar o alias não depende do gateway. Campos fora do contrato, como
        `api_key`, são recusados (400). A corrida em andamento mantém o modelo resolvido no início.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AIModelUpdate" }
      responses:
        "200":
          description: Configuração gravada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AIModelAlias" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /settings/ai/models/{alias}/validate:
    parameters:
      - $ref: "#/components/parameters/AIAliasPath"
    post:
      tags: [settings]
      operationId: validateAIModel
      summary: Valida uma configuração no gateway, sem gravar
      description: >-
        Confere o modelo (provedor/modelo, ou o padrão do ambiente) na tabela de modelos do
        LiteLLM: tipo chat, saída estruturada e visão quando o agente exige, e os parâmetros
        escolhidos. Não chama o provedor e não tem custo. Reprovação volta como 200 com `ok: false`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AIModelValidateRequest" }
      responses:
        "200":
          description: Resultado das conferências
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AIModelValidation" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /ai/summary:
    get:
      tags: [ai]
      operationId: getAISummary
      summary: Painel de observabilidade dos agentes (FR-18)
      description: >-
        Corridas nas últimas 24 h e no total, pendências sem nota humana, acerto ouro (ok sobre
        ok mais erro, entre campos comparáveis) e humano (acerto sobre notas), métricas por agente
        e custo e tokens do LLM nos últimos 30 dias, todos da trilha local (o custo é o informado
        pelo gateway).
      responses:
        "200":
          description: Painel
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AISummary" }

  /ai/runs:
    get:
      tags: [ai]
      operationId: listAIRuns
      summary: Corridas de agente, mais recentes primeiro
      parameters:
        - { name: agent, in: query, schema: { type: string, pattern: "^[a-z][a-z0-9_]{1,39}$" } }
        - { name: status, in: query, schema: { $ref: "#/components/schemas/AIRunStatus" } }
        - { name: company_id, in: query, schema: { $ref: "#/components/schemas/Uuid" } }
        - name: without_human_eval
          in: query
          description: Só as corridas sem nota humana
          schema: { type: boolean }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0, default: 0 } }
      responses:
        "200":
          description: Página de corridas
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AIRunList" }
        "400": { $ref: "#/components/responses/BadRequest" }

  /ai/runs/{trace_id}:
    parameters:
      - $ref: "#/components/parameters/TraceIdPath"
    get:
      tags: [ai]
      operationId: getAIRun
      summary: Detalhe da corrida — entrada, saída, decisão, spans, decisões e notas
      description: >-
        Os spans vêm da trilha local: o detalhe não depende do Langfuse estar no ar. O campo
        langfuse_url abre o trace no Langfuse (configuração não secreta).
      responses:
        "200":
          description: Corrida
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AIRunDetail" }
        "404": { $ref: "#/components/responses/NotFound" }

  /ai/runs/{trace_id}/evaluation:
    parameters:
      - $ref: "#/components/parameters/TraceIdPath"
    post:
      tags: [ai]
      operationId: evaluateAIRun
      summary: Registra a nota humana da corrida (acerto, parcial ou erro)
      description: >-
        A nota vale na trilha local e é espelhada no Langfuse como o score categórico human_eval,
        como na origem. Nota erro exige comentário (422 EVAL_COMMENT_REQUIRED).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AIHumanEvalInput" }
      responses:
        "201":
          description: Nota registrada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AIHumanEval" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Unprocessable" }

  /credential-controls:
    get:
      tags: [credentials]
      operationId: listCredentialControls
      summary: Grade de procurações e certificados (empresas ativas com o módulo) [PRD §33]
      parameters:
        - name: filter
          in: query
          required: false
          description: "Filtro rápido: expired, due_N (não vencido e vence em até N dias, 1 a 365), awaiting_client ou no_date."
          schema: { type: string, pattern: "^(expired|awaiting_client|no_date|due_[1-9][0-9]{0,2})$", examples: ["due_30"] }
        - name: type
          in: query
          required: false
          description: Tipo considerado pelo filtro; sem ele, a procuração ou o certificado.
          schema: { $ref: "#/components/schemas/CredentialType" }
      responses:
        "200":
          description: Linhas da grade
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CredentialList" }
        "400": { $ref: "#/components/responses/BadRequest" }

  /companies/{id}/credential-controls:
    parameters:
      - $ref: "#/components/parameters/IdPath"
    get:
      tags: [credentials]
      operationId: getCompanyCredentialControls
      summary: Procuração e certificado da empresa (mesmo sem o módulo ativo)
      responses:
        "200":
          description: Procuração e certificado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CredentialRow" }
        "404": { $ref: "#/components/responses/NotFound" }

  /companies/{id}/credential-controls/{type}:
    parameters:
      - $ref: "#/components/parameters/IdPath"
      - name: type
        in: path
        required: true
        schema: { $ref: "#/components/schemas/CredentialType" }
    put:
      tags: [credentials]
      operationId: updateCredentialControl
      summary: Altera vencimento, etapa de renovação e observação [UC-05]
      description: |
        `version = 0` cria o registro do tipo (item ainda sem dados). `RENEWED` exige uma nova
        `expires_at` e grava o item como `CURRENT` (volta ao acompanhamento normal) [PRD §19.4].
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CredentialUpdate" }
      responses:
        "200":
          description: Item atualizado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CredentialControl" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422":
          description: Renovado sem nova data de validade (RENEWAL_DATE_REQUIRED)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /companies/{id}/credential-controls/{type}/file:
    parameters:
      - $ref: "#/components/parameters/IdPath"
      - name: type
        in: path
        required: true
        schema: { $ref: "#/components/schemas/CredentialType" }
    put:
      tags: [credentials]
      operationId: uploadCredentialFile
      summary: Envia o documento vigente (substitui o anterior) [PRD §19.1, CA-020]
      description: |
        Limite de 10 MB. Procuração: PDF, PNG ou JPEG (pelo conteúdo). Certificado: somente o
        certificado público (.cer/.crt DER, ou PEM só com blocos CERTIFICATE). `.pfx`, `.p12`,
        contêineres PKCS#12 e qualquer chave privada são recusados com `PRIVATE_KEY_REJECTED`
        ("Chaves privadas não são armazenadas pelo sistema.").
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
                version: { type: integer, minimum: 0, description: "Opcional: versão esperada (divergência → 409)" }
      responses:
        "200":
          description: Documento gravado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CredentialControl" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422":
          description: Chave privada (PRIVATE_KEY_REJECTED) ou formato não aceito (UNSUPPORTED_FILE)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    delete:
      tags: [credentials]
      operationId: deleteCredentialFile
      summary: Remove o documento vigente (os demais dados permanecem)
      responses:
        "200":
          description: Item sem documento
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CredentialControl" }
        "404": { $ref: "#/components/responses/NotFound" }

  /imports/companies/template:
    get:
      tags: [imports]
      operationId: downloadImportTemplate
      summary: Modelo XLSX de importação de empresas [PRD §35.3]
      description: |
        Aba "Empresas" com os cabeçalhos do §7.1, regime inicial, tipo de folha e módulos (listas de
        validação para regime, UF, tipo de folha e Sim/Não) e aba "Instruções".
      responses:
        "200":
          description: Planilha modelo
          headers:
            Content-Disposition:
              schema: { type: string }
              description: attachment; filename="modelo-importacao-empresas.xlsx"
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema: { type: string, format: binary }

  /imports/companies/preview:
    post:
      tags: [imports]
      operationId: previewCompanyImport
      summary: Lê, valida e classifica a planilha (nada é gravado) [PRD §35.3, CA-018]
      description: |
        Aceita .xlsx ou .csv (";" ou ",", UTF-8 ou Windows-1252), até 10 MB, no campo `file`.
        Guarda o resultado por 1 hora e devolve o token para a confirmação.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        "200":
          description: Linhas classificadas
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ImportPreview" }
        "400": { $ref: "#/components/responses/BadRequest" }

  /imports/companies/commit:
    post:
      tags: [imports]
      operationId: commitCompanyImport
      summary: Importa, numa transação, as linhas novas e as existentes confirmadas
      description: |
        Linhas com erro e empresas existentes não confirmadas ficam de fora. Em empresa existente
        confirmada, só os dados cadastrais preenchidos são atualizados; regime, módulos e situação
        não mudam pela importação.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ImportCommit" }
      responses:
        "200":
          description: Resumo da importação
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ImportResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "410": { $ref: "#/components/responses/Gone" }
        "422": { $ref: "#/components/responses/Unprocessable" }

  /demo/seed:
    post:
      tags: [demo]
      operationId: loadDemoData
      summary: Carrega as 20 empresas fictícias (idempotente; indisponível em produção)
      responses:
        "200":
          description: Dados carregados
          content:
            application/json:
              schema:
                type: object
                required: [companies]
                properties:
                  companies: { type: integer, description: "Total de empresas após a carga" }
        "404": { $ref: "#/components/responses/NotFound" }

  /competencies:
    get:
      tags: [competencies]
      operationId: listCompetencies
      summary: Competências geradas (mais recente primeiro) com totais
      responses:
        "200":
          description: Competências
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CompetenceList" }

  /competencies/latest:
    get:
      tags: [competencies]
      operationId: getLatestCompetence
      summary: Competência mais recente (garante a corrente antes)
      responses:
        "200":
          description: Competência mais recente e corrente
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LatestCompetence" }

  /competencies/ensure-current:
    post:
      tags: [competencies]
      operationId: ensureCurrentCompetence
      summary: Garante a competência corrente (idempotente)
      responses:
        "200":
          description: Resumo da execução
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EnsureSummary" }

  /obligation-instances/bulk-status:
    post:
      tags: [obligations]
      operationId: bulkChangeObligationStatus
      summary: Aplica o mesmo status a várias instâncias; itens bloqueados são pulados com motivo (CA-016)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BulkStatusChange" }
      responses:
        "200":
          description: Resultado do lote (ou simulação, com dry_run)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BulkStatusResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "409":
          description: Há pré-requisitos SOFT pendentes e a exceção não foi confirmada (DEPENDENCY_WARNING)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /obligation-instances/{id}:
    parameters:
      - $ref: "#/components/parameters/IdPath"
    get:
      tags: [obligations]
      operationId: getObligationInstance
      summary: Instância com os derivados (atraso, final, iniciado)
      responses:
        "200":
          description: Instância
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ObligationInstance" }
        "404": { $ref: "#/components/responses/NotFound" }

  /obligation-instances/{id}/status:
    parameters:
      - $ref: "#/components/parameters/IdPath"
    patch:
      tags: [obligations]
      operationId: changeObligationStatus
      summary: Altera o status (valida conjunto, versão, período e dependências; grava histórico)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StatusChange" }
      responses:
        "200":
          description: Instância e agregado da linha atualizados
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StatusChangeResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Conflito de versão (VERSION_CONFLICT) ou pré-requisitos SOFT pendentes (DEPENDENCY_WARNING)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422":
          description: Status inválido, instância não aplicável ou dependência HARD pendente (DEPENDENCY_BLOCKED)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "423": { $ref: "#/components/responses/Locked" }

  /obligation-instances/{id}/details:
    parameters:
      - $ref: "#/components/parameters/IdPath"
    patch:
      tags: [obligations]
      operationId: updateObligationDetails
      summary: Altera transmissão, protocolo, vencimento efetivo (com motivo) e aplicabilidade
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/InstanceDetails" }
      responses:
        "200":
          description: Instância e agregado da linha atualizados
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StatusChangeResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422":
          description: Campo não permitido para o tipo (FIELD_NOT_ALLOWED) ou vencimento sem motivo (REASON_REQUIRED)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "423": { $ref: "#/components/responses/Locked" }

  /obligation-instances/{id}/history:
    parameters:
      - $ref: "#/components/parameters/IdPath"
    get:
      tags: [obligations]
      operationId: getObligationHistory
      summary: Histórico de alterações da instância (mais recente primeiro)
      responses:
        "200":
          description: Histórico
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InstanceHistory" }
        "404": { $ref: "#/components/responses/NotFound" }

  /company-module-periods/{id}:
    parameters:
      - $ref: "#/components/parameters/IdPath"
    get:
      tags: [periods]
      operationId: getModulePeriod
      summary: Estado do módulo da empresa na competência
      responses:
        "200":
          description: Período
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CompanyModulePeriod" }
        "404": { $ref: "#/components/responses/NotFound" }

  /company-module-periods/{id}/close:
    parameters:
      - $ref: "#/components/parameters/IdPath"
    post:
      tags: [periods]
      operationId: closeModulePeriod
      summary: Fecha o módulo da empresa na competência, sem afetar os demais módulos (CA-013)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CompanyModulePeriodClose" }
      responses:
        "200":
          description: Período fechado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CompanyModulePeriod" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: >-
            Conflito de versão (VERSION_CONFLICT) ou estágio de fechamento do módulo ainda não
            encerrado sem confirm_set_closing (CLOSING_STATUS_REQUIRED)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422":
          description: Período já fechado (PERIOD_ALREADY_CLOSED) ou dependência HARD do estágio de fechamento
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /company-module-periods/{id}/reopen:
    parameters:
      - $ref: "#/components/parameters/IdPath"
    post:
      tags: [periods]
      operationId: reopenModulePeriod
      summary: Reabre o módulo fechado; o motivo é obrigatório (CA-015)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CompanyModulePeriodReopen" }
      responses:
        "200":
          description: Período reaberto
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CompanyModulePeriod" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422":
          description: Motivo ausente (REASON_REQUIRED) ou período não fechado (PERIOD_NOT_CLOSED)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /company-module-periods/{id}/note:
    parameters:
      - $ref: "#/components/parameters/IdPath"
    patch:
      tags: [periods]
      operationId: updateModulePeriodNote
      summary: Altera a observação geral da empresa no módulo e competência (RN-016)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CompanyModulePeriodNote" }
      responses:
        "200":
          description: Período atualizado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CompanyModulePeriod" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /company-module-periods/{id}/events:
    parameters:
      - $ref: "#/components/parameters/IdPath"
    get:
      tags: [periods]
      operationId: listModulePeriodEvents
      summary: Abertura, fechamentos e reaberturas (mais recente primeiro)
      responses:
        "200":
          description: Eventos
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CompanyModulePeriodEvents" }
        "404": { $ref: "#/components/responses/NotFound" }

  /modules/fiscal/grid:
    get:
      tags: [grids]
      operationId: getFiscalGrid
      summary: Grade Fiscal (Normais ou Simples Nacional) com filtros server-side do §26.4
      description: >-
        Colunas vindas do catálogo (display context FISCAL + sort_order); linhas pelas empresas com o
        módulo na competência e o agrupamento pelo regime do snapshot. Atraso, progresso, conclusão,
        "pronto para fechar" e dependências são calculados pela API. A busca livre fica no cliente.
      parameters:
        - $ref: "#/components/parameters/GridCompetence"
        - name: group
          in: query
          required: true
          schema: { type: string, enum: [normal, simples] }
        - $ref: "#/components/parameters/GridTaxRegime"
        - $ref: "#/components/parameters/GridResponsible"
        - $ref: "#/components/parameters/GridStatus"
        - $ref: "#/components/parameters/GridObligationType"
        - $ref: "#/components/parameters/GridClosingStatus"
        - $ref: "#/components/parameters/GridPeriodState"
        - $ref: "#/components/parameters/GridNote"
        - $ref: "#/components/parameters/GridOverdue"
        - $ref: "#/components/parameters/GridPending"
        - $ref: "#/components/parameters/GridNotStarted"
        - $ref: "#/components/parameters/GridReadyToClose"
      responses:
        "200":
          description: Grade
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ModuleGrid" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }

  /modules/declarations/grid:
    get:
      tags: [grids]
      operationId: getDeclarationsGrid
      summary: Grade de Declarações (colunas dinâmicas do catálogo; célula com vencimento, transmissão e protocolo)
      parameters:
        - $ref: "#/components/parameters/GridCompetence"
        - $ref: "#/components/parameters/GridTaxRegime"
        - $ref: "#/components/parameters/GridResponsible"
        - $ref: "#/components/parameters/GridStatus"
        - $ref: "#/components/parameters/GridObligationType"
        - $ref: "#/components/parameters/GridPeriodState"
        - $ref: "#/components/parameters/GridNote"
        - $ref: "#/components/parameters/GridOverdue"
        - $ref: "#/components/parameters/GridPending"
        - $ref: "#/components/parameters/GridNotStarted"
        - $ref: "#/components/parameters/GridReadyToClose"
      responses:
        "200":
          description: Grade
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ModuleGrid" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }

  /modules/payroll/grid:
    get:
      tags: [grids]
      operationId: getPayrollGrid
      summary: Grade da Folha (Tipo de Folha e Fator R do snapshot; Fator R só no Simples)
      parameters:
        - $ref: "#/components/parameters/GridCompetence"
        - $ref: "#/components/parameters/GridTaxRegime"
        - $ref: "#/components/parameters/GridResponsible"
        - $ref: "#/components/parameters/GridStatus"
        - $ref: "#/components/parameters/GridObligationType"
        - $ref: "#/components/parameters/GridPeriodState"
        - $ref: "#/components/parameters/GridNote"
        - $ref: "#/components/parameters/GridOverdue"
        - $ref: "#/components/parameters/GridPending"
        - $ref: "#/components/parameters/GridNotStarted"
        - $ref: "#/components/parameters/GridReadyToClose"
      responses:
        "200":
          description: Grade
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ModuleGrid" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }

  /modules/accounting/grid:
    get:
      tags: [grids]
      operationId: getAccountingGrid
      summary: Grade Contábil (colunas na ordem da sequência; blocked_by por célula)
      parameters:
        - $ref: "#/components/parameters/GridCompetence"
        - $ref: "#/components/parameters/GridTaxRegime"
        - $ref: "#/components/parameters/GridResponsible"
        - $ref: "#/components/parameters/GridStatus"
        - $ref: "#/components/parameters/GridObligationType"
        - $ref: "#/components/parameters/GridPeriodState"
        - $ref: "#/components/parameters/GridNote"
        - $ref: "#/components/parameters/GridOverdue"
        - $ref: "#/components/parameters/GridPending"
