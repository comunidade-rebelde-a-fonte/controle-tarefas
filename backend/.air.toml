# Hot reload da API no container de desenvolvimento (make dev).
root = "."
tmp_dir = "tmp"

[build]
  cmd = "go build -o ./tmp/api ./cmd/api"
  entrypoint = ["./tmp/api", "serve"]
  include_ext = ["go", "sql", "yaml"]
  exclude_dir = ["tmp", "bin", "testdata"]
  exclude_regex = ["_test\\.go$"]
  delay = 500
  # Bind mount no macOS: polling é mais confiável que eventos do sistema de arquivos.
  poll = true
  poll_interval = 1000
  stop_on_error = true

[log]
  time = false

[misc]
  clean_on_exit = true
