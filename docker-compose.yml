# Ambiente de desenvolvimento local. Não usar em produção (ver docker-compose.prod.yml).
name: controle

services:
  db:
    # Imagem oficial Debian (não alpine) por causa das collations ICU.
    image: postgres:16.15-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-controle}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dev-only-change-me}
      POSTGRES_DB: ${POSTGRES_DB:-controle}
      # Ordenação pt-BR com acentos (ex.: razão social).
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale-provider=icu --icu-locale=pt-BR"
      # Timestamps em UTC [PRD §45.2].
      TZ: UTC
      PGTZ: UTC
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Cria controle, controle_e2e e controle_perf (só roda com volume vazio).
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s

  api:
    image: golang:1.26.8-bookworm
    working_dir: /app/backend
    # air é instalado com versão fixada; o cache fica em volumes nomeados.
    command: ["sh", "-c", "go install github.com/air-verse/air@v1.67.4 && exec air -c .air.toml"]
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-controle}:${POSTGRES_PASSWORD:-dev-only-change-me}@db:5432/${POSTGRES_DB:-controle}?sslmode=disable
      APP_ENV: ${APP_ENV:-development}
      APP_TIMEZONE: ${APP_TIMEZONE:-America/Sao_Paulo}
      HTTP_PORT: ${HTTP_PORT:-8080}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      FILE_STORAGE_DIR: /app/storage
      DB_MAX_CONNS: ${DB_MAX_CONNS:-10}
      GOFLAGS: -buildvcs=false
    ports:
      - "${HTTP_PORT:-8080}:${HTTP_PORT:-8080}"
    volumes:
      - ./backend:/app/backend
      - ./storage:/app/storage
      - gomodcache:/go/pkg/mod
      - gobuildcache:/root/.cache/go-build
      - gobin:/go/bin
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:$${HTTP_PORT}/api/v1/health >/dev/null || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 60
      start_period: 30s

volumes:
  pgdata:
  gomodcache:
  gobuildcache:
  gobin:
